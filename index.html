M.push({t:"Processing & composting (deck 3, pp. 2–35)", c:[
{t:"Four routes for processing MSW", h:`
<p class="src">Deck 3 ("MSW Processing"), pp. 2–7.</p>
<div class="dia"><svg viewBox="0 0 570 206" role="img" aria-label="Four processing routes: biological for biodegradables (most acceptable), chemical and physico-chemical not popular for MSW, thermal for combustibles (costliest but rapid)"><rect class="boxa" x="200.0" y="10.0" width="160.0" height="40.0" rx="8"/><text x="280.0" y="34.0" text-anchor="middle">Processing routes</text><path class="arr" d="M280.0,52.0 L74.0,84.0"/><rect class="box" x="10.0" y="86.0" width="128.0" height="34.0" rx="8"/><text x="74.0" y="107.0" text-anchor="middle">Biological</text><text x="74.0" y="140.0" text-anchor="middle">composting</text><text x="74.0" y="155.0" text-anchor="middle">biomethanation</text><text x="74.0" y="180.0" text-anchor="middle" class="a">biodegradables:</text><text x="74.0" y="195.0" text-anchor="middle" class="a">most acceptable</text><path class="arr" d="M280.0,52.0 L212.0,84.0"/><rect class="box" x="148.0" y="86.0" width="128.0" height="34.0" rx="8"/><text x="212.0" y="107.0" text-anchor="middle">Chemical</text><text x="212.0" y="140.0" text-anchor="middle">—</text><text x="212.0" y="180.0" text-anchor="middle" class="m">not popular</text><text x="212.0" y="195.0" text-anchor="middle" class="m">for MSW</text><path class="arr" d="M280.0,52.0 L350.0,84.0"/><rect class="box" x="286.0" y="86.0" width="128.0" height="34.0" rx="8"/><text x="350.0" y="107.0" text-anchor="middle">Physico-chemical</text><text x="350.0" y="140.0" text-anchor="middle">—</text><text x="350.0" y="180.0" text-anchor="middle" class="m">not popular</text><text x="350.0" y="195.0" text-anchor="middle" class="m">for MSW</text><path class="arr" d="M280.0,52.0 L488.0,84.0"/><rect class="box" x="424.0" y="86.0" width="128.0" height="34.0" rx="8"/><text x="488.0" y="107.0" text-anchor="middle">Thermal</text><text x="488.0" y="140.0" text-anchor="middle">incineration</text><text x="488.0" y="155.0" text-anchor="middle">gasification, pyrolysis</text><text x="488.0" y="180.0" text-anchor="middle" class="b">combustibles:</text><text x="488.0" y="195.0" text-anchor="middle" class="b">costliest but rapid</text></svg></div>
<ul>
<li><b>Biological route</b>: for the <b>biodegradable</b> part. The <b>most acceptable</b> option. Composting and biomethanation.</li>
<li><b>Chemical route</b> and <b>physico-chemical route</b>: <b>not popular</b> for MSW.</li>
<li><b>Thermal route</b>: for the <b>combustible</b> part. <b>Costliest, but rapid.</b> Incineration, gasification, pyrolysis.</li>
</ul>
<h3>Managing biodegradable waste right at the source</h3>
<p>The Green Kerala Mission photos (pp. 5–6) show small home and community units: <b>pot composting, bucket composting, pipe composting, small biomethanation units, rotary composters</b>. This is the "decentralised" processing the 2016 and 2026 rules prefer.</p>`},
{t:"What composting is", h:`
<p class="src">Deck 3, pp. 8–14.</p>
<ul>
<li><b>Composting</b>: an organised method of producing compost by <b>adopting and accelerating the natural decomposition</b> process.</li>
<li><b>Compost</b>: an organic manure containing <b>N, P, K</b> and other micro-nutrients.</li>
<li>Compost should be used <b>along with chemical fertilisers</b> for the best results. It does not replace them.</li>
</ul>
<h3>Composting techniques</h3>
<ul>
<li><b>Anaerobic</b> composting (no air)</li>
<li><b>Aerobic</b> composting (with air)
<ul><li>Conventional <b>windrow</b> composting (long heaps in the open)</li>
<li><b>Rapid</b> composting: <b>vermi-composting</b> (with earthworms) and <b>mechanical composting</b> (in a rotating drum)</li></ul></li>
</ul>
<h3>How microbes grow in a batch</h3>
<div class="dia"><svg viewBox="0 0 560 300" role="img" aria-label="Batch growth of microbes: acclimatisation, log growth, stationary phase, endogenous decay, ending in compost"><path class="ax" d="M64.0,24.0 L64.0,256.0 L530.0,256.0"/><text x="530.0" y="288.0" text-anchor="end" class="m">Time (days)</text><text x="16.0" y="16.0" class="m">Live microbes</text><path class="c1" d="M64.0,243.5 L66.9,243.5 L69.8,243.4 L72.7,243.3 L75.7,243.2 L78.6,243.0 L81.5,242.8 L84.4,242.6 L87.3,242.3 L90.2,241.9 L93.1,241.5 L96.0,240.9 L98.9,240.2 L101.9,239.3 L104.8,238.2 L107.7,236.8 L110.6,235.1 L113.5,233.0 L116.4,230.5 L119.3,227.5 L122.2,223.8 L125.2,219.4 L128.1,214.3 L131.0,208.3 L133.9,201.4 L136.8,193.6 L139.7,185.0 L142.6,175.7 L145.6,165.8 L148.5,155.6 L151.4,145.4 L154.3,135.2 L157.2,125.5 L160.1,116.4 L163.0,108.1 L165.9,100.6 L168.9,94.0 L171.8,88.3 L174.7,83.4 L177.6,79.3 L180.5,75.9 L183.4,73.0 L186.3,70.6 L189.2,68.7 L192.2,67.1 L195.1,65.9 L198.0,64.8 L200.9,64.0 L203.8,63.3 L206.7,62.8 L209.6,62.4 L212.5,62.0 L215.5,61.7 L218.4,61.5 L221.3,61.3 L224.2,61.2 L227.1,61.1 L230.0,61.0 L232.9,60.9 L235.8,60.9 L238.8,60.8 L241.7,60.8 L244.6,60.7 L247.5,60.7 L250.4,60.7 L253.3,62.5 L256.2,65.0 L259.1,68.0 L262.0,71.2 L265.0,74.6 L267.9,78.1 L270.8,81.7 L273.7,85.5 L276.6,89.2 L279.5,93.1 L282.4,96.9 L285.4,100.8 L288.3,104.6 L291.2,108.5 L294.1,112.3 L297.0,116.1 L299.9,119.9 L302.8,123.6 L305.7,127.3 L308.6,131.0 L311.6,134.6 L314.5,138.1 L317.4,141.6 L320.3,145.0 L323.2,148.4 L326.1,151.7 L329.0,154.9 L331.9,158.1 L334.9,161.2 L337.8,164.3 L340.7,167.2 L343.6,170.1 L346.5,173.0 L349.4,175.7 L352.3,178.4 L355.2,181.0 L358.2,183.6 L361.1,186.1 L364.0,188.5 L366.9,190.9 L369.8,193.2 L372.7,195.4 L375.6,197.6 L378.6,199.7 L381.5,201.7 L384.4,203.7 L387.3,205.6 L390.2,207.4 L393.1,209.3 L396.0,211.0 L398.9,212.7 L401.8,214.3 L404.8,215.9 L407.7,217.4 L410.6,218.9 L413.5,220.3 L416.4,221.7 L419.3,223.1 L422.2,224.4 L425.2,225.6 L428.1,226.8 L431.0,228.0 L433.9,229.1 L436.8,230.2 L439.7,231.2 L442.6,232.2 L445.5,233.2 L448.4,234.1 L451.4,235.0 L454.3,235.9 L457.2,236.7 L460.1,237.5 L463.0,238.3 L465.9,239.0 L468.8,239.7 L471.8,240.4 L474.7,241.1 L477.6,241.7 L480.5,242.3 L483.4,242.9 L486.3,243.5 L489.2,244.0 L492.1,244.6 L495.1,245.0 L498.0,245.5 L500.9,246.0 L503.8,246.4 L506.7,246.8 L509.6,247.3 L512.5,247.6 L515.4,248.0 L518.3,248.4 L521.3,248.7 L524.2,249.0 L527.1,249.4 L530.0,249.7"/><text x="68.7" y="229.3" text-anchor="start" class="m">acclimatisation</text><text x="137.9" y="151.0" text-anchor="end" class="">log growth</text><text x="211.6" y="50.6" text-anchor="middle" class="">stationary phase</text><text x="351.6" y="162.1" text-anchor="start" class="">endogenous decay</text><text x="530.0" y="233.7" text-anchor="end" class="a">→ compost</text></svg></div>
<p>Put waste in a closed batch and the microbes first <b>acclimatise</b> (get used to it), then grow fast (<b>log growth</b>), level off (<b>stationary phase</b>) when food runs short, and finally die back (<b>endogenous decay</b>) as they eat their own cell material. What remains is compost.</p>`},
{t:"Aerobic vs anaerobic composting", h:`
<div class="tw"><table>
<tr><th></th><th>Aerobic</th><th>Anaerobic</th></tr>
<tr><td>Microbes</td><td>Aerobic (need oxygen)</td><td>Anaerobic (no oxygen)</td></tr>
<tr><td>Reaction</td><td>Oxidation; carbon is the energy source</td><td>Mostly reduction</td></tr>
<tr><td>End products</td><td><b>CO₂, NH₃, nitrates</b>, etc.</td><td><b>CH₄, CO₂, H₂S</b>, etc.</td></tr>
<tr><td>Heat</td><td>Exothermic, temperature rises: <b>~490–680 kcal per g-mole of glucose</b></td><td>Negligible rise: <b>~26 kcal per g-mole of glucose</b></td></tr>
<tr><td>Pathogens</td><td><b>All killed</b></td><td><b>Not killed</b></td></tr>
<tr><td>Time</td><td><b>2–2.5 months</b></td><td><b>4–6 months</b></td></tr>
<tr><td>Smell</td><td>No foul smell</td><td>Odour problem</td></tr>
<tr><td>Space</td><td>—</td><td>Large space needed</td></tr>
</table></div>
<h3>How long each method takes (waste → ripe compost)</h3>
${bars([["Anaerobic",150,"4–6 months"],["Aerobic windrow",68,"2–2.5 months"],["Vermi-composting",38,"1–1.5 months"],["Rotary drum",17,"2–3 weeks"]],150,"","","wide")}
<div class="key">For MSW on a <b>municipal scale, aerobic composting is preferred</b>: faster, no smell, kills pathogens.</div>
<div class="hook">Aerobic = <b>A</b>ir = <b>A</b>ll pathogens killed, <b>hot</b>, 2 months. Anaerobic = no air = <b>smelly, slow, cold</b>, makes methane, 4–6 months.</div>`},
{t:"Factors 1–3: microbes, shredding, C/N", h:`
<p class="src">Deck 3, pp. 15–21. The seven factors: <b>microorganisms, shredding, C/N, temperature, moisture, windrow size, aeration/turning</b>.</p>
<div class="hook">"<b>M</b>y <b>S</b>hredded <b>C</b>ompost <b>T</b>urns <b>M</b>oist <b>W</b>ith <b>A</b>ir": Microbes, Shredding, C/N, Temperature, Moisture, Windrow, Aeration.</div>
<h3>1. Microorganisms</h3>
<ul>
<li>Many kinds take part: <b>bacteria, actinomycetes, fungi</b> and others.</li>
<li>Early stage: mostly <b>mesophilic</b> (30–40 °C). Then mostly <b>thermophilic</b> bacteria and fungi (60–70 °C). Final stage: mesophilic again.</li>
<li><b>Bacteria</b> break down mostly <b>protein</b> and other organic matter. <b>Fungi and actinomycetes</b> break down <b>lignin and cellulose</b> (the tough woody parts).</li>
<li>Most of the organisms needed are already <b>in the MSW itself</b>. Inoculums and enzymes are sold to speed things up; they are really needed for <b>agricultural and industrial wastes</b>.</li>
</ul>
<h3>2. Shredding</h3>
<ul>
<li>Breaks the plants' natural resistance to microbes, gives a <b>larger surface area</b>, better oxygen supply, uniform and rapid decay, a more uniform material, and better fly and moisture control.</li>
<li>Desirable size: <b>less than 2 inches</b>. For flower gardens and lawns, compost should be <b>&lt; 1 cm</b>.</li>
</ul>
<h3>3. C/N ratio</h3>
<div class="dia"><svg viewBox="0 0 620 226" role="img" aria-label="C to N ratio: raw waste should be about 30 (26 to 32); add carbon if low, nitrogen if high. Ripe compost should be 16 to 20"><text x="20.0" y="30.0" text-anchor="start" style="font-weight:600">Raw waste going in</text><rect class="z3" x="321.2" y="46.0" width="67.2" height="28.0" rx="0"/><path class="ax" d="M30.0,60.0 L590.0,60.0"/><path class="ax" d="M30.0,56.0 L30.0,64.0"/><text x="30.0" y="80.0" text-anchor="middle" class="m">0</text><path class="ax" d="M142.0,56.0 L142.0,64.0"/><text x="142.0" y="80.0" text-anchor="middle" class="m">10</text><path class="ax" d="M254.0,56.0 L254.0,64.0"/><text x="254.0" y="80.0" text-anchor="middle" class="m">20</text><path class="ax" d="M366.0,56.0 L366.0,64.0"/><text x="366.0" y="80.0" text-anchor="middle" class="m">30</text><path class="ax" d="M478.0,56.0 L478.0,64.0"/><text x="478.0" y="80.0" text-anchor="middle" class="m">40</text><path class="ax" d="M590.0,56.0 L590.0,64.0"/><text x="590.0" y="80.0" text-anchor="middle" class="m">50</text><text x="354.8" y="42.0" text-anchor="middle" class="a">ideal ≈ 30 (26–32)</text><text x="30.0" y="102.0" text-anchor="start" class="b">too low → add C: straw, sawdust, paper</text><text x="590.0" y="102.0" text-anchor="end" class="b">too high → add N: blood, sludge, urine</text><text x="20.0" y="140.0" text-anchor="start" style="font-weight:600">Finished (ripe) compost</text><rect class="z3" x="209.2" y="156.0" width="44.8" height="28.0" rx="0"/><path class="ax" d="M30.0,170.0 L590.0,170.0"/><path class="ax" d="M30.0,166.0 L30.0,174.0"/><text x="30.0" y="190.0" text-anchor="middle" class="m">0</text><path class="ax" d="M142.0,166.0 L142.0,174.0"/><text x="142.0" y="190.0" text-anchor="middle" class="m">10</text><path class="ax" d="M254.0,166.0 L254.0,174.0"/><text x="254.0" y="190.0" text-anchor="middle" class="m">20</text><path class="ax" d="M366.0,166.0 L366.0,174.0"/><text x="366.0" y="190.0" text-anchor="middle" class="m">30</text><path class="ax" d="M478.0,166.0 L478.0,174.0"/><text x="478.0" y="190.0" text-anchor="middle" class="m">40</text><path class="ax" d="M590.0,166.0 L590.0,174.0"/><text x="590.0" y="190.0" text-anchor="middle" class="m">50</text><text x="231.6" y="152.0" text-anchor="middle" class="a">best 16–20</text><text x="30.0" y="212.0" text-anchor="start" class="b">much lower → doesn't improve soil</text><text x="590.0" y="212.0" text-anchor="end" class="b">above 20 → N-robbing in soil</text></svg></div>
<ul>
<li>What matters is the <b>available</b> C/N, because not all carbon can be broken down.</li>
<li>Raw waste: <b>C/N = 30 is ideal</b> (range 26–32).</li>
<li>C/N ≫ 30 → add N sources: blood, sewage sludge, slaughterhouse waste, fish scrap, urine.</li>
<li>C/N ≪ 30 → add C sources: straw, sawdust, paper.</li>
<li>Ripe compost: <b>C/N 16–20</b> is best.
<ul><li>Above 20 → <b>nitrogen robbing</b>: the extra carbon makes soil microbes take N from the soil to build their cells, so plants get N late.</li>
<li>Well below 20 → the compost can't improve soil structure much.</li></ul></li>
</ul>`},
{t:"Factors 4–7: temperature, moisture, windrow, turning", h:`
<p class="src">Deck 3, pp. 22–27.</p>
<h3>4. Temperature</h3>
<div class="dia"><svg viewBox="0 0 560 300" role="img" aria-label="Aerobic composting temperature rises from mesophilic 30 to 40 degrees to thermophilic 60 to 70, then falls back; optimum 50 to 60 kills pathogens in 5 to 7 days"><path class="ax" d="M56.0,24.0 L56.0,256.0 L536.0,256.0"/><text x="536.0" y="288.0" text-anchor="end" class="m">Days of windrow composting</text><text x="8.0" y="16.0" class="m">Temperature (°C)</text><path class="f1" d="M56.0,140.0 L536.0,140.0 L536.0,101.3 L56.0,101.3Z"/><path class="bad" d="M56.0,62.7 L536.0,62.7"/><path class="c2" d="M56.0,214.0 L59.0,212.9 L62.0,211.8 L65.0,210.5 L68.0,209.2 L71.0,207.8 L74.0,206.3 L77.0,204.7 L80.0,203.0 L83.0,201.2 L86.0,199.2 L89.0,197.2 L92.0,195.1 L95.0,192.8 L98.0,190.5 L101.0,188.0 L104.0,185.5 L107.0,182.8 L110.0,180.0 L113.0,177.1 L116.0,174.2 L119.0,171.1 L122.0,168.0 L125.0,164.7 L128.0,161.4 L131.0,158.0 L134.0,154.6 L137.0,151.1 L140.0,147.6 L143.0,144.1 L146.0,140.5 L149.0,136.9 L152.0,133.3 L155.0,129.8 L158.0,126.3 L161.0,122.8 L164.0,119.3 L167.0,116.0 L170.0,112.7 L173.0,109.6 L176.0,106.5 L179.0,103.6 L182.0,100.8 L185.0,98.1 L188.0,95.7 L191.0,93.3 L194.0,91.2 L197.0,89.3 L200.0,87.6 L203.0,86.1 L206.0,84.8 L209.0,83.8 L212.0,83.0 L215.0,82.4 L218.0,82.1 L221.0,82.0 L224.0,82.1 L227.0,82.3 L230.0,82.6 L233.0,83.0 L236.0,83.5 L239.0,84.1 L242.0,84.9 L245.0,85.7 L248.0,86.7 L251.0,87.7 L254.0,88.9 L257.0,90.1 L260.0,91.4 L263.0,92.9 L266.0,94.4 L269.0,96.0 L272.0,97.7 L275.0,99.5 L278.0,101.3 L281.0,103.2 L284.0,105.2 L287.0,107.2 L290.0,109.3 L293.0,111.5 L296.0,113.6 L299.0,115.9 L302.0,118.2 L305.0,120.5 L308.0,122.8 L311.0,125.2 L314.0,127.6 L317.0,130.0 L320.0,132.4 L323.0,134.8 L326.0,137.3 L329.0,139.7 L332.0,142.2 L335.0,144.6 L338.0,147.0 L341.0,149.4 L344.0,151.8 L347.0,154.2 L350.0,156.5 L353.0,158.9 L356.0,161.2 L359.0,163.4 L362.0,165.7 L365.0,167.9 L368.0,170.0 L371.0,172.1 L374.0,174.2 L377.0,176.2 L380.0,178.2 L383.0,180.2 L386.0,182.1 L389.0,183.9 L392.0,185.7 L395.0,187.5 L398.0,189.2 L401.0,190.8 L404.0,192.4 L407.0,194.0 L410.0,195.5 L413.0,197.0 L416.0,198.4 L419.0,199.7 L422.0,201.0 L425.0,202.3 L428.0,203.5 L431.0,204.6 L434.0,205.7 L437.0,206.8 L440.0,207.8 L443.0,208.8 L446.0,209.7 L449.0,210.6 L452.0,211.5 L455.0,212.3 L458.0,213.1 L461.0,213.8 L464.0,214.5 L467.0,215.1 L470.0,215.8 L473.0,216.4 L476.0,216.9 L479.0,217.5 L482.0,218.0 L485.0,218.4 L488.0,218.9 L491.0,219.3 L494.0,219.7 L497.0,220.1 L500.0,220.4 L503.0,220.8 L506.0,221.1 L509.0,221.4 L512.0,221.6 L515.0,221.9 L518.0,222.1 L521.0,222.4 L524.0,222.6 L527.0,222.8 L530.0,222.9 L533.0,223.1 L536.0,223.3"/><text x="50.0" y="221.3" text-anchor="end" class="m">30</text><text x="50.0" y="182.7" text-anchor="end" class="m">40</text><text x="50.0" y="144.0" text-anchor="end" class="m">50</text><text x="50.0" y="105.3" text-anchor="end" class="m">60</text><text x="50.0" y="66.7" text-anchor="end" class="m">70</text><text x="529.1" y="124.7" text-anchor="end" class="a">optimum 50–60 °C</text><text x="529.1" y="56.7" text-anchor="end" class="b">above 70 °C: enzymes / microbes inactivated</text><text x="83.4" y="194.1" text-anchor="start" class="">mesophilic</text><text x="83.4" y="208.1" text-anchor="start" class="m">30–40 °C</text><text x="186.3" y="78.1" text-anchor="end" class="">thermophilic 60–70 °C</text><text x="467.4" y="194.1" text-anchor="middle" class="">mesophilic again</text></svg></div>
<p class="src">The curve's shape is illustrative; the temperature bands are from the slides.</p>
<ul>
<li>MSW insulates well, so the heap heats up in aerobic composting. It can reach <b>65–70 °C</b>.</li>
<li>Optimum: <b>50–60 °C</b>. Above <b>70 °C</b>, enzymes and organisms get inactivated.</li>
<li>Keep <b>50–60 °C for 5–7 days</b> and all pathogens are killed.</li>
<li>No temperature rise in anaerobic composting.</li>
</ul>
<h3>5. Moisture</h3>
<ul>
<li>Optimum: <b>45–55% by weight</b>.</li>
<li>Too dry → the organisms' needs aren't met. If below <b>40%</b>, just add water. <b>Below 12%</b>, there is no composting at all.</li>
<li>Too wet → water blocks the pores, oxygen can't get in, and the heap may turn <b>anaerobic</b>.</li>
</ul>
<h3>6. Windrow size</h3>
<div class="dia"><svg viewBox="0 0 600 220" role="img" aria-label="Windrow cross-section: height between 1 to 1.2 and 1.5 to 1.8 metres, width 2.4 to 3.6 metres"><path class="f2" d="M70,170 L190,40 L330,40 L450,170 Z"/><path class="ink" d="M70,170 L190,40 L330,40 L450,170"/><path class="ax" d="M20.0,170.0 L520.0,170.0"/><path class="arr" d="M480.0,105.0 L480.0,42.0"/><path class="arr" d="M480.0,105.0 L480.0,168.0"/><text x="490.0" y="100.0" text-anchor="start">height</text><text x="490.0" y="116.0" text-anchor="start" class="a">1–1.2 m min</text><text x="490.0" y="132.0" text-anchor="start" class="a">1.5–1.8 m max</text><path class="arr" d="M260.0,190.0 L72.0,190.0"/><path class="arr" d="M260.0,190.0 L448.0,190.0"/><text x="260.0" y="210.0" text-anchor="middle" class="a">width 2.4–3.6 m</text><text x="260.0" y="100.0" text-anchor="middle">shredded MSW,</text><text x="260.0" y="116.0" text-anchor="middle">loosely packed</text><text x="20.0" y="24.0" text-anchor="start" class="b">too tall → self-weight squeezes pores shut</text><text x="300.0" y="24.0" text-anchor="start" class="b">too short → loses heat, stays cool</text></svg></div>
<ul>
<li>Material must be <b>loosely packed</b>.</li>
<li>Too tall → its own weight compresses it and the pore space shrinks. Too short → too much heat loss and the temperature falls below optimum.</li>
<li>For simple MSW windrows: height <b>not more than 1.5–1.8 m</b>, <b>not less than 1–1.2 m</b>; width <b>2.4–3.6 m</b>. It can be taller in cold seasons or cold countries.</li>
</ul>
<h3>7. Turning / mixing</h3>
<ul>
<li>Done by hand or by machine, usually <b>once every 5–7 days</b>.</li>
<li>Supplies oxygen and keeps the temperature in the optimum range.</li>
</ul>
<h3>Blending with soil</h3>
<p>Sometimes soil is mixed in: to reduce moisture, absorb NH₃, buffer acidic conditions, slow fermentation, improve appearance, and make handling easier. Keep soil <b>&lt; 10% by weight</b>.</p>`},
{t:"Ripe compost, compost plants and separation", h:`
<p class="src">Deck 3, pp. 27–35.</p>
<h3>Ripe (finished) compost</h3>
<ul>
<li>Colour: <b>black-brown or black</b>. Odour: <b>earthy</b>. <b>Crumbly</b>; neither very dry nor watery.</li>
<li>Weight: about <b>50% of the original waste</b>.</li>
<li><b>N, P, K ~1% each</b>. <b>C/N &lt; 20</b>.</li>
</ul>
<h3>MSW compost plant</h3>
<div class="dia"><svg viewBox="0 0 570 194" role="img" aria-label="Compost plant: shred, windrows, green compost, maturation to ripe compost, with separation either before or after composting"><rect class="boxa" x="10.0" y="40.0" width="100.0" height="44.0" rx="8"/><text x="60.0" y="66.0" text-anchor="middle">Mixed MSW</text><path class="arr" d="M112.0,62.0 L138.0,62.0"/><rect class="box" x="140.0" y="40.0" width="120.0" height="44.0" rx="8"/><text x="200.0" y="58.5" text-anchor="middle">Shred</text><text x="200.0" y="73.5" text-anchor="middle" class="m">&lt; 2 inch</text><path class="arr" d="M262.0,62.0 L288.0,62.0"/><rect class="box" x="290.0" y="40.0" width="130.0" height="44.0" rx="8"/><text x="355.0" y="58.5" text-anchor="middle">Windrows</text><text x="355.0" y="73.5" text-anchor="middle" class="m">turn every 5–7 d</text><path class="arr" d="M422.0,62.0 L448.0,62.0"/><rect class="box" x="450.0" y="40.0" width="110.0" height="44.0" rx="8"/><text x="505.0" y="66.0" text-anchor="middle">Green compost</text><path class="arr" d="M505.0,86.0 L505.0,118.0"/><rect class="boxa" x="450.0" y="120.0" width="110.0" height="44.0" rx="8"/><text x="505.0" y="138.5" text-anchor="middle">Maturation</text><text x="505.0" y="153.5" text-anchor="middle" class="m">→ ripe compost</text><rect class="box" x="140.0" y="120.0" width="280.0" height="44.0" rx="8"/><text x="280.0" y="138.5" text-anchor="middle">Separation: air classifier, magnet,</text><text x="280.0" y="153.5" text-anchor="middle">eddy current, screens, hand-picking</text><path class="dash" d="M200.0,86.0 L200.0,118.0"/><path class="dash" d="M360.0,86.0 L360.0,118.0"/><text x="280.0" y="184.0" text-anchor="middle" class="m">separation can be before or after composting; it is the biggest cost</text></svg></div>
<ul>
<li>The <b>major expense</b> (capital and running) is <b>separating</b> the biodegradables from the inerts.</li>
<li>Separation can be done before or after composting, and often needs several techniques:</li>
</ul>
<table>
<tr><th>Technique</th><th>Separates</th></tr>
<tr><td><b>Air classification</b></td><td>Light materials</td></tr>
<tr><td><b>Magnetic separator</b></td><td>Ferrous metals</td></tr>
<tr><td><b>Eddy current separator</b></td><td>Non-ferrous metals</td></tr>
<tr><td><b>Screens</b> (e.g. a rotating trommel)</td><td>By size</td></tr>
<tr><td><b>Manual separation</b></td><td>Things that can be hand-picked</td></tr>
</table>
<h3>How an air classifier works</h3>
<div class="dia"><svg viewBox="0 0 640 326" role="img" aria-label="Air classifier: waste enters through a rotating valve, air rises up the column carrying light material out the top; heavy material falls to the bottom"><path class="ink" d="M240.0,40.0 L240.0,250.0"/><path class="ink" d="M320.0,40.0 L320.0,250.0"/><path class="ink" d="M240.0,40.0 L200.0,10.0"/><path class="ink" d="M320.0,40.0 L360.0,10.0"/><path class="ink" d="M240.0,250.0 L200.0,296.0"/><path class="ink" d="M320.0,250.0 L360.0,296.0"/><path class="ink" d="M255.0,296.0 L280.0,262.0 L305.0,296.0"/><circle cx="240" cy="70" r="11" class="boxa"/><path class="arrb" d="M150.0,40.0 L232.0,64.0"/><text x="146.0" y="36.0" text-anchor="end">MSW in</text><text x="222.0" y="92.0" text-anchor="end" class="m">rotating</text><text x="222.0" y="106.0" text-anchor="end" class="m">no-return valve</text><path class="arrw" d="M222.0,300.0 L258.0,256.0"/><text x="192.0" y="316.0" text-anchor="end">air from a blower</text><path class="arrw" d="M270.0,220.0 L270.0,120.0"/><path class="arrw" d="M292.0,220.0 L292.0,120.0"/><path class="arrw" d="M285.0,60.0 L325.0,8.0"/><text x="366.0" y="22.0" text-anchor="start" class="a">air + light fraction out</text><text x="366.0" y="38.0" text-anchor="start" class="m">(paper, plastic film)</text><path class="arrb" d="M298.0,258.0 L336.0,302.0"/><text x="374.0" y="300.0" text-anchor="start" class="b">heavy fraction falls out</text><text x="374.0" y="316.0" text-anchor="start" class="m">(stones, glass, metal)</text><text x="400.0" y="150.0" text-anchor="start">light pieces are carried up,</text><text x="400.0" y="166.0" text-anchor="start">heavy pieces sink against the air</text></svg></div>
<p>Air from a blower rises up a vertical column. Waste drops in through a rotating no-return valve. <b>Light</b> pieces (paper, film) are carried up and out with the air. <b>Heavy</b> pieces (stones, glass, metal) fall out of the bottom. It separates by <b>density</b>.</p>
<h3>Magnet drum and eddy current separator</h3>
<div class="dia"><svg viewBox="0 0 600 220" role="img" aria-label="Magnet drum pulls out iron and steel; the eddy current rotor then repels aluminium and copper forward, non-metals drop straight down"><path class="ink" d="M20.0,60.0 L110.0,60.0"/><path class="arrb" d="M30.0,46.0 L100.0,46.0"/><text x="20.0" y="36.0" text-anchor="start">mixed dry waste</text><circle cx="130" cy="74" r="20" class="boxa"/><text x="130.0" y="78.0" text-anchor="middle" class="a">N S</text><text x="156.0" y="72.0" text-anchor="start">magnet drum</text><path class="arrb" d="M118.0,94.0 L100.0,158.0"/><text x="100.0" y="176.0" text-anchor="middle" class="b">ferrous (iron, steel)</text><path class="ink" d="M150.0,92.0 L370.0,92.0"/><circle cx="390" cy="104" r="20" class="boxa"/><text x="390.0" y="108.0" text-anchor="middle" class="a">≈</text><text x="390.0" y="60.0" text-anchor="middle">eddy current rotor</text><path class="arrb" d="M412.0,92.0 L500.0,120.0 L520.0,175.0"/><text x="525.0" y="190.0" text-anchor="middle" class="b">non-ferrous (Al, Cu)</text><text x="525.0" y="205.0" text-anchor="middle" class="m">thrown forward</text><path class="arr" d="M400.0,128.0 L400.0,195.0"/><text x="380.0" y="212.0" text-anchor="middle" class="m">non-metals drop</text></svg></div>
<p><b>Eddy current separator</b>: a rotating drum wrapped with permanent magnets (high-performance <b>NdFeB</b> magnets) makes an <b>alternating magnetic field</b>. When a conducting metal (like aluminium) passes through, an <b>eddy current</b> is induced in it. That current makes its own field, <b>opposite</b> to the rotor's. The result is a <b>repulsive (Lorentz) force</b> that throws the metal out of the stream.</p>
<div class="draw">The air classifier is a good "draw and explain" question: column, blower air in at the bottom, waste in through a rotating valve, light fraction out at the top with the air, heavy fraction out at the bottom.</div>
<h3>Compost plants in Delhi</h3>
<table>
<tr><th>Plant</th><th class="r">Capacity</th><th class="r">Year</th></tr>
<tr><td>MCD compost plant, Okhla</td><td class="r">150 t/day</td><td class="r">1981</td></tr>
<tr><td>NDMC compost plant, Okhla</td><td class="r">200 t/day</td><td class="r">1985</td></tr>
<tr><td>MCD compost plant, Bhalswa (Excel)</td><td class="r">500 t/day</td><td class="r">1999</td></tr>
<tr><td>APMC Organo-phos plant, Tikri Khurd</td><td class="r">125 t/day</td><td class="r">2001</td></tr>
</table>
<h3>The future of compost plants</h3>
<p>Composting is an <b>established technology</b> for MSW and more plants will come. But it needs a <b>better market for compost</b>: <b>subsidise compost</b> and <b>raise the price of chemical fertilisers</b>.</p>`},

/* ───────────────────────── 6. VERMICOMPOSTING & ROTARY DRUM (DECK 3 PP. 36–50) ───────────────────────── */
M.push({t:"Vermicomposting & rotary drum composting (deck 3, pp. 36–50)", c:[
{t:"Vermi-composting: how it works", h:`
<p class="src">Deck 3, pp. 36–37.</p>
<p><b>Vermi-composting</b> is a form of <b>rapid composting</b> that uses earthworms.</p>
<ul>
<li>The biodegradables are broken down by <b>aerobic bacteria</b>.</li>
<li><b>Earthworms</b> eat the organic matter. Inside the worm's gut (alimentary canal), enzymes and bacteria turn it into a <b>simpler, humus-rich material</b>.</li>
<li>Earthworms are used to <b>maximise the growth of aerobic bacteria</b> (they mix and aerate the waste).</li>
<li>Time needed: about <b>1 to 1.5 months</b>.</li>
</ul>
<h3>Earthworms: basic facts</h3>
<ul>
<li><b>Invertebrates</b>, phylum <b>Annelida</b>.</li>
<li><b>More than 3000 species</b> worldwide; about <b>500 in India</b>.</li>
<li>Only <b>surface-dwelling</b> earthworms are useful composters. <b>Deep-burrowing</b> types are not preferred.</li>
<li>Most suitable species: <b><i>Eudrilus eugeniae</i></b> and <b><i>Eisenia foetida</i></b>.</li>
</ul>`},
{t:"Classifying earthworms", h:`
<p class="src">Deck 3, pp. 38–41.</p>
<table>
<tr><th>Based on</th><th>Type</th><th>What it means</th></tr>
<tr><td rowspan="3"><b>Burrowing habit and life style</b></td><td><b>Epigeics</b> (epiges)</td><td>Live <b>on the soil surface</b> in litter. High cocoon production, short life cycle, tolerant to disturbance.</td></tr>
<tr><td><b>Endogeics</b> (endoges)</td><td>Live in the <b>upper 3–5 cm</b> of soil, make horizontal branching burrows. Moderate cocoon production, medium-long life cycle.</td></tr>
<tr><td><b>Anecics</b> (aneciques)</td><td><b>Deep burrowing</b>, dark pigmented body, vertical tunnels, come to the surface at night.</td></tr>
<tr><td rowspan="2"><b>Feeding habit</b></td><td><b>Detritivores</b></td><td>Eat plant litter, dead roots and debris in organic-rich surface soil.</td></tr>
<tr><td><b>Geophages</b></td><td>Feed deep below the surface, eating large amounts of organic-rich soil.</td></tr>
<tr><td rowspan="2"><b>Living conditions</b></td><td><b>K-selected</b></td><td>Found where the climate is favourable. <b>Large size, low reproduction rate.</b></td></tr>
<tr><td><b>r-selected</b></td><td>Found in difficult, hostile conditions. <b>Small size, high reproduction rate, rapid maturity.</b></td></tr>
</table>
<div class="key">Best for vermi-composting: <b>r-selected epigeics and endogeics</b>. <b>Red worms</b> are r-selected epigeics (surface dwellers): "good crisis managers".</div>
<div class="hook"><b>Epi</b> = on top (like epidermis); <b>Endo</b> = inside the top soil; <b>Anecic</b> = goes down deep. <b>r</b> = "<b>r</b>apid" breeders (small, many babies); <b>K</b> = "<b>K</b>ing size" (big, few babies).</div>
<h3>More numbers</h3>
<ul>
<li>Life span of earthworms: <b>15–30 months</b>.</li>
<li>Gut transit time: <b>1 to 5 hours</b> (red worms).</li>
<li><b>Vermicasting</b> = earthworm excreta. Rich in C, N, P, K, Na and a large microbial population.</li>
<li><b>Vermiculture</b> (raising worms) vs <b>vermicomposting</b> (using worms to make compost).</li>
<li>Cost of vermi-compost: about <b>Rs 10–30 per kg</b>.</li>
</ul>`},
{t:"Pros, cons and compost quality", h:`
<p class="src">Deck 3, pp. 42–46.</p>
<div class="vs">
<div><h3>Advantages</h3>
<ul>
<li>Simple to build and run</li>
<li>No mechanical or electrical parts</li>
<li>Minimum cost</li>
<li>High process stability</li>
</ul></div>
<div><h3>Disadvantages</h3>
<ul>
<li>Sensitive to temperature: <b>5–35 °C</b> is best</li>
<li>Large land area: windrow height <b>&lt; 60 cm</b></li>
<li>Uncertainty and lack of understanding</li>
<li>Slow (about 1–1.5 months)</li>
<li>Worms can't tolerate toxicity; dislike <b>salty and citrus</b> food</li>
<li>Must be protected from predators</li>
<li>Needs a roof or shelter from direct sunlight</li>
</ul></div>
</div>
<div class="key">Vermi-composting is viable and eco-friendly, but mostly feasible for a <b>small community or campus</b>, <b>not on a large scale</b>. It needs a good market for vermi-compost to pay for itself. Open questions the slides ask: how do you separate the worms from the compost, and why can't it be done commercially at large scale?</div>
<h3>Compost quality</h3>
<table>
<tr><th>Nutrient</th><th class="r">Vermicompost</th><th class="r">Ordinary compost</th></tr>
<tr><td>Nitrogen (%)</td><td class="r"><b>2.5–3.5</b></td><td class="r">0.5–1.5</td></tr>
<tr><td>Phosphorus (%)</td><td class="r"><b>0.5–2.0</b></td><td class="r">0.5–0.9</td></tr>
<tr><td>Potash (%)</td><td class="r"><b>1.5–2.0</b></td><td class="r">1.2–1.4</td></tr>
</table>
<p>Vermicompost also contains useful microorganisms, actinomycetes, micro-nutrients, enzymes and hormones in a form plants can use.</p>
<div class="tip">"Why is vermi-composting not used for a whole city?" → needs large land (heaps under 60 cm), shelter from sun, protection from predators, narrow temperature range (5–35 °C), worms die from toxic, salty or citrus waste, and it's slow.</div>`},
{t:"Mechanical (vessel) composting: rotary drum", h:`
<p class="src">Deck 3, pp. 48–50.</p>
<ul>
<li>Composting inside a rotating drum (a "vessel"). The rotation mixes and aerates the waste.</li>
<li>Cuts composting time to about <b>7–10 days</b> to get <b>green compost</b>.</li>
<li>Then another <b>10–15 days of maturation</b> to get <b>ripe compost</b>. Total about 2–3 weeks.</li>
<li>Gives <b>very high quality compost</b>: N, P, K all about <b>3%</b>.</li>
<li>It is a kind of <b>high-rate composting</b>.</li>
<li>Photos: a pilot-scale reactor and a rotary kiln composter at <b>IIT Roorkee</b>.</li>
</ul>
<table>
<tr><th>Compost type</th><th class="r">N, P, K (each)</th></tr>
<tr><td>Ripe windrow compost</td><td class="r">~1%</td></tr>
<tr><td>Rotary drum compost</td><td class="r">~3%</td></tr>
<tr><td>Vermicompost (N)</td><td class="r">2.5–3.5%</td></tr>
</table>`},

/* ───────────────────────── 7. COMPOSTING NUMERICALS: AIR NEEDED, METHANE MADE (DECK 3 PP. 51–55) ───────────────────────── */
M.push({t:"Composting numericals: air needed & methane made (deck 3, pp. 51–55)", c:[
{t:"The idea", h:`
<p class="src">Deck 3, pp. 51–55.</p>
<p>Write the organic part of the waste as one big molecule, <b>C<sub>a</sub>H<sub>b</sub>O<sub>c</sub>N<sub>d</sub></b> (like the formula you made in Module 4). Then balance the equation for the reaction, and use molecular weights to turn moles into kilograms.</p>
<ul>
<li><b>Aerobic</b> composting uses <b>oxygen</b>. Question: how much air per ton of waste?</li>
<li><b>Anaerobic</b> composting uses <b>water</b> and makes <b>methane</b>. Question: how much CH₄ per ton, and what is it worth in CO₂ terms?</li>
</ul>
<div class="key">Atomic weights: C = 12, H = 1, O = 16, N = 14. Molecular weights: O₂ = 32, CO₂ = 44, H₂O = 18, NH₃ = 17, CH₄ = 16, HNO₃ = 63.</div>
<p>The slides' example waste: <b>C<sub>50</sub>H<sub>100</sub>O<sub>40</sub>N</b> (a = 50, b = 100, c = 40, d = 1).</p>
<div class="eq">Molecular weight = 50×12 + 100×1 + 40×16 + 1×14 = 600 + 100 + 640 + 14 = <b>1354</b></div>`},
{t:"Air needed for aerobic composting", h:`
<h3>The two equations</h3>
<div class="eq">C<sub>a</sub>H<sub>b</sub>O<sub>c</sub>N<sub>d</sub> + [(4a + b − 2c − 3d)/4] O₂ → a CO₂ + [(b − 3d)/2] H₂O + d NH₃</div>
<div class="eq">Then the ammonia is oxidised: NH₃ + 2 O₂ → H₂O + HNO₃</div>
<p>Total oxygen = oxygen for the first reaction + oxygen for the ammonia.</p>
<h3>Worked example: C<sub>50</sub>H<sub>100</sub>O<sub>40</sub>N</h3>
<ol>
<li>O₂ moles = (4×50 + 100 − 2×40 − 3×1)/4 = (200 + 100 − 80 − 3)/4 = 217/4 = <b>54.25</b>.<br>H₂O moles = (100 − 3)/2 = <b>48.5</b>.
<div class="eq">C<sub>50</sub>H<sub>100</sub>O<sub>40</sub>N + 54.25 O₂ → 50 CO₂ + 48.5 H₂O + NH₃</div>
<div class="eq">Masses: 1354 + 1736 → 2200 + 873 + 17</div></li>
<li>O₂ for the first reaction = 1736/1354 × 1000 = <b>1282 kg per ton</b> of waste.</li>
<li>Ammonia: NH₃ + 2O₂ → H₂O + HNO₃, masses 17 + 64 → 18 + 63. One ton of waste makes 17/1354 t of NH₃, and each kg of NH₃ needs 64/17 kg of O₂:
<div class="eq">O₂ = (64/17 × 1000) × (17/1354) = <b>47.3 kg per ton</b></div></li>
<li>Total O₂ = 1282 + 47.3 = <b>1329 kg per ton</b>.</li>
<li>Air contains about <b>23% oxygen by weight</b>:
<div class="eq">Air = 1329 × 100/23 ≈ <b>5780 kg ≈ 5.8 tons of air per ton of waste</b></div></li>
</ol>
<div class="err">The slide shows <b>5742 kg</b> (5.742 t). That figure comes from dividing by 0.2315 (the more exact mass fraction of O₂ in air). With the 23% the slide states, you get 5780 kg. Either is fine; just state the % you use.</div>
<div class="tip">Check yourself with the mass balance: 1354 + 1736 = 3090, and 2200 + 873 + 17 = 3090. If the two sides don't match, a coefficient is wrong.</div>`},
{t:"Methane from anaerobic composting", h:`
<h3>The equation</h3>
<div class="eq">C<sub>a</sub>H<sub>b</sub>O<sub>c</sub>N<sub>d</sub> + [(4a − b − 2c + 3d)/4] H₂O → [(4a + b − 2c − 3d)/8] CH₄ + [(4a − b + 2c + 3d)/8] CO₂ + d NH₃</div>
<h3>Worked example: C<sub>50</sub>H<sub>100</sub>O<sub>40</sub>N</h3>
<ol>
<li>H₂O moles = (200 − 100 − 80 + 3)/4 = 23/4 = <b>5.75</b>.</li>
<li>CH₄ moles = (200 + 100 − 80 − 3)/8 = 217/8 = <b>27.125</b>.</li>
<li>CO₂ moles = (200 − 100 + 80 + 3)/8 = 183/8 = <b>22.875</b>.
<div class="eq">C<sub>50</sub>H<sub>100</sub>O<sub>40</sub>N + 5.75 H₂O → 27.125 CH₄ + 22.875 CO₂ + NH₃</div>
<div class="eq">Masses: 1354 + 103.5 → 434 + 1006.5 + 17</div></li>
<li>CH₄ made = 434/1354 × 1000 = <b>320.5 kg per ton</b> of waste.</li>
<li>1 ton of CH₄ ≈ <b>21 tons of CO₂</b> in global warming potential (GWP):
<div class="eq">CO₂-equivalent = 320.5 × 21 ≈ <b>6730 kg per ton</b> of waste</div></li>
</ol>
<div class="err">Two typos on the slide. It writes the CH₄ coefficient as "23.71", but 217/8 = <b>27.125</b>, and only 27.125 × 16 gives the 434 the slide itself uses. It also writes "6371" kg CO₂-eq, but 320.5 × 21 = <b>6730.5</b>. Use the correct values, and show your working so the marker can follow.</div>
<div class="key">Why this matters: dumping or anaerobic rotting of 1 ton of such waste can release methane worth about <b>6.7 tons of CO₂</b>. That is a strong argument for aerobic composting or capturing the gas (Modules 8 and 13).</div>`},
{t:"Method card to memorise", h:`
<table>
<tr><th>Step</th><th>Aerobic (air needed)</th><th>Anaerobic (CH₄ made)</th></tr>
<tr><td>1</td><td>Find M = 12a + b + 16c + 14d</td><td>Same</td></tr>
<tr><td>2</td><td>O₂ moles = (4a + b − 2c − 3d)/4</td><td>CH₄ moles = (4a + b − 2c − 3d)/8</td></tr>
<tr><td>3</td><td>O₂ kg/t = moles × 32 / M × 1000</td><td>CH₄ kg/t = moles × 16 / M × 1000</td></tr>
<tr><td>4</td><td>+ NH₃ oxidation: d × 64 / M × 1000</td><td>CO₂-eq = CH₄ × 21</td></tr>
<tr><td>5</td><td>Air = total O₂ / 0.23</td><td>—</td></tr>
</table>
<div class="hook">The same bracket <b>(4a + b − 2c − 3d)</b> appears twice: divide by <b>4</b> for O₂ (aerobic), by <b>8</b> for CH₄ (anaerobic). "Four for air, eight for gas."</div>
<p>Sanity check for the bracket: carbon (4 electrons each) and hydrogen (1 each) need oxygen; oxygen already in the waste (2 each) reduces the need; nitrogen leaving as NH₃ (3 H each) also reduces it.</p>`},
{t:"Quiz: Composting numericals", q:[
["The molecular weight of C₅₀H₁₀₀O₄₀N is",
 ["1254","1354","1454","1554"],1,
 "600 + 100 + 640 + 14 = 1354."],
["For C₅₀H₁₀₀O₄₀N, the O₂ moles needed in the first aerobic reaction are",
 ["27.125","48.5","54.25","108.5"],2,
 "(200 + 100 − 80 − 3)/4 = 54.25. 27.125 is the CH₄ coefficient (÷ 8)."],
["Why is extra oxygen added on top of the first reaction?",
 ["To burn off the leftover CO₂ gas","To oxidise the NH₃ to HNO₃","To dry the waste heap","To kill the pathogens"],1,
 "NH₃ + 2O₂ → H₂O + HNO₃; 47.3 kg per ton here."],
["Total O₂ is 1329 kg per ton. Air (23% O₂ by weight) is about",
 ["306 kg","1635 kg","5780 kg","13,290 kg"],2,
 "1329 / 0.23 ≈ 5780 kg; the slide shows 5742 using 23.15%."],
["Anaerobic composting of 1 ton of this waste makes about how much CH₄?",
 ["32 kg","320 kg","434 kg","1006 kg"],1,
 "434/1354 × 1000 = 320.5 kg. 434 is the CH₄ mass per mole of waste."],
["The slides take the GWP of methane as",
 ["1","10","21","100"],2,
 "So 320.5 kg CH₄ ≈ 6730 kg CO₂-equivalent."]
]}
]});

/* ───────────────────────── 8. WASTE TO ENERGY I: BIOMETHANATION & RDF (DECK 4) ───────────────────────── */
M.push({t:"Waste to energy I: biomethanation & RDF (deck 4)", c:[
{t:"Four ways to get energy from waste", h:`
<p class="src">Deck 4 ("MSW to Energy – Biomethanation – RDF"), pp. 2–4.</p>
<ol>
<li><b>Mass-fired incineration</b>: burn the waste as it comes (Module 9).</li>
<li><b>RDF and combustion</b>: turn waste into a fuel first, then burn it (this module).</li>
<li><b>Gasification</b>.</li>
<li><b>Biomethanation → Bio-CNG</b>: make biogas, then clean and compress it (this module).</li>
</ol>
<h3>The biological route: where it stands</h3>
<ul>
<li><b>Successful at small capacities</b>; <b>yet to be proved at large capacities</b>.</li>
<li>Food waste breaks down easily. <b>Lignocellulosic</b> materials (woody "green waste" like stalks and leaves) do <b>not</b>, even though they are green waste.</li>
<li>Lots of research is going on to <b>pre-treat</b> these materials so they break down better.</li>
</ul>`},
{t:"Anaerobic digestion: four steps", h:`
<p class="src">Deck 4, p. 5.</p>
<p><b>Biomethanation</b> = anaerobic digestion: microbes break down organic matter <b>without oxygen</b> and make <b>biogas</b> (mainly CH₄ + CO₂).</p>
<div class="dia"><svg viewBox="0 0 580 330" role="img" aria-label="Anaerobic digestion in four steps: hydrolysis, acidogenesis, acetogenesis, methanogenesis, ending in methane and carbon dioxide"><rect class="box" x="20.0" y="10.0" width="240.0" height="40.0" rx="8"/><text x="140.0" y="27.0" text-anchor="middle">Big molecules</text><text x="140.0" y="41.0" text-anchor="middle" class="m">carbohydrates, proteins, fats</text><path class="arr" d="M140.0,52.0 L140.0,74.0"/><text x="280.0" y="62.0" text-anchor="start" class="a">1. Hydrolysis</text><text x="420.0" y="62.0" text-anchor="start" class="m">hydrolytic bacteria</text><rect class="box" x="20.0" y="76.0" width="240.0" height="40.0" rx="8"/><text x="140.0" y="93.0" text-anchor="middle">Monomers</text><text x="140.0" y="107.0" text-anchor="middle" class="m">sugars, amino acids</text><path class="arr" d="M140.0,118.0 L140.0,140.0"/><text x="280.0" y="128.0" text-anchor="start" class="a">2. Acidogenesis</text><text x="420.0" y="128.0" text-anchor="start" class="m">acid-forming bacteria</text><rect class="box" x="20.0" y="142.0" width="240.0" height="40.0" rx="8"/><text x="140.0" y="166.0" text-anchor="middle">Organic acids, alcohols</text><path class="arr" d="M140.0,184.0 L140.0,206.0"/><text x="280.0" y="194.0" text-anchor="start" class="a">3. Acetogenesis</text><text x="420.0" y="194.0" text-anchor="start" class="m">acetogenic bacteria</text><rect class="box" x="20.0" y="208.0" width="240.0" height="40.0" rx="8"/><text x="140.0" y="232.0" text-anchor="middle">Acetate · CO₂ + H₂</text><path class="arr" d="M140.0,250.0 L140.0,272.0"/><text x="280.0" y="260.0" text-anchor="start" class="a">4. Methanogenesis</text><text x="420.0" y="260.0" text-anchor="start" class="m">methanogenic archaea</text><rect class="boxa" x="20.0" y="274.0" width="240.0" height="40.0" rx="8"/><text x="140.0" y="298.0" text-anchor="middle">CH₄ + CO₂ (biogas)</text></svg></div>
<ol>
<li><b>Hydrolysis</b>: hydrolytic bacteria split big molecules (macromolecules) into small ones (monomers).</li>
<li><b>Acidogenesis</b>: acid-forming bacteria turn monomers into organic acids and alcohols.</li>
<li><b>Acetogenesis</b>: acetogenic bacteria turn these into <b>acetate, CO₂ and H₂</b>. (Homoacetogenic bacteria can also turn CO₂ + H₂ into acetate.)</li>
<li><b>Methanogenesis</b>: methanogenic archaea make methane. <b>Acetoclastic</b> methanogens split acetate → CH₄ + CO₂. <b>Hydrogenophilic</b> methanogens use H₂ + CO₂ → CH₄.</li>
</ol>
<div class="hook">"<b>H</b>ungry <b>A</b>nts <b>A</b>te <b>M</b>angoes": <b>H</b>ydrolysis → <b>A</b>cidogenesis → <b>A</b>cetogenesis → <b>M</b>ethanogenesis.</div>
<div class="draw">Draw the four steps as a vertical chain with the product of each step in a box.</div>`},
{t:"Types of anaerobic digester", h:`
<p class="src">Deck 4, pp. 6–9.</p>
<table>
<tr><th>Digester</th><th>How it works</th></tr>
<tr><td><b>Conventional digester</b></td><td>One tank. Influent (feed) goes in, effluent comes out the side, biogas from the top, sludge from the bottom.</td></tr>
<tr><td><b>Two-step (di-phasic) reactor</b></td><td>Splits the four steps into two tanks so each runs at its best conditions (diagram below).</td></tr>
<tr><td><b>UASB</b> (Upflow Anaerobic Sludge Blanket)</td><td>Wastewater flows <b>up</b> through a <b>blanket of sludge granules</b> where microbes live. A <b>3-phase separator</b> at the top splits gas, liquid and solids.</td></tr>
<tr><td><b>AFBR</b> (Anaerobic Fluidised Bed Reactor)</td><td>Microbes grow as a <b>biofilm on small carrier particles</b>. Upflow (helped by a <b>recycle line</b>) keeps the particles floating ("fluidised").</td></tr>
</table>
<h3>Two-phase digester</h3>
<div class="dia"><svg viewBox="0 0 580 196" role="img" aria-label="Two-phase digester: reactor 1 at 55 degrees for 2 to 3 days does hydrolysis and acidogenesis; reactor 2 at 35 degrees for 8 to 12 days makes biogas"><rect class="box" x="20.0" y="60.0" width="150.0" height="90.0" rx="8"/><text x="95.0" y="86.5" text-anchor="middle">Reactor 1</text><text x="95.0" y="101.5" text-anchor="middle" class="b">55 °C · 2–3 days</text><text x="95.0" y="116.5" text-anchor="middle" class="m">hydrolysis +</text><text x="95.0" y="131.5" text-anchor="middle" class="m">acidogenesis</text><rect class="box" x="220.0" y="82.0" width="110.0" height="46.0" rx="8"/><text x="275.0" y="101.5" text-anchor="middle">Heat</text><text x="275.0" y="116.5" text-anchor="middle">exchanger</text><rect class="boxa" x="380.0" y="60.0" width="160.0" height="90.0" rx="8"/><text x="460.0" y="86.5" text-anchor="middle">Reactor 2</text><text x="460.0" y="101.5" text-anchor="middle" class="a">35 °C · 8–12 days</text><text x="460.0" y="116.5" text-anchor="middle" class="m">acetogenesis +</text><text x="460.0" y="131.5" text-anchor="middle" class="m">methanogenesis</text><path class="arr" d="M172.0,95.0 L218.0,95.0"/><path class="arr" d="M332.0,95.0 L378.0,95.0"/><path class="arr" d="M95.0,20.0 L95.0,58.0"/><text x="103.0" y="30.0" text-anchor="start">waste in</text><path class="arra" d="M460.0,58.0 L460.0,18.0"/><text x="470.0" y="28.0" text-anchor="start" class="a">biogas</text><path class="arr" d="M460.0,152.0 L460.0,188.0"/><text x="470.0" y="182.0" text-anchor="start">digested sludge</text></svg></div>
<ul>
<li><b>Reactor 1: 55 °C, 2–3 days</b>: hydrolysis + acidogenesis.</li>
<li>A <b>heat exchanger</b> cools the stream.</li>
<li><b>Reactor 2: 35 °C, 8–12 days</b>: acetogenesis + methanogenesis. Biogas comes out here.</li>
</ul>
<h3>Why digesters perform badly or fail</h3>
<ul>
<li><b>Toxicity</b></li>
<li><b>pH control</b></li>
<li><b>Mixing</b> issues</li>
<li><b>Residence time</b> issues</li>
<li><b>Design and operational</b> issues</li>
</ul>
<div class="hook">"<b>T</b>oo <b>P</b>oor <b>M</b>ixing <b>R</b>uins <b>D</b>igesters": Toxicity, pH, Mixing, Residence time, Design/operation.</div>`},
{t:"RDF: what it is and how it's made", h:`
<p class="src">Deck 4, pp. 11–14.</p>
<p><b>RDF (Refuse Derived Fuel)</b> is fuel made from the burnable part of MSW.</p>
<ol>
<li><b>Dry</b> the MSW.</li>
<li><b>Separate</b> the burnable fraction and <b>shred</b> it.</li>
<li>Make <b>pellets</b> (using a die) or <b>briquettes</b> (by pressing), with or without a <b>binding agent</b>.</li>
</ol>
<ul>
<li>Its heat content is <b>more or less uniform</b>: <b>fluff 3000–3500 kcal/kg</b>; <b>pellets ~4000 kcal/kg</b>.</li>
<li>RDF can be <b>stored for about 6 months</b>, transported, and burnt to make power, or burnt <b>along with conventional fuels</b>.</li>
<li>There are only a few RDF plants in India at present.</li>
</ul>
<div class="key">Why turn waste into RDF instead of burning it raw? Raw Indian MSW has ~1000–1300 kcal/kg (too low). RDF has 3000–4000 kcal/kg, is uniform, can be stored and moved, and can replace part of the coal in a cement kiln.</div>
<h3>RDF initiatives in India</h3>
<ul>
<li><b>DST RDF plant, Deonar, Bombay</b>, 1990s.</li>
<li><b>SELCO RDF plant, Golconda (Hyderabad), Andhra Pradesh</b>, 2000s. Not in operation now.</li>
<li>A <b>Bangalore</b> plant.</li>
</ul>`},
{t:"Two RDF plants: Deonar and SELCO", h:`
<p class="src">Deck 4, pp. 15–18.</p>
<div class="vs">
<div><h3>Deonar (Bombay), 1990s, set up by DST</h3>
<ul>
<li>Processing <b>1.5–2.0 tons/hour</b></li>
<li>Pellets 8 / 20 / 30 mm, diameter 8–40 mm</li>
<li>Heat content <b>3500–4000 kcal/kg</b></li>
<li>Bulk density 0.70 t/m³; density 1.30 g/cc</li>
<li>Ash &lt; 15%; moisture ~10%</li>
<li><b>100 kg raw MSW → 30 kg RDF</b></li>
<li>Pellets sold at <b>Rs 1000–1200 per ton</b></li>
<li>Soil/dust reject can be used as a soil enricher</li>
</ul></div>
<div><h3>SELCO (Golconda, Hyderabad)</h3>
<ul>
<li>Based on Deonar's recommendations; <b>1st commercial RDF plant in India</b></li>
<li>Raw MSW <b>700–1000 tons/day</b></li>
<li>Raw MSW: <b>~1000 kcal/kg, ~55% moisture</b></li>
<li>Fluff RDF: ~3500 kcal/kg, ~15% moisture</li>
<li>Densified RDF: ~4000 kcal/kg, 3–8% moisture; bulk density 0.6–0.7 t/m³; density 1.3–1.6 g/cc; diameter ~2.5 cm, length 2–4 cm</li>
</ul></div>
</div>
<h3>SELCO process flow</h3>
<div class="dia"><svg viewBox="0 0 640 372" role="img" aria-label="SELCO RDF plant flow: size reduction, drying, magnetic separation, air classification, drying, size reduction, densification into pellets; side streams of ferrous metal, sand, coarse fluff and rejects"><rect class="boxa" x="200.0" y="8.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="27.0" text-anchor="middle">Raw MSW</text><path class="arr" d="M300.0,39.0 L300.0,47.0"/><rect class="box" x="200.0" y="48.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="67.0" text-anchor="middle">Primary size reduction</text><path class="arr" d="M300.0,79.0 L300.0,87.0"/><rect class="box" x="200.0" y="88.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="107.0" text-anchor="middle">Primary drying</text><path class="arr" d="M300.0,119.0 L300.0,127.0"/><rect class="box" x="200.0" y="128.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="147.0" text-anchor="middle">Magnetic separation</text><path class="arr" d="M300.0,159.0 L300.0,167.0"/><path class="arrb" d="M402.0,143.0 L440.0,143.0"/><text x="446.0" y="147.0" text-anchor="start" class="b">ferrous metals</text><rect class="box" x="200.0" y="168.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="187.0" text-anchor="middle">Air classification</text><path class="arr" d="M300.0,199.0 L300.0,207.0"/><path class="arrb" d="M402.0,183.0 L440.0,183.0"/><text x="446.0" y="187.0" text-anchor="start" class="b">sand / gravel</text><rect class="box" x="200.0" y="208.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="227.0" text-anchor="middle">Drying</text><path class="arr" d="M300.0,239.0 L300.0,247.0"/><path class="arrb" d="M198.0,223.0 L160.0,223.0"/><text x="154.0" y="227.0" text-anchor="end" class="b">SCF: coarse fuel fluff</text><rect class="box" x="200.0" y="248.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="267.0" text-anchor="middle">Size reduction</text><path class="arr" d="M300.0,279.0 L300.0,287.0"/><path class="arrb" d="M402.0,263.0 L440.0,263.0"/><text x="446.0" y="267.0" text-anchor="start" class="b">rejects (4–10 mm)</text><rect class="box" x="200.0" y="288.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="307.0" text-anchor="middle">Densification</text><path class="arr" d="M300.0,319.0 L300.0,327.0"/><rect class="boxa" x="200.0" y="328.0" width="200.0" height="30.0" rx="8"/><text x="300.0" y="347.0" text-anchor="middle">Fuel pellets (RDF)</text></svg></div>
<p class="src">SCF = coarse fuel fluff, taken out after air classification; reject size 4–10 mm. The older Deonar flow was simpler: drying → separation of inerts and shredding → pelletisation, with rejects to the land-dump.</p>
<h3>SELCO's numbers</h3>
<table>
<tr><th>Item</th><th>Value</th></tr>
<tr><td>Energy in : energy out</td><td>80–100 kWh in, ~1000 kWh out per ton of RDF → <b>~10 : 1</b> output to input</td></tr>
<tr><td>Binder</td><td>5–10%: a petroleum refinery waste, 8000–9000 kcal/kg</td></tr>
<tr><td>Boiler efficiency</td><td>RDF ~53% vs coal ~49%: <b>3–5% better than coal</b></td></tr>
<tr><td>CO₂ per kg of steam</td><td>RDF 0.381 vs coal 0.396 kg: <b>less CO₂</b></td></tr>
<tr><td>Manufacturing cost</td><td>~Rs 700 per ton of RDF</td></tr>
<tr><td>Power used</td><td>60–70 kWh per ton (~Rs 200 per ton)</td></tr>
<tr><td>Sale price</td><td>Rs 1200–1400 per ton</td></tr>
</table>`},

<p>RDF <b>used to be not a standard product</b>. Now it is <b>classified into grades</b>, and price depends on grade.</p>

<table>

/* ───────────────────────── 9. WASTE TO ENERGY II: INCINERATION BASICS (DECK 5 PP. 2–14) ───────────────────────── */
M.push({t:"Waste to energy II: incineration (deck 5, pp. 2–14)", c:[
{t:"Can this waste be burnt?", h:`
<p class="src">Deck 5 ("MSW Incineration – revised"), pp. 2–6. The first slides repeat the 2026 rules and the rule of thumb from Modules 2–3.</p>
<p><b>Incineration</b> = burning waste at high temperature in a furnace. The heat makes steam, which can run a turbine for power.</p>
<p>First check the waste with the <b>rule of thumb</b> and the <b>Tanner triangle</b> (Module 3):</p>
<ul>
<li>Below <b>1300 kcal/kg</b>: incineration not advisable.</li>
<li><b>1300–2400 kcal/kg</b>: possible with <b>auxiliary fuel</b>.</li>
<li>Above <b>2400 kcal/kg</b>: <b>autogenous</b> (self-sustaining).</li>
<li>Tanner zone: water ≤ 50%, ash ≤ 60%, combustibles ≥ 25%.</li>
</ul>
<p>Also from the 2026 rules: components above <b>1500 kcal/kg cannot be landfilled</b>, so they should be burnt or made into RDF.</p>`},
{t:"Parts of an incineration plant", h:`
<p class="src">Deck 5, pp. 7–8.</p>
<div class="dia"><svg viewBox="0 0 690 240" role="img" aria-label="Incineration plant: waste preparation, feeding, furnace at 700 to 1200 degrees, heat recovery, particle removal, acid gas removal, induced draft fan, stack; bottom ash, fly ash and waste water come out"><rect class="boxa" x="10.0" y="30.0" width="80.0" height="40.0" rx="8"/><text x="50.0" y="54.0" text-anchor="middle">Waste</text><rect class="box" x="110.0" y="30.0" width="100.0" height="40.0" rx="8"/><text x="160.0" y="54.0" text-anchor="middle">Preparation</text><rect class="box" x="230.0" y="30.0" width="90.0" height="40.0" rx="8"/><text x="275.0" y="54.0" text-anchor="middle">Feeding</text><rect class="boxa" x="345.0" y="22.0" width="120.0" height="56.0" rx="8"/><text x="405.0" y="46.5" text-anchor="middle">FURNACE</text><text x="405.0" y="61.5" text-anchor="middle" class="b">700–1200 °C</text><rect class="box" x="495.0" y="30.0" width="100.0" height="40.0" rx="8"/><text x="545.0" y="54.0" text-anchor="middle">Heat recovery</text><path class="arr" d="M92.0,50.0 L108.0,50.0"/><path class="arr" d="M212.0,50.0 L228.0,50.0"/><path class="arr" d="M322.0,50.0 L343.0,50.0"/><path class="arr" d="M467.0,50.0 L493.0,50.0"/><path class="arr" d="M405.0,6.0 L405.0,20.0"/><text x="415.0" y="12.0" text-anchor="start" class="m">aux fuel + air (FD fan)</text><path class="arr" d="M405.0,80.0 L405.0,108.0"/><text x="405.0" y="122.0" text-anchor="middle" class="b">bottom ash</text><path class="arr" d="M545.0,72.0 L545.0,98.0"/><text x="555.0" y="92.0" text-anchor="start" class="a">heat → steam → power</text><rect class="box" x="470.0" y="150.0" width="125.0" height="40.0" rx="8"/><text x="532.5" y="174.0" text-anchor="middle">Particle removal</text><rect class="box" x="300.0" y="150.0" width="140.0" height="40.0" rx="8"/><text x="370.0" y="174.0" text-anchor="middle">Acid gas removal</text><rect class="box" x="175.0" y="150.0" width="95.0" height="40.0" rx="8"/><text x="222.5" y="174.0" text-anchor="middle">ID fan</text><rect class="box" x="30.0" y="140.0" width="70.0" height="60.0" rx="8"/><text x="65.0" y="174.0" text-anchor="middle">Stack</text><path class="arr" d="M545.0,120.0 L545.0,148.0"/><path class="arr" d="M468.0,170.0 L442.0,170.0"/><path class="arr" d="M298.0,170.0 L272.0,170.0"/><path class="arr" d="M173.0,170.0 L102.0,170.0"/><path class="arr" d="M532.0,192.0 L532.0,216.0"/><text x="532.0" y="230.0" text-anchor="middle" class="b">fly ash</text><path class="arr" d="M370.0,192.0 L370.0,216.0"/><text x="370.0" y="230.0" text-anchor="middle" class="b">waste water</text><path class="arr" d="M65.0,138.0 L65.0,112.0"/><text x="75.0" y="120.0" text-anchor="start" class="m">clean gas out</text></svg></div>
<ol>
<li><b>Waste preparation</b> and <b>waste feeding</b> into the furnace.</li>
<li><b>Furnace</b>: air pushed in by the <b>FD fan</b> (forced draft), plus auxiliary fuel if needed. <b>Bottom ash</b> falls out at the bottom.</li>
<li><b>Heat recovery</b>: the hot flue gas makes steam in a boiler → steam turbine → electricity.</li>
<li><b>Particle removal</b>: catches <b>fly ash</b>.</li>
<li><b>Acidic gas removal</b>: makes <b>waste water</b>, which must be treated and disposed of.</li>
<li><b>ID fan</b> (induced draft) pulls the gas through the whole line and pushes it up the <b>stack</b> (chimney).</li>
</ol>
<p>The overview picture on p. 8 adds: combustion above 850 °C with excess air; metals recovered from the bottom ash for recycling; fly ash processed; the rest landfilled.</p>
<div class="hook">FD fan <b>pushes</b> air <b>in</b> at the <b>front</b>; ID fan <b>pulls</b> gas <b>out</b> at the end.</div>
<div class="draw">The plant flow is a very likely drawing question. Learn the order: waste → preparation → feeding → furnace → heat recovery → particle removal → acid gas removal → ID fan → stack, with bottom ash, fly ash and waste water as side outputs.</div>`},
{t:"Good combustion: 3 Ts and 1 O", h:`
<p class="src">Deck 5, p. 9.</p>
<table>
<tr><th>Requirement</th><th>Why</th></tr>
<tr><td><b>T</b>ime</td><td>Gas and waste must stay hot long enough to burn completely</td></tr>
<tr><td><b>T</b>emperature</td><td>Between <b>700 and 1200 °C</b></td></tr>
<tr><td><b>T</b>urbulence</td><td>Mixing so every bit of fuel meets oxygen</td></tr>
<tr><td><b>O</b>xygen</td><td>Enough air to burn all the carbon</td></tr>
</table>
<div class="hook">"<b>3 T's and an O</b>": <b>T</b>ime, <b>T</b>emperature, <b>T</b>urbulence, <b>O</b>xygen.</div>
<div class="tip">Incomplete combustion (missing one of the 3 Ts + O) makes <b>CO</b> and unburnt organics. The only cure for CO is good combustion (Module 10).</div>`},
{t:"Types of furnace", h:`
<p class="src">Deck 5, pp. 10–12.</p>
<table>
<tr><th>Furnace</th><th>Used for</th></tr>
<tr><td><b>Stoker / grate type</b></td><td><b>MSW mass burning</b></td></tr>
<tr><td><b>Rotary kiln</b></td><td>Any type of waste</td></tr>
<tr><td><b>Fluidised bed</b></td><td>Any kind of waste</td></tr>
</table>
<h3>Grate (rocker) type furnaces</h3>
<ul>
<li>Mostly for <b>MSW incineration</b> and for <b>coal burning</b>.</li>
<li>Now <b>reverse-acting grates</b> (reverse-acting stoker technology) are used.</li>
<li><b>Turbulence</b> comes from the <b>tumbling of the waste</b>, <b>combustion air jets</b>, and <b>air from below</b> the grate.</li>
<li>How a reverse-acting grate works (p. 12): the grate is a slope of <b>fixed steps</b> and <b>moving steps</b>. Waste slides down by gravity, but the moving steps push <b>backwards</b> (uphill). So the burning (glowing) layer is pushed back under fresh waste, which dries and lights it.</li>
</ul>`},
{t:"What comes out of the stack, and the limits", h:`
<p class="src">Deck 5, pp. 13–14.</p>
<h3>Emissions from incineration</h3>
<ol>
<li>Particulate matter (PM)</li>
<li>Oxides of nitrogen (NOₓ)</li>
<li>Oxides of sulphur (SOₓ)</li>
<li>Heavy metals</li>
<li>HCl, HF</li>
<li>Chlorinated hydrocarbons: <b>dioxins and furans</b></li>
<li>PAH (polyaromatic hydrocarbons)</li>
<li>CO</li>
<li>CO₂</li>
</ol>
<h3>Emission standards (2026) for MSW incinerators</h3>
<p>All corrected to <b>11% O₂</b>; "N m³" = normal cubic metre (gas volume at standard conditions).</p>
<table>
<tr><th>Pollutant</th><th class="r">Limit</th></tr>
<tr><td>Particulate matter</td><td class="r"><b>50</b> mg/N m³</td></tr>
<tr><td>NOₓ</td><td class="r"><b>400</b> mg/N m³</td></tr>
<tr><td>HCl</td><td class="r"><b>50</b> mg/N m³</td></tr>
<tr><td>SO₂</td><td class="r"><b>200</b> mg/N m³</td></tr>
<tr><td>CO</td><td class="r"><b>100</b> (50) mg/N m³</td></tr>
<tr><td>TOC (total organic carbon)</td><td class="r"><b>20</b> mg/N m³</td></tr>
<tr><td>HF</td><td class="r"><b>4</b> mg/N m³</td></tr>
<tr><td>Total dioxins &amp; furans</td><td class="r"><b>0.1 ng TEQ</b>/N m³</td></tr>
<tr><td>Cd + Tl + compounds</td><td class="r">0.05 mg/N m³</td></tr>
<tr><td>Hg + compounds</td><td class="r">0.05 mg/N m³</td></tr>
<tr><td>Sb + As + Cu + Pb + Cr + Mn + Ni + V</td><td class="r">0.05 mg/N m³</td></tr>
</table>
<p class="src">TEQ = toxic equivalent: different dioxins are weighted by how toxic they are, relative to the worst one. Note dioxins are in <b>nanograms</b> (10⁻⁹ g), a million times smaller than milligrams.</p>
<div class="hook">Pairs: <b>PM and HCl = 50</b>. <b>SO₂ = 200</b>, <b>NOₓ = 400</b> (doubling). <b>CO = 100</b>. <b>TOC = 20</b>. <b>HF = 4</b>. <b>Dioxins = 0.1 ng</b>. <b>Metal groups = 0.05 mg</b>.</div>`},
{t:"Quiz: Incineration", q:[
["The 3 Ts of good combustion are",
 ["time, temperature, turbulence","time, tonnage, temperature","turbulence, tar, time","temperature, toxicity, turbulence"],0,
 "Plus 1 O: oxygen."],
["Good combustion temperature on the slides is",

["Emission limits are corrected to what O₂ level?",
 ["0%","6%","11%","21%"],2,

["In a reverse-acting grate, the moving steps push the waste",

/* ───────────────────────── 10. CLEANING THE FLUE GAS: APC, CO, MERCURY, DIOXINS, PVC (DECK 5 PP. 15–34) ───────────────────────── */
M.push({t:"Cleaning the flue gas: APC, mercury, dioxins (deck 5, pp. 15–34)", c:[
{t:"Air pollution control: units in series", h:`
<p class="src">Deck 5, pp. 15–17.</p>
<p>One device can't remove everything, so <b>air pollution control (APC)</b> uses <b>more than one unit</b>, chosen for the flue gas and what the law requires. The order: big particles first, then fine particles, then acid gases.</p>
<div class="dia"><svg viewBox="0 0 600 130" role="img" aria-label="Air pollution control in series: coarse particles, then fine particles, then acidic gases, with an add-on adsorption column for extra pollutants"><rect class="box" x="16.0" y="30.0" width="120.0" height="52.0" rx="8"/><text x="76.0" y="52.5" text-anchor="middle">Remove coarse</text><text x="76.0" y="67.5" text-anchor="middle">particles</text><text x="76.0" y="104.0" text-anchor="middle" class="m">settling chamber,</text><text x="76.0" y="119.0" text-anchor="middle" class="m">cyclone</text><path class="arr" d="M138.0,56.0 L156.0,56.0"/><rect class="box" x="158.0" y="30.0" width="120.0" height="52.0" rx="8"/><text x="218.0" y="52.5" text-anchor="middle">Remove fine</text><text x="218.0" y="67.5" text-anchor="middle">particles</text><text x="218.0" y="104.0" text-anchor="middle" class="m">ESP,</text><text x="218.0" y="119.0" text-anchor="middle" class="m">bag filter</text><path class="arr" d="M280.0,56.0 L298.0,56.0"/><rect class="box" x="300.0" y="30.0" width="120.0" height="52.0" rx="8"/><text x="360.0" y="52.5" text-anchor="middle">Remove acidic</text><text x="360.0" y="67.5" text-anchor="middle">gases</text><text x="360.0" y="104.0" text-anchor="middle" class="m">venturi /</text><text x="360.0" y="119.0" text-anchor="middle" class="m">packed scrubber</text><path class="arr" d="M422.0,56.0 L440.0,56.0"/><rect class="boxa" style="stroke-dasharray:5 4" x="442.0" y="30.0" width="120.0" height="52.0" rx="8"/><text x="502.0" y="52.5" text-anchor="middle">Adsorption</text><text x="502.0" y="67.5" text-anchor="middle">column</text><text x="502.0" y="104.0" text-anchor="middle" class="m">add-on for extra</text><text x="502.0" y="119.0" text-anchor="middle" class="m">targets</text><text x="16.0" y="18.0" text-anchor="start" class="m">flue gas →</text><text x="586.0" y="18.0" text-anchor="end" class="m">→ stack</text></svg></div>
<p>For extra target pollutants, <b>add-on (tertiary, advanced) devices</b> are added, such as an <b>adsorption column</b>.</p>
<h3>Equipment comparison</h3>
<div class="tw"><table>
<tr><th>Equipment</th><th>Removes</th><th class="r">% removal</th><th class="r">Pressure drop (inches of water)</th></tr>
<tr><td>Settling chamber</td><td>Large particles</td><td class="r">0–30</td><td class="r">0.5–1</td></tr>
<tr><td>Multiple cyclones</td><td>Particles</td><td class="r">30–80</td><td class="r">3–4 (single cyclone ~1)</td></tr>
<tr><td>Venturi scrubber</td><td>Particles + acid gases (HCl, SO₂)</td><td class="r">80–96</td><td class="r"><b>10–50</b> (highest)</td></tr>
<tr><td>Packed scrubber</td><td>Aerosols + acid gases</td><td class="r">80–96</td><td class="r">6–8</td></tr>
<tr><td>ESP</td><td>Fine particles</td><td class="r">90–97</td><td class="r">0.5–1</td></tr>
<tr class="hl"><td><b>Fabric filter (bag house)</b></td><td>Fine particles</td><td class="r"><b>97–99.9</b> (best)</td><td class="r">1–8</td></tr>
</table></div>
<p class="src">Pressure drop = how much the device resists gas flow. A higher drop means a bigger fan and more power.</p>
<div class="key">Best particle removal: <b>bag filter</b> (97–99.9%). Highest pressure drop: <b>venturi scrubber</b> (10–50 inches). Lowest removal: <b>settling chamber</b> (0–30%). ESP removes a lot (90–97%) with a tiny pressure drop (0.5–1).</div>`},
{t:"How the main devices work", h:`
<p class="src">Deck 5, pp. 18–22 (pictures).</p>
<table>
<tr><th>Device</th><th>How it works, in one line</th></tr>
<tr><td><b>Cyclone</b></td><td>Dirty gas enters sideways and spins down a cone. Particles are flung to the wall and slide out of the bottom as dust; clean gas leaves up the central outlet tube.</td></tr>
<tr><td><b>ESP</b> (electrostatic precipitator)</td><td>High-voltage <b>electrode wires</b> make a corona discharge that <b>charges</b> the particles; the charged particles stick to grounded <b>collection plates</b>.</td></tr>
<tr><td><b>Bag filter house</b></td><td>Dusty air passes through <b>fabric bags</b>; dust stays on the cloth and drops into a hopper; clean air leaves.</td></tr>
<tr><td><b>Venturi scrubber</b></td><td>Gas is forced through a narrow <b>throat</b> at high speed where scrubbing liquid is sprayed; drops catch particles and dissolve acid gases; a cyclonic separator removes the wet drops.</td></tr>
<tr><td><b>Wet limestone scrubber</b> (flue gas desulphurisation)</td><td>Limestone slurry sprayed into the gas absorbs SO₂.</td></tr>
</table>`},
{t:"CO and mercury", h:`
<p class="src">Deck 5, pp. 23–26.</p>
<h3>CO removal</h3>
<ul>
<li>CO is <b>colourless, odourless, but highly toxic</b>.</li>
<li><b>No equipment removes CO once it has formed.</b></li>
<li>So the strategy is to <b>not let it form</b>: burn the carbon completely by keeping <b>high combustion efficiency</b> (the 3 Ts + O).</li>
</ul>
<h3>Mercury in flue gas</h3>
<p>(From biomedical waste incinerators and coal-based thermal power plants.)</p>
<div class="dia"><svg viewBox="0 0 620 226" role="img" aria-label="Mercury in flue gas: particle-bound and oxidised mercury are captured; elemental mercury is not, so bromine is added to oxidise it"><rect class="boxa" x="10.0" y="80.0" width="110.0" height="50.0" rx="8"/><text x="65.0" y="101.5" text-anchor="middle">Hg in</text><text x="65.0" y="116.5" text-anchor="middle">flue gas</text><path class="arr" d="M122.0,105.0 L178.0,32.0"/><rect class="box" x="180.0" y="10.0" width="150.0" height="44.0" rx="8"/><text x="255.0" y="36.0" text-anchor="middle">Particle-bound Hg</text><text x="340.0" y="36.0" text-anchor="start" class="a">easily caught by ESP / bag filter</text><path class="arr" d="M122.0,105.0 L178.0,102.0"/><rect class="box" x="180.0" y="80.0" width="150.0" height="44.0" rx="8"/><text x="255.0" y="106.0" text-anchor="middle">Elemental Hg⁰</text><text x="340.0" y="106.0" text-anchor="start" class="b">NOT easily removed (volatile, insoluble)</text><path class="arr" d="M122.0,105.0 L178.0,172.0"/><rect class="box" x="180.0" y="150.0" width="150.0" height="44.0" rx="8"/><text x="255.0" y="176.0" text-anchor="middle">Oxidised Hg (gas)</text><text x="340.0" y="176.0" text-anchor="start" class="a">sticks to particles → removed</text><path class="arra" d="M255.0,110.0 L255.0,150.0"/><text x="262.0" y="136.0" text-anchor="start" class="a">add Br₂: oxidises Hg⁰</text></svg></div>
<ul>
<li><b>Particle-bound Hg</b>: easily removed by an ESP or bag filter.</li>
<li><b>Oxidised Hg</b> (gaseous): sticks to particles, so it's removed too.</li>
<li><b>Elemental Hg (Hg⁰)</b>: <b>not easily removed</b>. It is highly volatile and insoluble in water.</li>
</ul>
<p><b>The fix: add bromine.</b> Hg⁰ is a large atom with <b>80 electrons</b>. Br₂ has <b>70 electrons</b> (Cl₂ has only 34), so bromine is effective at oxidising Hg⁰. Supply <b>bromine gas</b> before the APC devices: Hg⁰ becomes oxidised Hg, which the existing ESP or bag house can then catch.</p>
<div class="hook">Hg = 80 electrons, Br₂ = 70, Cl₂ = 34. "Bromine is big enough to grab mercury."</div>`},
{t:"Dioxins and furans", h:`
<p class="src">Deck 5, pp. 27–31.</p>
<ul>
<li>Perhaps the <b>most dangerous compounds humans have ever made</b>. Highly <b>carcinogenic</b>.</li>
<li>How they form is still not clearly understood. One idea: they form mainly from <b>organic precursors like chlorinated phenols</b>.</li>
<li>So: <b>avoid burning chlorinated plastics</b>.</li>
<li><b>250–400 °C is the danger range</b>: formation of dioxins and furans is thought to peak there. (So the gas must not linger in this range while cooling.)</li>
</ul>
<table>
<tr><th>Group</th><th>Full name</th><th class="r">How many kinds</th></tr>
<tr><td><b>Dioxins</b></td><td>Polychlorinated dibenzo-<b>dioxins</b> (PCDD)</td><td class="r"><b>75</b></td></tr>
<tr><td><b>Furans</b></td><td>Polychlorinated dibenzo-<b>furans</b> (PCDF)</td><td class="r"><b>135</b></td></tr>
</table>
<p>The worst is <b>2,3,7,8-TCDD</b> (2,3,7,8-tetrachlorodibenzodioxin), with an <b>LD₅₀ of 1 microgram per kg of body weight</b>. (LD₅₀ = the dose that kills half of the test animals.)</p>
<div class="dia"><svg viewBox="0 0 600 230" role="img" aria-label="Dioxin: two benzene rings joined by two oxygen atoms at positions 5 and 10, chlorine at positions 1 to 4 and 6 to 9. Furan: two benzene rings joined by one oxygen"><path class="ink" d="M119.4,127.0 L90.0,144.0 L60.6,127.0 L60.6,93.0 L90.0,76.0 L119.4,93.0Z"/><path class="ink" d="M237.2,127.0 L207.8,144.0 L178.3,127.0 L178.3,93.0 L207.8,76.0 L237.2,93.0Z"/><path class="ink" d="M178.3,127.0 L148.9,144.0 L119.4,127.0 L119.4,93.0 L148.9,76.0 L178.3,93.0Z"/><circle cx="148.9" cy="76.0" r="10" style="fill:var(--surface)"/><text x="148.9" y="81.0" text-anchor="middle" class="b">O</text><circle cx="148.9" cy="144.0" r="10" style="fill:var(--surface)"/><text x="148.9" y="149.0" text-anchor="middle" class="b">O</text><text x="148.9" y="60.0" text-anchor="middle" class="m">10</text><text x="148.9" y="168.0" text-anchor="middle" class="m">5</text><text x="90.0" y="64.7" text-anchor="middle" class="a">1</text><text x="47.3" y="89.3" text-anchor="middle" class="a">2</text><text x="47.3" y="138.7" text-anchor="middle" class="a">3</text><text x="90.0" y="163.3" text-anchor="middle" class="a">4</text><text x="250.5" y="138.7" text-anchor="middle" class="a">7</text><text x="207.8" y="163.3" text-anchor="middle" class="a">6</text><text x="250.5" y="89.3" text-anchor="middle" class="a">8</text><text x="207.8" y="64.7" text-anchor="middle" class="a">9</text><text x="150.0" y="200.0" text-anchor="middle" style="font-weight:600">Dioxin (PCDD): two benzene rings</text><text x="150.0" y="216.0" text-anchor="middle" class="m">joined by TWO oxygens · 75 kinds</text><path class="ink" d="M420.3,108.0 L390.4,114.4 L369.9,91.7 L379.4,62.6 L409.3,56.3 L429.7,79.0Z"/><path class="ink" d="M460.3,79.0 L480.7,56.3 L510.6,62.6 L520.1,91.7 L499.6,114.4 L469.7,108.0Z"/><path class="ink" d="M445.0,126.0 L420.3,108.0 L429.7,79.0 L460.3,79.0 L469.7,108.0Z"/><circle cx="445.0" cy="126.0" r="10" style="fill:var(--surface)"/><text x="445.0" y="131.0" text-anchor="middle" class="b">O</text><text x="445.0" y="200.0" text-anchor="middle" style="font-weight:600">Furan (PCDF): two benzene rings</text><text x="445.0" y="216.0" text-anchor="middle" class="m">joined by ONE oxygen · 135 kinds</text><text x="300.0" y="20.0" text-anchor="middle" class="m">numbered corners (1–4, 6–9) are where Cl atoms attach</text></svg></div>
<div class="hook">"Dioxin has <b>di</b> (two) oxygens; furan has one." Fewer dioxins (75), more furans (135). Danger window <b>250–400 °C</b>; burn window <b>700–1200 °C</b>.</div>`},
{t:"Plastics: don't burn PVC", h:`
<p class="src">Deck 5, pp. 32–34.</p>
<ul>
<li><b>Chlorinated plastics like PVC must not be burnt</b>: they can produce <b>dioxins, furans and HCl</b>.</li>
<li>Other plastics may be burnt; they <b>improve the heat content</b> of the waste. But different plastics burn in different ways.</li>
</ul>
<h3>Where PVC hides</h3>
<ul>
<li><b>In MSW</b>: floor tiles, lab mats, garden hoses, toys, flower pots.</li>
<li><b>In biomedical waste</b>: tubing, gloves, plastic bags.</li>
</ul>
<div class="key">PVCs should <b>not be allowed to go for incineration</b>. Segregate them first.</div>
<h3>Resin (plastic) identification codes</h3>
<table>
<tr><th class="r">Code</th><th>Plastic</th></tr>
<tr><td class="r">1</td><td>PETE (PET)</td></tr>
<tr><td class="r">2</td><td>HDPE</td></tr>
<tr class="hl"><td class="r"><b>3</b></td><td><b>V (PVC)</b>: don't burn</td></tr>
<tr><td class="r">4</td><td>LDPE</td></tr>
<tr><td class="r">5</td><td>PP</td></tr>
<tr><td class="r">6</td><td>PS</td></tr>
<tr><td class="r">7</td><td>Other</td></tr>
</table>
<div class="hook">"<b>P</b>lease <b>H</b>elp <b>V</b>ery <b>L</b>ittle <b>P</b>lanet <b>P</b>lease, <b>O</b>K": PET, HDPE, V(PVC), LDPE, PP, PS, Other.</div>`},
