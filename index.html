/* ───────────────────────── 11. INDIAN WtE PLANTS; WHY TIMARPUR FAILED (DECK 5 PP. 35–45) ───────────────────────── */
M.push({t:"Indian WtE plants & why Timarpur failed (deck 5, pp. 35–45)", c:[
{t:"Waste-to-energy plants in India", h:`
<p class="src">Deck 5, pp. 35–36.</p>
<p><b>Delhi has 4</b> WtE incineration plants: <b>Okhla, Ghazipur, Bhalswa, Tehkhand</b>.</p>
<table>
<tr><th>State</th><th class="r">Plants</th></tr>
<tr><td>Delhi</td><td class="r"><b>4</b></td></tr>
<tr><td>Uttarakhand</td><td class="r">3</td></tr>
<tr><td>Andhra Pradesh, Gujarat, Madhya Pradesh, Maharashtra, Telangana, Uttar Pradesh</td><td class="r">2 each</td></tr>
<tr><td>Haryana, Karnataka</td><td class="r">1 each</td></tr>
</table>
<div class="key">All of India together: <b>12,750 TPD</b> of waste treated, <b>250 MW</b> of power.</div>
<div class="hook">Delhi's four: "<b>O</b>nly <b>G</b>ood <b>B</b>urners <b>T</b>oday": Okhla, Ghazipur, Bhalswa, Tehkhand.</div>`},
{t:"Timarpur 1987: the failure case", h:`
<p class="src">Deck 5, pp. 37–40.</p>
<ul>
<li>Delhi's first MSW incinerator, <b>1987</b>, at <b>Timarpur</b>.</li>
<li><b>Danish design</b>: Mukund–Volund (Volund Miljøteknik Ltd, Denmark).</li>
<li>Cost <b>Rs 25 crores</b>.</li>
<li>Aim: <b>3.56 MW</b> of power from <b>300 tons/day</b> of raw MSW.</li>
<li><b>Mass firing</b>: raw MSW burnt as received. In the Indian context, that may not be advisable, and it was <b>one of the reasons</b> it failed and closed.</li>
</ul>
<h3>Reasons for failure</h3>
<table>
<tr><th></th><th class="r">Assumed</th><th class="r">Actual</th></tr>
<tr><td>Heat content</td><td class="r">1462 kcal/kg</td><td class="r"><b>700–900 kcal/kg</b></td></tr>
<tr><td>Inert content</td><td class="r">10% by wt</td><td class="r"><b>30–50%</b></td></tr>
</table>
<div class="key">A design copied from Europe assumed European-style waste. Indian waste had about <b>half the heat</b> and <b>3–5 times the inerts</b>. Below 1300 kcal/kg, incineration isn't even advisable (rule of thumb).</div>
<div class="tip">Classic short answer: "Why did the Timarpur plant fail?" Give both wrong assumptions with numbers, then the root cause: <b>mass firing of raw mixed Indian MSW</b>.</div>`},
{t:"Okhla and Jabalpur today", h:`
<p class="src">Deck 5, pp. 41–42.</p>
<table>
<tr><th>Plant</th><th class="r">Raw MSW</th><th class="r">Heat content</th><th class="r">Power</th></tr>
<tr><td><b>Okhla</b> (Delhi)</td><td class="r">2000 t/day</td><td class="r">~1300 kcal/kg</td><td class="r"><b>20–22 MW</b></td></tr>
<tr><td><b>Jabalpur</b></td><td class="r">600 t/day</td><td class="r">~1400 kcal/kg</td><td class="r"><b>8.5–11 MW</b></td></tr>
<tr><td>Timarpur (1987, design)</td><td class="r">300 t/day</td><td class="r">1462 assumed</td><td class="r">3.56 MW</td></tr>
</table>
<details class="work"><summary>Why the slides say "very low conversion efficiency" (my own check)</summary>
<ol>
<li>Okhla heat input = 2000 t/day × 1000 kg/t × 1300 kcal/kg × 4.187 kJ/kcal = 1.09 × 10¹⁰ kJ/day.</li>
<li>Per second: 1.09 × 10¹⁰ / 86,400 s ≈ 126,000 kW = <b>126 MW thermal</b>.</li>
<li>Electricity out ≈ 21 MW → efficiency ≈ 21 / 126 ≈ <b>17%</b>. Most of the heat is lost.</li>
</ol>
<p>This type of conversion is a good "simple calculation" practice; one more is in Module 14.</p></details>`},
{t:"Bottom ash, and the challenges of WtE", h:`
<p class="src">Deck 5, pp. 43–45.</p>
<h3>What's in incinerator bottom ash</h3>
<p>Dried bottom ash is screened into size fractions: <b>less than 4 mm, 4–16 mm, 16–35 mm, 35–80 mm, more than 80 mm</b>, plus the separate <b>fly ash</b>. The bigger fractions contain metal pieces and other materials that can be recovered.</p>
<h3>Challenges of waste-to-energy</h3>
<ol>
<li><b>Characteristics of MSW</b> (low heat, high moisture and inerts)</li>
<li><b>Very low conversion efficiency</b></li>
<li><b>Air pollution control</b></li>
<li><b>Segregation of hazardous components like PVC</b></li>
<li><b>Management of bottom ash and fly ash</b></li>
<li><b>Public acceptability</b></li>
<li><b>Integrating with urban utility services</b></li>
</ol>
<div class="hook">"<b>C</b>an <b>E</b>ngineers <b>A</b>lways <b>S</b>egregate <b>A</b>sh <b>P</b>roperly <b>I</b>ndoors?": Characteristics, Efficiency, Air pollution, Segregation of PVC, Ash, Public, Integration.</div>`},
{t:"Quiz: Indian WtE", q:[
["The Timarpur plant (1987) was designed for",
 ["3.56 MW from 300 t/day","20 MW from 2000 t/day","8.5 MW from 600 t/day","250 MW from 12,750 t/day"],0,
 "Okhla is 2000 t/day → 20–22 MW; Jabalpur 600 t/day → 8.5–11 MW."],
["Timarpur assumed a heat content of 1462 kcal/kg. The actual was",
 ["1300–1500 kcal/kg","700–900 kcal/kg","2400–3000 kcal/kg","300–400 kcal/kg"],1,
 "And inerts were 30–50%, not the assumed 10%."],
["Timarpur's inert content was assumed to be",
 ["5%","10%","30%","50%"],1,
 "The actual was 30–50%."],
["Which is NOT one of Delhi's four WtE plants on the slides?",
 ["Okhla","Ghazipur","Bhalswa","Deonar"],3,
 "Deonar (Mumbai) was the RDF plant. Delhi's fourth is Tehkhand."],
["Total WtE incineration capacity in India on the slide is",
 ["2,000 TPD and 20 MW","12,750 TPD and 250 MW","50,000 TPD and 1000 MW","700 TPD and 10 MW"],1,
 "Delhi alone has 4 plants."],
["Timarpur's design came from",
 ["Germany","Denmark","Japan","the USA"],1,
 "Mukund–Volund (Volund Miljøteknik, Denmark); cost Rs 25 crores."]
]}
]});

/* ───────────────────────── 12. LANDFILLS: TYPES, DRY TOMB, LINER, COVER, COSTS (DECK 6 PP. 2–16) ───────────────────────── */
M.push({t:"Landfills: types, dry tomb, liner & cover (deck 6, pp. 2–16)", c:[
{t:"Types of landfill", h:`
<p class="src">Deck 6 ("Landfilling Techniques"), p. 2.</p>
<p>Different wastes go to different kinds of landfill:</p>
<table>
<tr><th></th><th>Landfill</th><th>For</th></tr>
<tr><td>(a)</td><td><b>Secured landfill</b></td><td>Hazardous waste</td></tr>
<tr><td>(b)</td><td><b>Sanitary landfill</b></td><td>MSW</td></tr>
<tr><td>(c)</td><td><b>Inert waste monofill</b></td><td>Construction &amp; demolition (C&amp;D) waste</td></tr>
<tr><td>(d)</td><td><b>Monofill for high-volume waste</b></td><td>Ash ponds, mine tailing ponds</td></tr>
<tr><td>(e)</td><td><b>Designated / special landfill</b></td><td>Highly toxic or radioactive waste</td></tr>
</table>
<p class="src">A "monofill" takes only one kind of waste.</p>
<div class="hook">"<b>S</b>ecured for <b>S</b>cary (hazardous); <b>S</b>anitary for <b>S</b>treet (municipal) waste."</div>`},
{t:"The dry tomb idea", h:`
<p class="src">Deck 6, pp. 3–5.</p>
<p>A modern engineered landfill is a <b>"dry tomb"</b>: the waste is sealed between a <b>liner</b> below and a <b>cover</b> above, both acting as barriers, so water can't get in and nothing can get out.</p>
<div class="dia"><svg viewBox="0 0 620 286" role="img" aria-label="Dry tomb concept: waste sealed between a cover and a liner, with gas and leachate collected and no water getting in or out"><path class="Lwaste" d="M110,140 Q310,300 510,140 Q310,40 110,140 Z"/><path class="ink" d="M110,140 Q310,300 510,140"/><path class="c2" d="M110,140 Q310,40 510,140"/><text x="310.0" y="160.0" text-anchor="middle" style="font-weight:600">isolated waste</text><text x="310.0" y="64.0" text-anchor="middle" class="b">cover (flexible barrier)</text><text x="310.0" y="240.0" text-anchor="middle">liner (flexible barrier)</text><path class="arrw" d="M160.0,24.0 L160.0,100.0"/><path class="arrw" d="M196.0,24.0 L196.0,100.0"/><text x="150.0" y="30.0" text-anchor="end" class="a">rain: no infiltration</text><text x="380.0" y="16.0" text-anchor="middle" class="m">no dust, litter, pests, rodents</text><text x="506.0" y="116.0" text-anchor="start" class="m">no erosion</text><path class="c1" d="M420.0,104.0 L420.0,40.0 L480.0,40.0"/><text x="486.0" y="44.0" text-anchor="start" class="a">gas collection</text><path class="c1" d="M150.0,172.0 L60.0,172.0"/><path class="arra" d="M70.0,172.0 L34.0,172.0"/><text x="34.0" y="194.0" text-anchor="start" class="a">leachate collection</text><path class="arrw" d="M520.0,150.0 L590.0,200.0"/><text x="596.0" y="222.0" text-anchor="end" class="a">clean surface</text><text x="596.0" y="236.0" text-anchor="end" class="a">water runs off</text><text x="310.0" y="276.0" text-anchor="middle" class="m">no leachate escapes below</text></svg></div>
<ul>
<li><b>Cover</b> (flexible barrier) on top: no infiltration of rain, no dust or litter, no pests or rodents, no erosion.</li>
<li><b>Liner</b> (flexible barrier) below: no leachate escapes.</li>
<li><b>Leachate collection</b> at the bottom and <b>gas collection</b> at the top.</li>
<li>Clean surface water runs off the cover.</li>
</ul>
<h3>What the rules allow into a landfill (SWM Rules 2016 / 2026)</h3>
<ul>
<li><b>No biodegradable waste can be landfilled.</b></li>
<li>Biodegradable waste must be processed for some recovery:
<table>
<tr><th>Process</th><th>Recovers</th></tr>
<tr><td>Composting</td><td>Compost</td></tr>
<tr><td>Vermi-composting</td><td>Vermi-compost</td></tr>
<tr><td>Incineration</td><td>Steam, hot water, power</td></tr>
<tr><td>Biomethanation</td><td>Fuel gas</td></tr>
</table></li>
<li>Only <b>waste "good for nothing"</b> goes to a landfill.</li>
</ul>`},
{t:"Building a landfill: cells and covers", h:`
<p class="src">Deck 6, pp. 6–7, 12.</p>
<div class="dia"><svg viewBox="0 0 680 286" role="img" aria-label="Landfill cross-section: waste in cells with daily cover each day, intermediate cover between lifts, a domed final cover, on a sloped liner"><path class="Lsub" d="M10,120 L80,120 L140,250 L460,250 L520,120 L590,120 L590,280 L10,280 Z"/><path class="hd" d="M80.0,120.0 L140.0,250.0 L460.0,250.0 L520.0,120.0"/><clipPath id="lfpit"><path d="M80,120 L140,250 L460,250 L520,120 Z"/></clipPath><g clip-path="url(#lfpit)"><rect class="Lwaste" x="129.5" y="212.0" width="82.2" height="36"/><rect class="Lwaste" x="215.8" y="212.0" width="82.2" height="36"/><rect class="Lwaste" x="302.0" y="212.0" width="82.2" height="36"/><rect class="Lwaste" x="388.2" y="212.0" width="82.2" height="36"/><path class="thin" d="M127.5,210.0 L472.5,210.0"/><rect class="Lwaste" x="111.1" y="172.0" width="91.5" height="36"/><rect class="Lwaste" x="206.5" y="172.0" width="91.5" height="36"/><rect class="Lwaste" x="302.0" y="172.0" width="91.5" height="36"/><rect class="Lwaste" x="397.5" y="172.0" width="91.5" height="36"/><path class="c2" d="M109.1,170.0 L490.9,170.0"/><rect class="Lwaste" x="92.6" y="132.0" width="100.7" height="36"/><rect class="Lwaste" x="197.3" y="132.0" width="100.7" height="36"/><rect class="Lwaste" x="302.0" y="132.0" width="100.7" height="36"/><rect class="Lwaste" x="406.7" y="132.0" width="100.7" height="36"/><path class="thin" d="M90.6,130.0 L509.4,130.0"/></g><path class="Lsoil" d="M80,120 Q300,40 520,120 Z"/><path class="ink" d="M80,120 Q300,40 520,120"/><path class="arr" d="M300.0,20.0 L300.0,76.0"/><text x="308.0" y="28.0" text-anchor="start" class="a">final cover (dome)</text><path class="arr" d="M560.0,166.0 L430.0,170.0"/><text x="566.0" y="170.0" text-anchor="start" class="b">intermediate</text><text x="566.0" y="185.0" text-anchor="start" class="b">cover</text><path class="arr" d="M560.0,220.0 L420.0,228.0"/><text x="566.0" y="224.0" text-anchor="start">daily cover</text><path class="arr" d="M36.0,230.0 L138.0,245.0"/><text x="32.0" y="214.0" text-anchor="start">liner, sloped</text><text x="32.0" y="230.0" text-anchor="start" class="a">2–8%</text><text x="300.0" y="270.0" text-anchor="middle" class="m">leachate collection pipes at the base</text></svg></div>
<ul>
<li>The pit is lined first, with leachate collection pipes and monitoring facilities.</li>
<li>Waste is placed in <b>cells</b>. Each day's waste is covered with a thin layer of soil: the <b>daily cover</b> (it keeps away flies, birds, rodents, smell and blowing litter).</li>
<li>When a layer (lift) of cells is finished, an <b>intermediate cover</b> goes on before the next lift.</li>
<li>Gas collection trenches are added as the landfill rises.</li>
<li>When the landfill is full, a domed <b>final cover</b> goes on top, then landscaping.</li>
<li>The <b>liner is sloped about 2–8%</b> so leachate drains by gravity to the collection pipe.</li>
</ul>
<div class="draw">Draw the cross-section: lined pit, cells, daily cover between cells, intermediate cover between lifts, domed final cover, liner sloped 2–8% towards the leachate pipe.</div>`},
{t:"The bottom liner", h:`
<p class="src">Deck 6, pp. 8–11 ("Liner for MSW landfill, India").</p>
<div class="dia"><svg viewBox="0 0 560 276" role="img" aria-label="Bottom liner from top: waste, 30 cm sand or gravel leachate collection layer, 1.5 mm HDPE geomembrane, 90 cm compacted clay with k below 10 to the minus 7 cm per second, subsoil"><text x="20.0" y="20.0" text-anchor="start" style="font-weight:600">Bottom liner (MSW landfill, India)</text><rect class="Lwaste" x="20.0" y="32.0" width="230.0" height="50.0" rx="0"/><text x="262.0" y="61.0" text-anchor="start" style="font-weight:600">Waste</text><rect class="Lsand" x="20.0" y="82.0" width="230.0" height="46.0" rx="0"/><text x="262.0" y="103.0" text-anchor="start" style="font-weight:600">30 cm sand / gravel</text><text x="262.0" y="118.0" text-anchor="start" class="m">leachate collection layer + pipes</text><path class="hd" d="M20.0,131.0 L250.0,131.0"/><text x="262.0" y="137.0" text-anchor="start" style="font-weight:600">1.5 mm HDPE geomembrane</text><rect class="Lclay" x="20.0" y="136.0" width="230.0" height="86.0" rx="0"/><text x="262.0" y="177.0" text-anchor="start" style="font-weight:600">90 cm compacted clay</text><text x="262.0" y="192.0" text-anchor="start" class="m">or amended soil · k &lt; 10⁻⁷ cm/s</text><rect class="Lsub" x="20.0" y="222.0" width="230.0" height="40.0" rx="0"/><text x="262.0" y="246.0" text-anchor="start" style="font-weight:600">Subsoil</text></svg></div>
<table>
<tr><th>Layer (top to bottom)</th><th>Job</th></tr>
<tr><td>Waste</td><td>—</td></tr>
<tr><td><b>30 cm sand/gravel</b> with pipes</td><td><b>Leachate collection layer</b>: drains leachate to the pipes</td></tr>
<tr><td><b>1.5 mm HDPE geomembrane</b></td><td>Plastic sheet barrier</td></tr>
<tr><td><b>90 cm compacted clay</b> or amended soil, <b>k &lt; 10⁻⁷ cm/s</b></td><td>Clay barrier (k = permeability: how easily water passes)</td></tr>
<tr><td>Subsoil</td><td>Natural ground</td></tr>
</table>
<h3>Why a composite barrier?</h3>
<div class="dia"><svg viewBox="0 0 600 176" role="img" aria-label="A geomembrane alone leaks fast through small holes, clay alone leaks slowly over a wide area, a composite of both leaks very slowly through a small area"><text x="98.0" y="18.0" text-anchor="middle" style="font-weight:600">Geomembrane only</text><path class="thin" d="M14.0,46.0 L182.0,46.0"/><rect class="Lwater" x="14.0" y="34.0" width="168.0" height="12.0" rx="0"/><text x="98.0" y="44.0" text-anchor="middle" class="m">leachate</text><path class="hd" d="M14.0,52.0 L84.0,52.0"/><path class="hd" d="M94.0,52.0 L182.0,52.0"/><path class="arrw" d="M89.0,50.0 L89.0,104.0"/><path class="arrw" d="M89.0,50.0 L74.0,100.0"/><path class="arrw" d="M89.0,50.0 L104.0,100.0"/><text x="98.0" y="128.0" text-anchor="middle">fast seepage through</text><text x="98.0" y="143.0" text-anchor="middle">small punctures</text><text x="294.0" y="18.0" text-anchor="middle" style="font-weight:600">Clay only</text><path class="thin" d="M210.0,46.0 L378.0,46.0"/><rect class="Lwater" x="210.0" y="34.0" width="168.0" height="12.0" rx="0"/><text x="294.0" y="44.0" text-anchor="middle" class="m">leachate</text><rect class="Lclay" x="210.0" y="50.0" width="168.0" height="50.0" rx="0"/><path class="arrw" d="M224.0,54.0 L224.0,98.0"/><path class="arrw" d="M252.0,54.0 L252.0,98.0"/><path class="arrw" d="M280.0,54.0 L280.0,98.0"/><path class="arrw" d="M308.0,54.0 L308.0,98.0"/><path class="arrw" d="M336.0,54.0 L336.0,98.0"/><path class="arrw" d="M364.0,54.0 L364.0,98.0"/><text x="294.0" y="128.0" text-anchor="middle">slow seepage through</text><text x="294.0" y="143.0" text-anchor="middle">a large area</text><text x="490.0" y="18.0" text-anchor="middle" class="a" style="font-weight:600">Composite</text><path class="thin" d="M406.0,46.0 L574.0,46.0"/><rect class="Lwater" x="406.0" y="34.0" width="168.0" height="12.0" rx="0"/><text x="490.0" y="44.0" text-anchor="middle" class="m">leachate</text><path class="hd" d="M406.0,52.0 L476.0,52.0"/><path class="hd" d="M486.0,52.0 L574.0,52.0"/><rect class="Lclay" x="406.0" y="56.0" width="168.0" height="50.0" rx="0"/><path class="arrw" d="M481.0,56.0 L481.0,100.0"/><text x="490.0" y="128.0" text-anchor="middle">very slow seepage</text><text x="490.0" y="143.0" text-anchor="middle">through a small area</text><text x="14.0" y="168.0" text-anchor="start" class="m">composite = 1.5–2.5 mm HDPE on > 100 cm clay (k ≤ 10⁻⁹ m/s): each covers the other’s weak spot</text></svg></div>
<ul>
<li><b>Geomembrane alone</b>: <b>rapid</b> seepage through <b>small punctures</b>.</li>
<li><b>Clay alone</b>: <b>slow</b> seepage through a <b>large area</b>.</li>
<li><b>Composite</b> (geomembrane on top of clay): <b>very slow</b> seepage through a <b>small area</b>. The clay plugs any hole in the sheet; the sheet stops water reaching most of the clay.</li>
<li>The general composite barrier (p. 8): <b>HDPE geomembrane 1.5–2.5 mm thick</b> on natural clay / compacted clay / compacted in-situ soil + clay, <b>k ≤ 10⁻⁹ m/s</b>, more than <b>100 cm</b> thick.</li>
</ul>
<p class="src">Unit check: 10⁻⁹ m/s = 10⁻⁷ cm/s. Both slides give the same permeability.</p>
<h3>The leachate collection pipe (p. 11)</h3>
<p>A <b>perforated</b> pipe sits in a trench of <b>washed gravel</b> (1.5–2 inch), wrapped in <b>geotextile filter fabric</b> so fine soil doesn't clog it. Above it: a <b>sand drainage layer</b> and a <b>protective soil layer</b>. Below: the <b>geomembrane liner</b> (an extra geomembrane is optional) on the <b>compacted clay</b>. The base is shaped into graded terraces sloping to the pipes.</p>
<div class="hook">Liner numbers go <b>30 – 1.5 – 90</b>: 30 cm sand, 1.5 mm HDPE, 90 cm clay. "<b>Thirty, one-and-a-half, ninety.</b>"</div>`},
{t:"Leachate drainage and gas extraction", h:`
<p class="src">Deck 6, pp. 12–14.</p>
<div class="dia"><svg viewBox="0 0 620 266" role="img" aria-label="Leachate drains by gravity along the sloped liner to a pump station then storage and treatment; landfill gas is pulled from wells by a blower to a flare, with condensate drained"><path class="Lwaste" d="M40,170 L110,60 L270,60 L340,170 Z"/><path class="ink" d="M40.0,170.0 L110.0,60.0 L270.0,60.0 L340.0,170.0"/><text x="92.0" y="158.0" text-anchor="middle" style="font-weight:600">landfill</text><path class="bad" d="M140.0,40.0 L140.0,150.0"/><path class="bad" d="M170.0,40.0 L170.0,150.0"/><path class="bad" d="M200.0,40.0 L200.0,150.0"/><path class="bad" d="M230.0,40.0 L230.0,150.0"/><text x="120.0" y="30.0" text-anchor="end" class="b">gas wells</text><path class="c2" d="M140.0,40.0 L230.0,40.0 L480.0,40.0 L480.0,70.0"/><rect class="box" x="440.0" y="72.0" width="80.0" height="32.0" rx="8"/><text x="480.0" y="92.0" text-anchor="middle">blower</text><path class="arr" d="M520.0,88.0 L548.0,88.0"/><rect class="boxa" x="550.0" y="72.0" width="60.0" height="32.0" rx="8"/><text x="580.0" y="92.0" text-anchor="middle">flare</text><text x="480.0" y="122.0" text-anchor="middle" class="m">drain condensate</text><path class="c1" d="M60.0,170.0 L330.0,182.0"/><text x="120.0" y="200.0" text-anchor="start" class="a">gravity drainage along the sloped liner</text><path class="arra" d="M330.0,182.0 L380.0,182.0 L380.0,220.0"/><rect class="box" x="340.0" y="222.0" width="90.0" height="34.0" rx="8"/><text x="385.0" y="243.0" text-anchor="middle">pump station</text><path class="arr" d="M432.0,239.0 L458.0,239.0"/><rect class="boxa" x="460.0" y="222.0" width="150.0" height="34.0" rx="8"/><text x="535.0" y="243.0" text-anchor="middle">storage → treatment</text></svg></div>
<ul>
<li><b>How leachate is removed</b>: it runs down the liner (sloped 2–8%) into the leachate collection system and drainage pipe. It flows by <b>gravity</b> to a <b>pump station</b>, then to <b>storage and/or treatment</b>.</li>
<li><b>Landfill gas</b> is pulled out through <b>gas wells</b> to a <b>blower–flare station</b>, where it is burnt (or used). <b>Condensate must be drained</b> from the pipes (water condenses as the warm gas cools).</li>
</ul>`},
{t:"The final cover", h:`
<p class="src">Deck 6, p. 15 ("MSW landfill, India").</p>
<div class="dia"><svg viewBox="0 0 560 258" role="img" aria-label="Final cover from top: vegetation, 45 cm topsoil, 15 cm sand or gravel drainage, 60 cm compacted clay barrier, 30 cm sand or gravel gas collection, then waste"><text x="20.0" y="20.0" text-anchor="start" style="font-weight:600">Final cover (MSW landfill, India)</text><rect class="Lsoil" x="20.0" y="32.0" width="230.0" height="10.0" rx="0"/><text x="262.0" y="41.0" text-anchor="start" style="font-weight:600">Vegetation</text><rect class="Lsoil" x="20.0" y="42.0" width="230.0" height="46.0" rx="0"/><text x="262.0" y="63.0" text-anchor="start" style="font-weight:600">45 cm topsoil</text><text x="262.0" y="78.0" text-anchor="start" class="m">plants grow here</text><rect class="Lsand" x="20.0" y="88.0" width="230.0" height="22.0" rx="0"/><text x="262.0" y="97.0" text-anchor="start" style="font-weight:600">15 cm sand / gravel</text><text x="262.0" y="112.0" text-anchor="start" class="m">drainage layer</text><rect class="Lclay" x="20.0" y="110.0" width="230.0" height="60.0" rx="0"/><text x="262.0" y="138.0" text-anchor="start" style="font-weight:600">60 cm compacted clay</text><text x="262.0" y="153.0" text-anchor="start" class="m">barrier · k &lt; 10⁻⁷ cm/s</text><rect class="Lsand" x="20.0" y="170.0" width="230.0" height="34.0" rx="0"/><text x="262.0" y="185.0" text-anchor="start" style="font-weight:600">30 cm sand / gravel</text><text x="262.0" y="200.0" text-anchor="start" class="m">gas collection layer</text><rect class="Lwaste" x="20.0" y="204.0" width="230.0" height="40.0" rx="0"/><text x="262.0" y="228.0" text-anchor="start" style="font-weight:600">Waste</text></svg></div>
<table>
<tr><th>Layer (top to bottom)</th><th>Job</th></tr>
<tr><td>Vegetation</td><td>Holds the soil, uses up rainwater</td></tr>
<tr><td><b>45 cm topsoil</b></td><td>Lets plants grow</td></tr>
<tr><td><b>15 cm sand/gravel</b></td><td><b>Drainage layer</b>: carries away rain that soaks in</td></tr>
<tr><td><b>60 cm compacted clay</b> or amended soil, <b>k &lt; 10⁻⁷ cm/s</b></td><td><b>Barrier</b>: stops rain reaching the waste</td></tr>
<tr><td><b>30 cm sand/gravel</b></td><td><b>Gas collection layer</b></td></tr>
<tr><td>Waste</td><td>—</td></tr>
</table>
<div class="hook">Cover numbers from the top: <b>45 – 15 – 60 – 30</b>. Soil, drain, clay, gas. "<b>Soil Drains, Clay Gates gas.</b>"</div>
<div class="tip">Don't mix up the clay: <b>90 cm in the liner</b> (bottom), <b>60 cm in the cover</b> (top). Both have k &lt; 10⁻⁷ cm/s. The liner also has the 1.5 mm HDPE.</div>
<div class="draw">Draw both layer stacks with thicknesses. This is a likely "draw and label" question.</div>`},

/* ───────────────────────── 13. LEACHATE, LANDFILL GAS, BIOREACTOR LANDFILLS (DECK 6 PP. 17–35) ───────────────────────── */
M.push({t:"Leachate, landfill gas & bioreactor landfills (deck 6, pp. 17–35)", c:[
{t:"Leachate: what changes as a landfill ages", h:`
<p class="src">Deck 6, pp. 17–19.</p>
<p>Leachate must be <b>collected and treated</b>. Its make-up depends on the <b>age of the landfill</b>, so the treatment must change with age too. Use <b>modular units</b> (several small units, not one big one) so the plant can be changed as the landfill ages.</p>
<div class="tw"><table>
<tr><th>Landfill age</th><th>Leachate contains</th><th>Treatment</th></tr>
<tr><td><b>Very young</b></td><td>Mostly organics and NH₃</td><td><b>ASP with extended aeration</b> (biological + nitrification/denitrification)</td></tr>
<tr><td><b>Young</b></td><td>Mostly organics and NH₃, fewer salts</td><td>More ASP + <b>AC adsorption</b> (or RO)</td></tr>
<tr><td><b>Aged</b></td><td>Mostly salts, less organics and NH₃</td><td>ASP + more AC adsorption (or more RO)</td></tr>
<tr><td><b>Very old</b></td><td><b>Only salts</b></td><td><b>AC adsorption column or RO</b> only</td></tr>
</table></div>
<p class="src">ASP = activated sludge process (aerated tank where bacteria eat organics). AC = activated carbon. RO = reverse osmosis (membrane that removes salts). Nitrification/denitrification = bacteria turning NH₃ into nitrate and then into N₂ gas.</p>
<div class="key">Young = <b>biology</b> (organics and ammonia, which bacteria can eat). Old = <b>physics/chemistry</b> (salts, which bacteria can't remove, so use carbon or RO).</div>
<h3>Leachate volume</h3>
<ul>
<li>Varies through the year: <b>more a few hours after rain</b>, <b>less in summer</b> than in the rainy season.</li>
<li>Estimate it by the <b>water balance method</b> (water in − water out − water stored), or with <b>GEM software</b>.</li>
</ul>`},
{t:"Landfill gas: changes with age, and cleaning it", h:`
<p class="src">Deck 6, pp. 20–22.</p>
<table>
<tr><th>Landfill age</th><th>Gas</th><th>Why</th></tr>
<tr><td><b>Very young</b></td><td>Mostly <b>N₂, O₂</b></td><td>Trapped air; decay just starting</td></tr>
<tr><td><b>Young</b></td><td><b>CO₂, H₂, CH₄</b></td><td>Acid-forming stage; methane starting</td></tr>
<tr><td><b>Aged</b></td><td><b>CO₂, CH₄</b></td><td>Stable methane production</td></tr>
<tr><td><b>Very old</b></td><td>Very little gas</td><td>Organics used up</td></tr>
</table>
<p>The gas ages in the same order as the anaerobic digestion steps (Module 8): air first, then acids and hydrogen, then methane.</p>
<h3>Cleaning landfill gas: two columns</h3>
<table>
<tr><th>Column</th><th>Removes</th><th>Packed with</th></tr>
<tr><td>1</td><td><b>Water vapour</b></td><td>Gravel mixed with <b>CaCl₂</b> (calcium chloride)</td></tr>
<tr><td>2</td><td><b>H₂S</b></td><td>Gravel mixed with <b>lead acetate and iron cuttings</b></td></tr>
</table>
<p>A full LFG purification and use unit (p. 22): gas holder → moisture remover → H₂S remover → compressor → gas engine → generator → power to the grid.</p>
<div class="hook"><b>C</b>aCl₂ for <b>C</b>ondensation (water). <b>L</b>ead acetate + <b>I</b>ron for the rotten-egg gas (H₂S).</div>`},
{t:"Problems with dry tombs, and the bioreactor idea", h:`
<p class="src">Deck 6, pp. 23–28.</p>
<h3>"Are you happy with dry tomb landfills?"</h3>
<ul>
<li>MSW must first be processed for recovery (composting or vermi-composting).</li>
<li>The waste takes a <b>long time to stabilise</b>, because it stays dry and rots very slowly.</li>
<li>The <b>landfill area is blocked for about a century</b>.</li>
<li>Leachate has to be treated and managed for all that time.</li>
</ul>
<h3>The alternative: a bioreactor landfill</h3>
<div class="dia"><svg viewBox="0 0 600 204" role="img" aria-label="Bioreactor landfill: leachate is recirculated into the waste with air added, so microbes break it down faster"><rect class="Lwaste" x="150.0" y="60.0" width="200.0" height="100.0" rx="4"/><path class="ink" d="M150.0,60.0 L350.0,60.0 L350.0,160.0 L150.0,160.0 L150.0,60.0"/><text x="250.0" y="100.0" text-anchor="middle" style="font-weight:600">waste + water</text><text x="250.0" y="118.0" text-anchor="middle" style="font-weight:600">+ microorganisms</text><path class="arrb" d="M190.0,56.0 L190.0,14.0"/><text x="190.0" y="10.0" text-anchor="middle" class="b">exhaust gas</text><path class="arr" d="M250.0,14.0 L250.0,56.0"/><text x="250.0" y="10.0" text-anchor="middle">air</text><path class="arrw" d="M250.0,162.0 L250.0,192.0 L420.0,192.0 L420.0,36.0 L312.0,36.0 L312.0,56.0"/><text x="428.0" y="110.0" text-anchor="start" class="a">leachate pumped</text><text x="428.0" y="125.0" text-anchor="start" class="a">back in (recirculated)</text></svg></div>
<ul>
<li>The landfill is treated as <b>one big bioreactor</b>.</li>
<li><b>No processing of biodegradables</b> first.</li>
<li>Leachate is collected but <b>recirculated back into the landfill</b> (water + microbes; air too in the aerobic version).</li>
<li>Waste stabilises <b>much faster</b>: <b>aerobic 5–8 years</b>, <b>anaerobic 8–12 years</b>.</li>
<li>The land is <b>available for reuse quickly</b>, and the landfill becomes "sustainable".</li>
</ul>
<div class="key"><b>Against the rules?</b> Yes: <b>bioreactor landfills are not allowed in India now</b> (biodegradables can't be landfilled). But there are ongoing attempts, with research at the <b>University of Florida, IIT Bombay, Anna University and IIT Delhi</b>.</div>
<h3>Definition (SWANA Bioreactor Committee)</h3>
<p>"A bioreactor landfill is a controlled landfill or landfill cell where <b>liquid and gas conditions are actively managed</b> in order to <b>accelerate or enhance biostabilization</b> of the waste." It greatly increases how much organic waste decomposes, how fast, and how well, compared with a normal landfill.</p>
<h3>Benefit: more feasible gas-to-energy</h3>

{t:"Concerns with bioreactor landfills", h:`
<p class="src">Deck 6, pp. 29–35.</p>
<h3>1. Leachate seeps</h3>
<div class="dia"><svg viewBox="0 0 600 246" role="img" aria-label="Leachate seeps: a cover soil layer inside the landfill intercepts leachate and carries it sideways until it breaks out on the side slope"><path class="Lsub" d="M60,240 L230,20 L560,20 L560,240 Z"/><path class="Lsand" d="M150,135 L560,108 L560,124 L162,152 Z"/><path class="hd" d="M60.0,240.0 L230.0,20.0"/><path class="arrw" d="M300.0,40.0 L300.0,104.0"/><path class="arrw" d="M400.0,40.0 L400.0,104.0"/><path class="arrw" d="M500.0,40.0 L500.0,104.0"/><path class="arrw" d="M500.0,120.0 L420.0,126.0"/><path class="arrw" d="M400.0,120.0 L320.0,126.0"/><path class="arrw" d="M300.0,120.0 L220.0,126.0"/><path class="arrw" d="M170.0,140.0 L120.0,160.0"/><text x="132.0" y="196.0" text-anchor="start" class="b">↖ seep (outbreak)</text><text x="146.0" y="212.0" text-anchor="start" class="b">on the side slope</text><text x="400.0" y="160.0" text-anchor="middle">cover soil layer catches leachate</text><text x="400.0" y="176.0" text-anchor="middle">and carries it sideways</text><text x="420.0" y="210.0" text-anchor="middle" class="m">high-k layer: leachate flows along it</text><text x="420.0" y="226.0" text-anchor="middle" class="m">low-k layer: leachate pools on it and runs along the top</text></svg></div>
<p>Cover soil layers inside the landfill can catch the recirculated leachate and carry it <b>sideways</b> to the side slope, where it breaks out as a <b>seep (outbreak)</b>. This happens with <b>high-permeability</b> cover layers (leachate flows along them) and with <b>low-permeability</b> ones (leachate pools on top and runs along them).</p>
<h3>2. Slope stability</h3>
<ul>
<li><b>Excess pore water pressure</b> can make the landfill unstable.</li>
<li>The <b>strength of the waste may fall</b> as it decomposes.</li>
</ul>
<h3>3. More gas emissions</h3>
<ul>
<li>If not controlled, the extra gas escapes.</li>
<li>Bioreactors may need <b>different gas collection systems</b>, because wells can get <b>flooded</b>.</li>
</ul>
<h3>4. Flammability of landfill gas</h3>
<div class="dia"><svg viewBox="0 0 600 170" role="img" aria-label="Methane only burns when it is 5 to 15 percent of the mix with air; landfill gas in a well is about 50 percent methane with no oxygen, so it cannot burn there"><path class="z1" d="M48.0,94.0 L104.0,94.0 L104.0,46.0 L48.0,46.0Z"/><path class="ax" d="M20.0,94.0 L580.0,94.0"/><text x="20.0" y="110.0" text-anchor="middle" class="m">0%</text><text x="48.0" y="110.0" text-anchor="middle" class="m">5%</text><text x="104.0" y="110.0" text-anchor="middle" class="m">15%</text><text x="300.0" y="110.0" text-anchor="middle" class="m">50%</text><text x="580.0" y="110.0" text-anchor="middle" class="m">100%</text><text x="46.0" y="38.0" text-anchor="start" class="b">5–15%: burns / explodes</text><text x="20.0" y="128.0" text-anchor="start" class="m">below 5%: too lean</text><text x="300.0" y="70.0" text-anchor="middle" class="">too rich, no O₂ → can't burn</text><path class="ink" d="M300.0,94.0 L300.0,81.2"/><text x="270.0" y="128.0" text-anchor="start" class="a">landfill gas in a well ≈ 50% CH₄ + 50% CO₂</text><text x="580.0" y="46.0" text-anchor="end" class="m">% CH₄ in air</text></svg></div>
<ul>
<li>Methane burns only when mixed with the right amount of oxygen: <b>5–15% methane by volume in air</b>.</li>
<li>Landfill gas inside the landfill or a well is about <b>50% CH₄ and 50% CO₂</b>. It has <b>no oxygen</b> to support a flame, so <b>it is not explosive there</b>.</li>
<li>Danger only arises when it mixes with air into the 5–15% range.</li>
</ul>
<h3>5. Costs</h3>
<p>Initial capital and running costs may be <b>higher</b> than a traditional dry-tomb landfill. At most sites the gains (faster stabilisation, more gas, land reused sooner) can offset this.</p>
<h3>How leachate is put back in: vertical injection</h3>
<p><b>Cluster wells</b>: use <b>multiple small-diameter wells</b> of different depths, each injecting leachate at a different level.</p>
<div class="hook">Bioreactor concerns: "<b>S</b>eeps, <b>S</b>lopes, <b>G</b>as, <b>F</b>lames, <b>C</b>osts" (SSGFC: "<b>S</b>ome <b>S</b>ites <b>G</b>et <b>F</b>ar <b>C</b>ostlier").</div>`},

M.push({t:"Exam practice: numericals, short answers, drawings", c:[
{t:"Numerical 1: a new waste sample", h:`
<p>Same method as Module 4, new numbers. Try it on paper first, then open the solution.</p>
<div class="prob"><b>Problem</b>A 100 kg sample has the components below. Find (a) % moisture, (b) % inerts and % volatiles, (c) heat content as received and on a dry basis, and say whether it is incinerable. (d) Ash per day if 500 t/day is burnt. Use 1 Btu = 1.055 kJ, 1 kg = 2.204 lb, and the slide's limits 6280 and 10,048 kJ/kg.</div>
<div class="tw"><table>
<tr><th>Component</th><th class="r">Wt (kg)</th><th class="r">Moisture %</th><th class="r">Heat (Btu/lb, as discarded)</th><th class="r">Inerts % (dry)</th></tr>
<tr><td>Food</td><td class="r">50</td><td class="r">60</td><td class="r">2000</td><td class="r">5</td></tr>
<tr><td>Paper</td><td class="r">15</td><td class="r">6</td><td class="r">7200</td><td class="r">6</td></tr>
<tr><td>Plastics</td><td class="r">8</td><td class="r">2</td><td class="r">14000</td><td class="r">10</td></tr>
<tr><td>Glass</td><td class="r">7</td><td class="r">2</td><td class="r">80</td><td class="r">98.9</td></tr>
<tr><td>Metals</td><td class="r">5</td><td class="r">3</td><td class="r">300</td><td class="r">90.5</td></tr>
<tr><td>Dirt</td><td class="r">15</td><td class="r">8</td><td class="r">2000</td><td class="r">68</td></tr>
</table></div>
<details class="work"><summary>Solution</summary>
<table>
<tr><th>Component</th><th class="r">Dry (kg)</th><th class="r">Heat (kJ)</th><th class="r">Inerts (kg)</th></tr>
<tr><td>Food</td><td class="r">20.0</td><td class="r">232,520</td><td class="r">1.00</td></tr>
<tr><td>Paper</td><td class="r">14.1</td><td class="r">251,120</td><td class="r">0.85</td></tr>
<tr><td>Plastics</td><td class="r">7.84</td><td class="r">260,430</td><td class="r">0.78</td></tr>
<tr><td>Glass</td><td class="r">6.86</td><td class="r">1,300</td><td class="r">6.78</td></tr>
<tr><td>Metals</td><td class="r">4.85</td><td class="r">3,490</td><td class="r">4.39</td></tr>
<tr><td>Dirt</td><td class="r">13.8</td><td class="r">69,760</td><td class="r">9.38</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r"><b>67.45</b></td><td class="r"><b>818,620</b></td><td class="r"><b>23.19</b></td></tr>
</table>
<ol>
<li>(a) Moisture = (100 − 67.45)/100 × 100 = <b>32.6%</b>.</li>
<li>(b) Inerts = 23.19/100 × 100 = <b>23.2%</b>. Volatiles = 100 − 32.6 − 23.2 = <b>44.3%</b>.</li>
<li>(c) As received: 818,620/100 = <b>8186 kJ/kg</b> (≈ 1955 kcal/kg). Between 6280 and 10,048 → incinerable <b>with auxiliary fuel</b>.</li>
<li>Dry: 818,620/67.45 = <b>12,137 kJ/kg</b> (≈ 2900 kcal/kg). Above 10,048 → <b>autogenous</b> after drying. Here drying alone is enough, because the sample has lots of paper and plastic.</li>
<li>(d) Ash = 0.232 t per t × 500 t/day ≈ <b>116 t/day</b>.</li>
</ol>
<p>Tanner check (proximate): water 32.6% ≤ 50, ash 23.2% ≤ 60, combustibles 44.3% ≥ 25 → inside the zone, consistent.</p></details>`},
{t:"Numerical 2: composting stoichiometry", h:`
<div class="prob"><b>Problem</b>The organic fraction of a waste is C<sub>60</sub>H<sub>94</sub>O<sub>37</sub>N. Find (a) the air needed per ton for complete aerobic composting, including ammonia oxidation (air = 23% O₂ by weight); (b) the methane produced per ton by anaerobic composting, and its CO₂-equivalent (GWP 21).</div>
<details class="work"><summary>Solution</summary>
<ol>
<li>M = 60×12 + 94 + 37×16 + 14 = 720 + 94 + 592 + 14 = <b>1420</b>.</li>
<li>Bracket (4a + b − 2c − 3d) = 240 + 94 − 74 − 3 = <b>257</b>.</li>
<li>(a) O₂ moles = 257/4 = 64.25 → mass 64.25 × 32 = 2056. Per ton: 2056/1420 × 1000 = <b>1448 kg</b>.<br>
NH₃ oxidation: 64/1420 × 1000 = <b>45.1 kg</b>. Total O₂ = <b>1493 kg/t</b>.<br>
Air = 1493/0.23 ≈ <b>6490 kg ≈ 6.5 t per ton</b>.<br>
Check: 1420 + 2056 = 3476 = 60×44 + 45.5×18 + 17 (H₂O = (94 − 3)/2 = 45.5). ✓</li>
<li>(b) CH₄ moles = 257/8 = 32.125 → mass 514. Per ton: 514/1420 × 1000 = <b>362 kg</b>.<br>
CO₂-eq = 362 × 21 ≈ <b>7600 kg per ton</b>.<br>
(Water used = (240 − 94 − 74 + 3)/4 = 18.75 mol; CO₂ = (240 − 94 + 74 + 3)/8 = 27.875 mol. Check: 1420 + 337.5 = 514 + 1226.5 + 17 = 1757.5 ✓)</li>
</ol></details>`},
{t:"Quick calculations (Quiz-2 style)", h:`
<p>Each takes under a minute with a calculator.</p>
<details class="sa"><summary>1. Convert 6500 Btu/lb to kJ/kg and kcal/kg.</summary><p>6500 × 2.204 × 1.055 = <b>15,110 kJ/kg</b>. 6500 × 2.204 × 0.252 = <b>3610 kcal/kg</b>.</p></details>
<details class="sa"><summary>2. A 20 kg component has 45% moisture. Dry weight?</summary><p>20 × 0.55 = <b>11 kg</b>.</p></details>
<details class="sa"><summary>3. Waste has 1100 kcal/kg. Incinerable?</summary><p>Below 1300 kcal/kg → <b>not advisable</b>.</p></details>
<details class="sa"><summary>4. A plant burns 1000 t/day of waste with 30% inerts. Ash per day?</summary><p>0.30 × 1000 = <b>300 t/day</b>.</p></details>
<details class="sa"><summary>5. Deonar converts 100 kg MSW to 30 kg RDF. How much RDF from 2 t/h over 16 hours?</summary><p>2 × 16 = 32 t MSW × 0.30 = <b>9.6 t RDF</b>.</p></details>
<details class="sa"><summary>6. Timarpur: 300 t/day at the assumed 1462 kcal/kg gave 3.56 MW. What is the efficiency, and the power at the real 800 kcal/kg?</summary><p>Heat in = 300,000 × 1462 × 4.187 / 86,400 ≈ 21,250 kW = 21.3 MW thermal. Efficiency = 3.56/21.3 ≈ <b>17%</b>. At 800 kcal/kg, same efficiency: 3.56 × 800/1462 ≈ <b>1.95 MW</b>, about half the design. (Worse in reality, because the waste wouldn't burn well at all.)</p></details>
<details class="sa"><summary>7. Waste has C = 24 kg and N = 0.6 kg. C/N? What do you add?</summary><p>24/0.6 = <b>40</b> &gt; 30 → add a <b>nitrogen source</b> (sewage sludge, slaughterhouse waste, urine, fish scrap).</p></details>
<details class="sa"><summary>8. Total O₂ for composting is 1200 kg/t. Air needed?</summary><p>1200/0.23 ≈ <b>5220 kg/t</b> (about 5.2 t of air per ton of waste).</p></details>
<details class="sa"><summary>9. 300 kg CH₄ per ton. CO₂-equivalent?</summary><p>300 × 21 = <b>6300 kg CO₂-eq per ton</b>.</p></details>
<details class="sa"><summary>10. Sample of 120 kg; dry weight 84 kg; inerts 30 kg. Proximate analysis?</summary><p>Moisture = 36/120 = <b>30%</b>; inerts = 30/120 = <b>25%</b>; volatiles = <b>45%</b>.</p></details>`},
{t:"Short-answer questions with model answers", h:`
<details class="sa"><summary>Define MSW. What is excluded?</summary><p>Waste collected by the municipality from houses, markets, parks, institutions, offices, gardens and street sweeping. It contains paper, plastics, glass, leather, rubber, metals, food, leaves, stones, debris. It excludes biomedical waste, fly ash, hazardous waste and radioactive waste.</p></details>
<details class="sa"><summary>List the functional elements of MSW management.</summary><p>Storage at source → primary collection → municipal storage → transportation to processing stations → processing/treatment → final disposal.</p></details>
<details class="sa"><summary>Why did treatment plants for raw mixed MSW fail in India?</summary><p>Mixed Indian MSW has low heat content (~1300 kcal/kg), high moisture (30–60%) and high inerts (25–40%). Compost from it was poor quality with few takers; RDF was not a standard product and hard to co-fire; incinerators like Timarpur performed badly. Segregation at source is the key.</p></details>
<details class="sa"><summary>Distinguish proximate and ultimate analysis.</summary><p>Proximate: % moisture, % volatile matter, % inerts, on an as-discarded (wet) basis, adding to 100%. Ultimate: % C, H, O, N, S and inerts, on a dry basis. Ultimate breaks the volatile part into elements.</p></details>
<details class="sa"><summary>Compare aerobic and anaerobic composting (any four points).</summary><p>Aerobic: needs O₂; products CO₂, NH₃, nitrates; exothermic (490–680 kcal/g-mol glucose), temperature rises; kills pathogens; 2–2.5 months; no odour. Anaerobic: no O₂; products CH₄, CO₂, H₂S; ~26 kcal/g-mol, no temperature rise; pathogens survive; 4–6 months; odour; needs large space.</p></details>
<details class="sa"><summary>What are the factors affecting aerobic composting? Give the optimum values.</summary><p>Microorganisms (already in MSW); shredding (&lt; 2 inch); C/N 30 (26–32) initially, 16–20 finished; temperature 50–60 °C (pathogens killed in 5–7 days; &gt;70 °C kills microbes); moisture 45–55%; windrow height 1–1.2 m to 1.5–1.8 m, width 2.4–3.6 m; turning every 5–7 days.</p></details>
<details class="sa"><summary>What happens if finished compost has C/N above 20?</summary><p>Nitrogen robbing: the excess carbon makes soil microbes use soil nitrogen to build cell protoplasm, so nitrogen becomes available to plants only after a delay.</p></details>
<details class="sa"><summary>Why is vermi-composting not suitable on a large scale?</summary><p>Needs a large land area (heap height &lt; 60 cm), shelter from sunlight, protection from predators, temperature 5–35 °C; worms can't tolerate toxicity, salty or citrus food; it's slow (1–1.5 months); worms are hard to separate from the compost; uncertainty in operation.</p></details>
<details class="sa"><summary>What are the 3 Ts and 1 O?</summary><p>Time, Temperature (700–1200 °C), Turbulence, and Oxygen: the requirements for good (complete) combustion.</p></details>
<details class="sa"><summary>How are CO and elemental mercury controlled in incinerators?</summary><p>CO: no device removes it once formed, so prevent it by complete combustion (high combustion efficiency). Hg⁰: volatile and insoluble, so not captured; add bromine gas (Br₂, 70 electrons) to oxidise it before the APC; oxidised Hg sticks to particles and is caught by the ESP or bag filter.</p></details>
<details class="sa"><summary>Why should PVC not be incinerated?</summary><p>It is chlorinated; burning it can produce dioxins, furans (highly carcinogenic, formation peaks at 250–400 °C) and HCl. PVC in MSW: floor tiles, lab mats, garden hoses, toys, flower pots; in BMW: tubing, gloves, bags.</p></details>
<details class="sa"><summary>Why did the Timarpur plant fail?</summary><p>It was a Danish mass-firing design (Rs 25 crore, 3.56 MW from 300 t/day, 1987) that assumed 1462 kcal/kg heat content and 10% inerts. Actual Delhi waste had 700–900 kcal/kg and 30–50% inerts, below the 1300 kcal/kg limit for incineration.</p></details>
<details class="sa"><summary>What is RDF? Give its advantages.</summary><p>Refuse derived fuel: MSW is dried, the burnable fraction separated and shredded, then pelletised or briquetted (with or without binder). Advantages: uniform heat content (fluff 3000–3500, pellets ~4000 kcal/kg); can be stored ~6 months and transported; can be co-fired with coal, e.g. in cement kilns; less waste to landfill.</p></details>
<details class="sa"><summary>How do leachate characteristics and treatment change with landfill age?</summary><p>Very young/young: mostly organics and NH₃ → biological treatment (ASP with extended aeration, nitrification/denitrification), plus some AC/RO. Aged: mostly salts → ASP + more AC/RO. Very old: only salts → AC adsorption or RO. Use modular units.</p></details>
<details class="sa"><summary>What is a bioreactor landfill? Advantages and concerns?</summary><p>A landfill where liquid and gas conditions are actively managed (leachate recirculated, possibly air added) to speed up biostabilisation (SWANA). Advantages: stabilisation in 5–8 years (aerobic) or 8–12 (anaerobic) instead of ~100; land reused sooner; more gas sooner for energy. Concerns: leachate seeps, slope stability, extra gas emissions, flooded wells, flammability, higher costs. Not allowed in India now.</p></details>
<details class="sa"><summary>Why is landfill gas in a well not explosive?</summary><p>It is ~50% CH₄ + 50% CO₂ with no oxygen. Methane only burns when it is 5–15% by volume in air.</p></details>`},

{t:"7. Composting stoichiometry", h:`
<table>
<tr><th>Item</th><th>Formula / value</th></tr>
<tr><td>Aerobic</td><td>CₐH_bO_cN_d + [(4a+b−2c−3d)/4] O₂ → a CO₂ + [(b−3d)/2] H₂O + d NH₃</td></tr>
<tr><td>Ammonia</td><td>NH₃ + 2O₂ → H₂O + HNO₃ (17 + 64 → 18 + 63)</td></tr>
<tr><td>Anaerobic</td><td>CₐH_bO_cN_d + [(4a−b−2c+3d)/4] H₂O → [(4a+b−2c−3d)/8] CH₄ + [(4a−b+2c+3d)/8] CO₂ + d NH₃</td></tr>
<tr><td>C₅₀H₁₀₀O₄₀N</td><td>M = 1354; O₂ 54.25 mol → 1282 kg/t; NH₃ O₂ 47.3 kg/t; total 1329 kg/t; air ≈ 5.8 t/t (slide 5.742)</td></tr>
<tr><td>Methane</td><td>27.125 mol → 434 → 320.5 kg CH₄/t; × 21 = ~6730 kg CO₂-eq/t</td></tr>
<tr><td>Air</td><td>~23% O₂ by weight</td></tr>
</table>
<div class="hook">"<b>Four for air, eight for gas</b>": the same bracket (4a + b − 2c − 3d) ÷ 4 = O₂, ÷ 8 = CH₄.</div>
${cz([
"Molecular weight of C₅₀H₁₀₀O₄₀N = [[1354]].",
"O₂ for the first aerobic reaction = [[1282]] kg per ton.",
"O₂ for oxidising NH₃ = [[47.3]] kg per ton.",
"Air is taken as [[23%]] O₂ by weight.",
"Air needed ≈ [[5.8]] tons per ton of waste.",
"CH₄ produced = [[320.5]] kg per ton.",
"GWP of methane on the slides = [[21]].",
"CH₄ coefficient = (4a + b − 2c − 3d) divided by [[8]]."
])}`},

try { var s = parseInt(location.hash.slice(1) || localStorage.getItem("cvl100-pos"), 10); if (s >= 0 && s < flat.length) cur = s; } catch(e){}

var $ = function(id){ return document.getElementById(id); };
var nav = $("nav"), list = $("navlist"), card = $("card");

function shuffle(a){
  for (var k = a.length - 1; k > 0; k--) { var r = Math.floor(Math.random() * (k + 1)), t = a[k]; a[k] = a[r]; a[r] = t; }
  return a;
}

// options are shuffled on every render so the answer position can't be memorised
function quiz(q){
  return q.map(function(x, i){
    var order = shuffle(x[1].map(function(_, j){ return j; }));
    return '<div class="mcq" data-a="'+order.indexOf(x[2])+'"><p class="qq"><span>'+(i+1)+'.</span>'+x[0]+'</p><div class="opts">'+
      order.map(function(o, j){ return '<button data-j="'+j+'">'+"ABCD"[j]+'. '+x[1][o]+'</button>'; }).join("")+
      '</div><p class="why">'+x[3]+'</p></div>';
  }).join("") + '<div class="score" id="score"></div>';
}

function score(){
  var el = $("score"); if (!el) return;
  var n = card.querySelectorAll(".mcq").length, d = card.querySelectorAll(".mcq.done").length, ok = card.querySelectorAll(".mcq.ok").length;
  el.innerHTML = '<span>Answered <b>'+d+' / '+n+'</b> · Correct <b>'+ok+'</b></span>' + (d ? '<button id="retry">Retry</button>' : '');
}

card.addEventListener("click", function(e){
  if (e.target.id === "retry") { go(cur); return; }
  if (e.target.classList.contains("bl")) { e.target.classList.toggle("on"); return; }
  if (e.target.classList.contains("revall")) {
    var t = e.target.closest(".test"), bl = t.querySelectorAll(".bl"), show = t.querySelectorAll(".bl.on").length < bl.length;
    bl.forEach(function(x){ x.classList.toggle("on", show); });
    e.target.textContent = show ? "Hide all" : "Show all";
    return;
  }
  var b = e.target.closest(".opts button"); if (!b) return;
  var m = b.closest(".mcq"); if (m.classList.contains("done")) return;
  var a = +m.dataset.a, j = +b.dataset.j;
  m.classList.add("done");
  m.querySelectorAll(".opts button")[a].classList.add("right");
  if (j === a) m.classList.add("ok"); else b.classList.add("wrong");
  score();
});

function buildNav(){
  var start = 0, html = "";
  M.forEach(function(m, mi){
    html += '<button data-i="'+start+'" data-m="'+mi+'"><span class="n">'+mi+'</span><span>'+m.t+'</span><span class="c">'+m.c.length+'</span></button>';
    start += m.c.length;
  });
  list.innerHTML = html;
  list.querySelectorAll("button").forEach(function(b){
    b.onclick = function(){ go(+b.dataset.i); nav.classList.remove("open"); };
  });
}

function go(i){
  cur = Math.max(0, Math.min(flat.length - 1, i));
  var f = flat[cur], m = M[f.mi], c = m.c[f.ci];
  card.innerHTML = "<h2>" + c.t + "</h2>" + (c.h || "") + (c.q ? quiz(c.mix ? shuffle(c.q.slice()) : c.q) : "");
  score();
  $("mod").textContent = m.t;
  $("count").textContent = (f.ci + 1) + " / " + m.c.length;
  $("bar").style.width = ((cur + 1) / flat.length * 100) + "%";
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === flat.length - 1;
  list.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", +b.dataset.m === f.mi); });
  try { localStorage.setItem("cvl100-pos", cur); } catch(e){}
  history.replaceState(null, "", "#" + cur);
  window.scrollTo(0, 0);
  pace();
}

$("prev").onclick = function(){ go(cur - 1); };
$("next").onclick = function(){ go(cur + 1); };
$("menu").onclick = function(){ nav.classList.toggle("open"); };
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(cur + 1);
  if (e.key === "ArrowLeft") go(cur - 1);
  if (e.key === "Escape") nav.classList.remove("open");
});
$("theme").onclick = function(){
  var r = document.documentElement, t = r.getAttribute("data-theme");
  var dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
  try { localStorage.setItem("cvl100-theme", r.getAttribute("data-theme")); } catch(e){}
};
try { var th = localStorage.getItem("cvl100-theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch(e){}

// pace tracker: sections 1–13 (cards #5–#83) split evenly from the plan start to 2:30 am IST
var P0 = 5, P1 = 84, PEND = Date.parse("2026-11-21T02:30:00+05:30");
var plan = {t: Date.parse("2026-11-20T22:33:00+05:30"), s: 18};
try { var sp = JSON.parse(localStorage.getItem("cvl100-pace")); if (sp && sp.t && sp.s >= P0 && sp.s < P1) plan = sp; } catch(e){}

function hm(t){ return new Date(t).toLocaleTimeString("en-GB", {timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit"}); }
function clock(ms){
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h + ":" + (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x;
}
function mins(ms){ var m = Math.round(Math.abs(ms) / 60000); return m < 60 ? m + " min" : Math.floor(m / 60) + " h " + (m % 60) + " min"; }

function pace(){
  var el = $("pace"), now = Date.now(), per = (PEND - plan.t) / (P1 - plan.s);
  var at = Math.max(P0, Math.min(P1, cur)), todo = P1 - at, left = PEND - now;
  var exp = Math.max(P0, Math.min(P1, plan.s + (now - plan.t) / per));
  var due = plan.t + (at + 1 - plan.s) * per, slack = due - now;
  var cls = "", st, msg;
  if (todo === 0) { st = "Done"; msg = "Sections 1–13 finished"; }
  else if (left <= 0) { cls = "bad"; st = "Time up"; msg = todo + " slides of sections 1–13 left"; }
  else if (slack > per + 60000) { st = "Ahead"; msg = "Ahead by " + mins(slack - per); }
  else if (slack >= 0) { st = "On track"; msg = "Move on by " + hm(due); }
  else { cls = -slack < 600000 ? "warn" : "bad"; st = "Behind"; msg = "Behind by " + mins(slack); }
  var info = todo && left > 0
    ? "On <b>#" + at + "</b>, plan says <b>#" + Math.floor(exp) + "</b> · <b>" + clock(left) + "</b> to 2:30 · <b>" + todo + "</b> slides left · need <b>" + (left / todo / 60000).toFixed(1) + "</b> min/slide (plan " + (per / 60000).toFixed(1) + ")"
    : "Sections 1–13 = #5 to #83";
  el.className = "pace " + cls;
  el.innerHTML = '<span class="st">' + st + '</span><span class="msg">' + msg + '</span><span class="info">' + info + '</span>' +
    '<button class="rp" id="replan" title="Split the remaining slides evenly from now until 2:30">Re-plan from here</button>' +
    '<div class="trk"><div class="f" style="width:' + ((at - P0) / (P1 - P0) * 100) + '%"></div><div class="g" style="left:' + ((exp - P0) / (P1 - P0) * 100) + '%"></div></div>';
}

$("pace").addEventListener("click", function(e){
  if (e.target.id !== "replan") return;
  plan = {t: Date.now(), s: Math.max(P0, Math.min(P1 - 1, cur))};
  try { localStorage.setItem("cvl100-pace", JSON.stringify(plan)); } catch(e){}
  pace();
});
setInterval(pace, 1000);

buildNav();
go(cur);
</script>
</body>
</html>
