<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CVL100 Waste Prep</title>
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e2db;
  --accent:#1f6f5c; --accent-soft:#e3f0ec; --warn:#9a5b00; --warn-soft:#fbf0dc;
  --bad:#a33a2c; --bad-soft:#f8e4e0; --bar:#1f6f5c; --bar2:#c0703a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151614; --surface:#1e201d; --ink:#ecebe6; --muted:#a3a29b; --line:#33352f;
    --accent:#5fc2a6; --accent-soft:#1d3530; --warn:#e8b25c; --warn-soft:#3a2f1c;
    --bad:#ef8a7b; --bad-soft:#3b2421; --bar:#5fc2a6; --bar2:#e09a63;
  }
}
:root[data-theme="dark"]{
  --bg:#151614; --surface:#1e201d; --ink:#ecebe6; --muted:#a3a29b; --line:#33352f;
  --accent:#5fc2a6; --accent-soft:#1d3530; --warn:#e8b25c; --warn-soft:#3a2f1c;
  --bad:#ef8a7b; --bad-soft:#3b2421; --bar:#5fc2a6; --bar2:#e09a63;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav{border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface)}
nav h1{font-size:15px;margin:0 6px 4px;letter-spacing:.02em}
nav .sub{font-size:12.5px;color:var(--muted);margin:0 6px 16px}
nav button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:14px;padding:8px 8px;border-radius:8px;cursor:pointer;line-height:1.35}
nav button:hover{background:var(--bg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:16px}
nav button.on .n{color:var(--accent)}
nav button .c{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line)}
.top .mod{font-size:13px;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .count{flex-shrink:0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.menu{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.theme{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.progress{height:3px;background:var(--line)}
.progress div{height:100%;background:var(--accent);transition:width .25s}
.stage{flex:1;padding:36px 28px 24px;display:flex;justify-content:center}
.card{width:100%;max-width:720px;min-width:0}
.card h2{font-size:28px;line-height:1.25;margin:0 0 18px;letter-spacing:-.01em}
.card h3{font-size:17px;margin:20px 0 8px}
.card p{margin:0 0 14px}
.card ul,.card ol{margin:0 0 14px;padding-left:22px}
.card li{margin:4px 0}
.card li::marker{color:var(--muted)}
.card b{font-weight:650}
.key{background:var(--accent-soft);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.key::before{content:"Remember";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.tip{background:var(--warn-soft);border-left:3px solid var(--warn);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.tip::before{content:"Exam tip";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.hl td{background:var(--accent-soft)}
.tw{overflow-x:auto}
.eq{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:10px 0 16px;overflow-x:auto;white-space:nowrap}
.bars{margin:8px 0 18px}
.bars .row{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bars .lab{color:var(--muted)}
.bars .track{height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.bars .fill{height:100%;background:var(--bar);border-radius:3px}
.bars .fill.b2{background:var(--bar2)}
.bars .val{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0 16px}
.vs>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.vs h3{font-size:14px;margin:0 0 6px;color:var(--accent)}
.vs ul{margin:0;padding-left:18px;font-size:15.5px}
.vs p{font-size:15.5px;margin:0}
figure{margin:12px 0 18px}
figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.mcq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 14px}
.mcq .qq{font-weight:600;margin:0 0 10px}
.mcq .qq span{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.opts{display:grid;gap:8px}
.opts button{text-align:left;font:inherit;font-size:15.5px;line-height:1.4;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.mcq.done .opts button{cursor:default}
.mcq.done .opts button:hover{border-color:var(--line)}
.opts button.right,.mcq.done .opts button.right:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opts button.wrong,.mcq.done .opts button.wrong:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.why{display:none;font-size:14.5px;color:var(--muted);margin:10px 0 0}
.mcq.done .why{display:block}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px dashed var(--line);border-radius:10px;font-size:15px;color:var(--muted)}
.score b{color:var(--ink)}
.score button{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.controls{display:flex;justify-content:space-between;gap:12px;padding:18px 28px 28px;max-width:776px;width:100%;margin:0 auto}
.controls button{font:inherit;font-size:15px;padding:11px 22px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.controls button.next{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.controls button:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted);text-align:center;padding-bottom:16px}
@media (max-width:860px){
  body{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr)}
  nav{position:fixed;inset:0 auto 0 0;width:84%;max-width:320px;z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  nav.open{transform:none}
  .menu{display:inline-block}
  .top{padding:12px 16px}
  .stage{padding:24px 16px 12px}
  .card h2{font-size:23px}
  .controls{padding:14px 16px 22px}
  .vs{grid-template-columns:1fr}
  .bars .row{grid-template-columns:96px 1fr 46px}
  .hint{display:none}
}

:root{--kim:#5b4bb7;--kim-soft:#ecebf9;--c2:#c0703a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--kim:#a99cf0;--kim-soft:#272440;--c2:#e09a63}}
:root[data-theme="dark"]{--kim:#a99cf0;--kim-soft:#272440;--c2:#e09a63}
.kim{background:var(--kim-soft);border-left:3px solid var(--kim);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.kim::before{content:"Keep in mind";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kim);margin-bottom:2px}
.kim ul{margin:0;padding-left:20px}
.hook{background:var(--warn-soft);border-left:3px solid var(--warn);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.hook::before{content:"Memory hook";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);margin-bottom:2px}
.hook ul{margin:0;padding-left:20px}
.test{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px 4px;margin:16px 0}
.test::before{content:"Test yourself · tap a grey box to reveal";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.test ol{padding-left:22px}
.bl{background:var(--line);color:transparent;border-radius:4px;padding:0 6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.bl.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.revall{font:inherit;font-size:13.5px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;margin:0 0 12px}
.dia svg text.w{fill:#fff;font-weight:600}
.dia svg text.k{fill:#1d1d1b}
.dia svg text.s{font-size:11px}
.dia svg .thin{stroke:var(--muted);stroke-width:1;fill:none}
.dia svg .hd{stroke:var(--ink);stroke-width:3.2;fill:none}
.dia svg .z1{fill:var(--bad);opacity:.2}
.dia svg .z2{fill:var(--warn);opacity:.24}
.dia svg .z3{fill:var(--accent);opacity:.22}
.dia svg .Lsand{fill:#d6ad55;opacity:.55}
.dia svg .Lclay{fill:#9c5f38;opacity:.5}
.dia svg .Lsoil{fill:#5f9234;opacity:.45}
.dia svg .Lwaste{fill:var(--kim);opacity:.22}
.dia svg .Lsub{fill:var(--muted);opacity:.18}
.dia svg .Lwater{fill:#3b82c4;opacity:.3}
.dia svg .bad{stroke:var(--bad);stroke-width:2;fill:none}
.dia svg .arra{stroke:var(--accent);stroke-width:1.8;fill:none;marker-end:url(#ah)}
.dia svg .arrb{stroke:var(--c2);stroke-width:1.8;fill:none;marker-end:url(#ah)}
.dia svg .arrw{stroke:#3b82c4;stroke-width:1.8;fill:none;marker-end:url(#ah)}
.draw{background:var(--kim-soft);border-left:3px solid var(--kim);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.draw::before{content:"Practise drawing this";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--kim);margin-bottom:2px}
.err{background:var(--bad-soft);border-left:3px solid var(--bad);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.err::before{content:"Slide check";display:block;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);margin-bottom:2px}
.bars.wide .row{grid-template-columns:150px 1fr 110px}
@media (max-width:860px){.bars.wide .row{grid-template-columns:96px 1fr 84px}}
.work li{margin:6px 0}
.card p.src{font-size:13.5px;color:var(--muted);line-height:1.5}
.dia{margin:12px 0 18px}
.dia svg{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.dia svg text{fill:var(--ink);font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.dia svg text.m{fill:var(--muted);font-size:11.5px}
.dia svg text.a{fill:var(--accent);font-weight:600}
.dia svg text.b{fill:var(--c2);font-weight:600}
.dia svg .ax{stroke:var(--ink);stroke-width:1.4;fill:none}
.dia svg .c1{stroke:var(--accent);stroke-width:2.4;fill:none}
.dia svg .c2{stroke:var(--c2);stroke-width:2.4;fill:none}
.dia svg .c3{stroke:var(--kim);stroke-width:2.4;fill:none}
.dia svg .ink{stroke:var(--ink);stroke-width:2;fill:none}

.dia svg .f1{fill:var(--accent);opacity:.22;stroke:none}
.dia svg .f2{fill:var(--c2);opacity:.28;stroke:none}
.dia svg .f3{fill:var(--kim);opacity:.25;stroke:none}
.dia svg .box{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.dia svg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.dia svg .dot{fill:var(--ink)}
.dia svg .arr{stroke:var(--muted);stroke-width:1.4;fill:none;marker-end:url(#ah)}
.work{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:12px 0}
.work summary{cursor:pointer;font-weight:600;color:var(--accent)}
.work ol{margin:10px 0 4px}
.prob{border:1px solid var(--line);border-left:3px solid var(--c2);border-radius:0 10px 10px 0;padding:12px 16px;margin:12px 0;background:var(--surface)}
.prob>b:first-child{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c2);margin-bottom:4px}
.sa summary{font-weight:600}
.sa{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:8px 0}
.sa p:last-child{margin-bottom:0}
td.blk{background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.pace{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:10px 28px 12px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.pace .st{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pace.warn .st{background:var(--warn-soft);color:var(--warn)}
.pace.bad .st{background:var(--bad-soft);color:var(--bad)}

.pace .info b{color:var(--ink);font-weight:600}
.pace .rp{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
.pace .trk{position:relative;flex-basis:100%;height:6px;background:var(--line);border-radius:3px}

.pace.warn .trk .f{background:var(--warn)}
.pace.bad .trk .f{background:var(--bad)}

</style>
</head>

function bars(rows, max, unit, cls, wrap){
  unit = unit === undefined ? "" : unit; cls = cls || "";
  return '<div class="bars ' + (wrap || "") + '">' + rows.map(function(r){
    return '<div class="row"><span class="lab">'+r[0]+'</span><span class="track"><span class="fill '+cls+'" style="display:block;width:'+(Math.max(r[1],0)/max*100)+'%"></span></span><span class="val">'+(r[2] || r[1]+unit)+'</span></div>';
  }).join("") + '</div>';
}

<p class="src">Deck numbers follow the Moodle file names: 0 = CVL 100 Intro, 1 = Solid Waste Mgt and Engg Intro, 2 = MSW History and Characterization, 3 = MSW Processing, 4 = Biomethanation and RDF, 5 = Incineration, 6 = Landfilling Techniques. Page numbers are PDF pages.</p>`},
{t:"Units you must handle", h:`
<p>The slides mix British and metric units. You need these conversions for every heat-content numerical. All of them are on the slides except the last two rows, which follow from them.</p>
<table>
<tr><th>Conversion</th><th>Value</th></tr>
<tr><td>1 BTU</td><td><b>252 cal = 1055 J</b> (1.055 kJ)</td></tr>
<tr><td>1 kg</td><td><b>2.204 lb</b></td></tr>
<tr><td>1 kcal</td><td>4.187 kJ</td></tr>
<tr><td>1 Btu/lb</td><td>2.325 kJ/kg = 0.555 kcal/kg</td></tr>
</table>
<div class="eq">Heat in kJ = mass (kg) × 2.204 (lb/kg) × heat content (Btu/lb) × 1.055 (kJ/Btu)</div>
<p><b>Example:</b> 4 kg of paper at 6500 Btu/lb → 4 × 2.204 × 6500 × 1.055 = <b>60,450 kJ</b>.</p>
<h3>Other words you'll meet</h3>
<ul>
<li><b>TPD</b> = tons per day. <b>m/c</b> = moisture content.</li>
<li><b>As discarded / as received basis</b> = the waste as it arrives, water included. <b>Dry basis</b> = after the water is removed.</li>
<li><b>Inerts</b> = things that don't burn or rot: glass, metal, stones, dirt, ash.</li>
<li><b>Leachate</b> = dirty liquid that drains out of waste. <b>LFG</b> = landfill gas.</li>
<li><b>Stoichiometry</b> = the exact amount of a reactant (like oxygen) that the balanced equation needs, no more and no less.</li>
</ul>`}
]});

/* ───────────────────────── 1. INTRO: ENV ISSUES, TYPES OF SOLID WASTE, MANAGING MSW (DECKS 0–1) ───────────────────────── */
M.push({t:"Environmental issues & types of solid waste (decks 0–1)", c:[
{t:"Macro vs micro environmental issues", h:`
<p class="src">Deck 0 ("CVL 100 Intro – Macro-Micro Env issues"), pp. 4–7.</p>
<p>Environmental Science &amp; Engineering is <b>interdisciplinary</b>: a blend of science and engineering. It is a promising, emerging area of civil and chemical engineering, full of real-life problems. And "it brings the nations together".</p>
<p>The professor splits environmental problems into two sizes:</p>
<div class="vs">
<div><h3>Macro issues = global</h3><p>International issues, and issues of space and the universe.</p>
<ul>
<li>Ozone layer depletion</li>
<li>Global warming</li>
<li>Pollution of the oceans</li>
<li>Depletion of fossil fuels</li>
<li>Nuclear, chemical and biological weapons</li>
<li>Pollution of space, and from space</li>
<li>Acid rain</li>
<li>Biological accidents: pandemics</li>
</ul></div>
<div><h3>Micro issues = local</h3><p>Problems of one city, river or area.</p>
<ul>
<li>River pollution</li>
<li>Eutrophication</li>
<li>Automobile pollution</li>
<li>Management of industrial wastes</li>
<li>Management of domestic wastes</li>
<li>Noise pollution</li>
<li>Biodiversity loss</li>
<li>Photochemical smog</li>
<li>Deforestation</li>
<li>Emerging contaminants</li>
</ul></div>
</div>
<div class="hook">Macro = the whole <b>planet</b> or <b>sky</b> is affected (ozone, warming, oceans, space). Micro = one <b>place</b> is affected (a river, a city's air, a town's garbage).</div>
<div class="tip">A quiz might ask "Is acid rain a macro or micro issue?" (macro, as listed on the slide) or "Name two micro issues." Solid waste management itself is a <b>micro</b> issue (management of domestic wastes).</div>`},
{t:"Types of solid waste", h:`
<p class="src">Deck 1 ("Solid Waste Mgt and Engg – Intro"), pp. 2–4.</p>
<h3>Main types of solid waste</h3>
<ol>
<li><b>Biomedical waste (BMW)</b>: from hospitals and clinics</li>
<li><b>E-waste</b>: old electronics</li>
<li><b>Fly ash</b> from thermal power plants</li>
<li><b>C&amp;D waste</b>: construction and demolition debris</li>
<li><b>Industrial hazardous waste</b></li>
<li><b>Plastic waste</b></li>
<li><b>Municipal solid waste (MSW)</b></li>
</ol>
<h3>Other solid waste streams</h3>
<ul>
<li>Agro-wastes (crop leftovers)</li>
<li>Scrap automobiles</li>
<li>Institutional hazardous wastes</li>
<li>Sludge from <b>ETPs</b> (effluent treatment plants) and <b>STPs</b> (sewage treatment plants)</li>
<li>Waste solar panels</li>
</ul>
<h3>What is MSW?</h3>
<ul>
<li>Waste <b>collected by the municipality</b>.</li>
<li>It comes from houses, markets, parks, institutions, offices, gardens, street sweeping and so on.</li>
<li>It contains paper, plastics, glass, leather, rubber, metals, stale food, leaves, stones, debris.</li>
<li>It does <b>not</b> include BMW, fly ash, hazardous waste or radioactive waste. Those have their own rules.</li>
</ul>
<div class="tip">"Define MSW" is a likely short answer. Give all three parts: who collects it (municipality), where it comes from (houses, markets…), and what is excluded (BMW, fly ash, hazardous, radioactive).</div>`},
{t:"Why MSW is a problem, and how we manage it", h:`
<p class="src">Deck 1, pp. 5–9.</p>
<h3>Issues with MSW</h3>
<ul>
<li>Huge volume and quantity</li>
<li>It can decay (rot)</li>
<li>Bad odour</li>
<li>Pollution of air, soil and water</li>
<li>Infectious diseases</li>
<li>Bird, dog and rodent menace</li>
<li>Poor aesthetics (it looks bad)</li>
</ul>
<h3>How MSW is managed: six steps</h3>
<div class="dia"><svg viewBox="0 0 570 204" role="img" aria-label="Six steps of MSW management: storage at source, primary collection, municipal storage, transport, processing, final disposal"><rect class="boxa" x="20.0" y="20.0" width="150.0" height="56.0" rx="8"/><text x="95.0" y="44.5" text-anchor="middle">1. Storage at</text><text x="95.0" y="59.5" text-anchor="middle">the source</text><path class="arr" d="M172.0,48.0 L208.0,48.0"/><rect class="box" x="210.0" y="20.0" width="150.0" height="56.0" rx="8"/><text x="285.0" y="44.5" text-anchor="middle">2. Primary</text><text x="285.0" y="59.5" text-anchor="middle">collection</text><path class="arr" d="M362.0,48.0 L398.0,48.0"/><rect class="box" x="400.0" y="20.0" width="150.0" height="56.0" rx="8"/><text x="475.0" y="44.5" text-anchor="middle">3. Municipal</text><text x="475.0" y="59.5" text-anchor="middle">storage</text><path class="arr" d="M475.0,78.0 L475.0,118.0"/><rect class="box" x="400.0" y="120.0" width="150.0" height="56.0" rx="8"/><text x="475.0" y="144.5" text-anchor="middle">4. Transport to</text><text x="475.0" y="159.5" text-anchor="middle">processing site</text><path class="arr" d="M398.0,148.0 L362.0,148.0"/><rect class="box" x="210.0" y="120.0" width="150.0" height="56.0" rx="8"/><text x="285.0" y="144.5" text-anchor="middle">5. Processing /</text><text x="285.0" y="159.5" text-anchor="middle">treatment</text><path class="arr" d="M208.0,148.0 L172.0,148.0"/><rect class="boxa" x="20.0" y="120.0" width="150.0" height="56.0" rx="8"/><text x="95.0" y="144.5" text-anchor="middle">6. Final</text><text x="95.0" y="159.5" text-anchor="middle">disposal</text><text x="95.0" y="96.0" text-anchor="middle" class="m">house bins (2–3 colours)</text><text x="285.0" y="96.0" text-anchor="middle" class="m">door-to-door pick-up</text><text x="285.0" y="194.0" text-anchor="middle" class="m">compost, biogas, RDF, burning</text><text x="95.0" y="194.0" text-anchor="middle" class="m">landfill: only what's left</text></svg></div>
<div class="draw">Learn these six in order. "List the functional elements of MSW management" is a classic question.</div>
<h3>The hierarchy of waste management</h3>
<p>The hierarchy ranks the options from best to worst. Always try the top first.</p>
<div class="dia"><svg viewBox="0 0 580 290" role="img" aria-label="Waste management hierarchy: reduce and reuse at the top is best, final disposal at the bottom is the last resort"><path class="boxa" d="M40.0,20.0 L520.0,20.0 L482.0,66.0 L78.0,66.0 Z"/><text x="280.0" y="40.0" text-anchor="middle" style="font-weight:600">Reduce at the source · reuse</text><text x="280.0" y="57.0" text-anchor="middle" class="m">most preferred</text><path class="box" d="M84.0,72.0 L476.0,72.0 L438.0,118.0 L122.0,118.0 Z"/><text x="280.0" y="100.0" text-anchor="middle" style="font-weight:600">Recovery and recycling</text><path class="box" d="M128.0,124.0 L432.0,124.0 L394.0,170.0 L166.0,170.0 Z"/><text x="280.0" y="144.0" text-anchor="middle" style="font-weight:600">Processing (with some recovery)</text><text x="280.0" y="161.0" text-anchor="middle" class="m">compost, biogas, RDF</text><path class="box" d="M172.0,176.0 L388.0,176.0 L350.0,222.0 L210.0,222.0 Z"/><text x="280.0" y="196.0" text-anchor="middle" style="font-weight:600">Transformation (no recovery)</text><text x="280.0" y="213.0" text-anchor="middle" class="m">burn without energy recovery</text><path class="box" d="M216.0,228.0 L344.0,228.0 L306.0,274.0 L254.0,274.0 Z"/><text x="280.0" y="248.0" text-anchor="middle" style="font-weight:600">Final disposal</text><text x="280.0" y="265.0" text-anchor="middle" class="m">landfill: last resort</text><path class="arr" d="M560.0,24.0 L560.0,262.0"/><text x="552.0" y="20.0" text-anchor="end" class="a">best</text><text x="552.0" y="280.0" text-anchor="end" class="b">worst</text></svg></div>
<ol>
<li><b>Reduction at the source, reuse</b>: make less waste in the first place.</li>
<li><b>Recovery and recycling</b>.</li>
<li><b>Waste processing</b> with some recovery (compost, biogas, RDF).</li>
<li><b>Waste transformation</b> without recovery.</li>
<li><b>Final disposal</b>: landfill.</li>
</ol>
<div class="hook">"<b>R</b>educe, <b>R</b>ecycle, <b>P</b>rocess, <b>T</b>ransform, <b>D</b>ispose": "<b>R</b>eal <b>R</b>ecyclers <b>P</b>refer <b>T</b>rash <b>D</b>umped last."</div>`},
{t:"What the photos in deck 1 show", h:`
<p class="src">Deck 1, pp. 10–22. These slides are photos. Each one is a real step you will study later.</p>
<table>

<p><b>Reference books</b> (deck 1, p. 23): Tchobanoglous, Theisen &amp; Vigil, <i>Integrated Solid Waste Management</i>; Vesilind, Worrell &amp; Reinhart, <i>Solid Waste Engineering</i>; the CPHEEO <i>Manual on Municipal Solid Waste Management</i> (Government of India); and the rule books in Gazette publications.</p>`},

/* ───────────────────────── 2. HISTORY OF MSW MANAGEMENT IN INDIA; SWM RULES (DECK 2 PP. 2–15) ───────────────────────── */
M.push({t:"History of MSW management in India; SWM Rules (deck 2, pp. 2–15)", c:[
{t:"The story in one picture", h:`
<p class="src">Deck 2 ("MSW History – Characterization"), pp. 2–15.</p>
<p>The story has one lesson: <b>every technology failed while the waste stayed mixed</b>. Things only start to work once people <b>segregate (separate) waste at the source</b>.</p>
<div class="dia"><svg viewBox="0 0 660 384" role="img" aria-label="Timeline of MSW management in India from land-dumps to the 2026 rules"><path class="ax" d="M132.0,22.0 L132.0,354.0"/><circle cx="132" cy="30" r="6" class="box"/><text x="118.0" y="34.0" text-anchor="end" style="font-weight:600">before 1970s–80s</text><text x="148.0" y="34.0" text-anchor="start">Raw mixed waste dumped on land outside the city</text><circle cx="132" cy="70" r="6" class="box"/><text x="118.0" y="74.0" text-anchor="end" style="font-weight:600">1980s–90s</text><text x="148.0" y="74.0" text-anchor="start">City grows around the dumps → dumps now inside the city; gas + leachate</text><circle cx="132" cy="110" r="6" class="box"/><text x="118.0" y="114.0" text-anchor="end" style="font-weight:600">1980s onwards</text><text x="148.0" y="114.0" text-anchor="start">Windrow composting of mixed waste → poor compost, few buyers</text><circle cx="132" cy="150" r="6" class="box"/><text x="118.0" y="154.0" text-anchor="end" style="font-weight:600">1987</text><text x="148.0" y="154.0" text-anchor="start">Timarpur (Delhi) raw-waste incinerator → failed: heat content too low</text><circle cx="132" cy="190" r="6" class="box"/><text x="118.0" y="194.0" text-anchor="end" style="font-weight:600">1990s</text><text x="148.0" y="194.0" text-anchor="start">Deonar (Mumbai) RDF plant → fuel quality not guaranteed</text><circle cx="132" cy="230" r="6" class="boxa"/><text x="118.0" y="234.0" text-anchor="end" class="a" style="font-weight:600">2000</text><text x="148.0" y="234.0" text-anchor="start">MSW (Management &amp; Handling) Rules: process before landfill; engineered landfills</text><circle cx="132" cy="270" r="6" class="box"/><text x="118.0" y="274.0" text-anchor="end" style="font-weight:600">2012 onwards</text><text x="148.0" y="274.0" text-anchor="start">Raw-waste incinerators again (5-day pit storage) → public protests</text><circle cx="132" cy="310" r="6" class="boxa"/><text x="118.0" y="314.0" text-anchor="end" class="a" style="font-weight:600">2016</text><text x="148.0" y="314.0" text-anchor="start">SWM Rules: segregate at source into 3 bins</text><circle cx="132" cy="350" r="6" class="boxa"/><text x="118.0" y="354.0" text-anchor="end" class="a" style="font-weight:600">2026</text><text x="148.0" y="354.0" text-anchor="start">SWM Rules: 5 streams; dry waste sorted in an MRF</text><text x="148.0" y="376.0" text-anchor="start" class="m">green dots = laws</text></svg></div>
<div class="tip">Short-answer favourite: "Why did early treatment plants in India fail?" Answer: they tried to treat <b>raw mixed MSW</b>, which has low heat content and lots of inerts and moisture. So compost was poor, RDF was poor and incinerators performed badly.</div>`},
{t:"Step 1: dumping on land", h:`
<p class="src">Deck 2, pp. 3–5.</p>
<div class="dia"><svg viewBox="0 0 590 180" role="img" aria-label="Early model: dumps outside the city. Later the city grew and dumps ended up inside the boundary, releasing gas and leachate"><text x="145.0" y="18.0" text-anchor="middle" style="font-weight:600">Before 1970s–80s</text><ellipse cx="120" cy="105" rx="80" ry="62" class="box" style="stroke-dasharray:5 4"/><text x="120.0" y="60.0" text-anchor="middle" class="m">city boundary</text><rect class="boxa" x="72.0" y="85.0" width="96.0" height="36.0" rx="8"/><text x="120.0" y="107.0" text-anchor="middle">MSW (mixed)</text><path class="f2" d="M220,135 Q252,95 284,135 Z"/><text x="252.0" y="152.0" text-anchor="middle" class="b">land-dump</text><path class="arr" d="M170.0,103.0 L238.0,123.0"/><text x="435.0" y="18.0" text-anchor="middle" style="font-weight:600">After 1980s–90s</text><ellipse cx="440" cy="105" rx="120" ry="62" class="box" style="stroke-dasharray:5 4"/><text x="440.0" y="60.0" text-anchor="middle" class="m">city boundary</text><rect class="boxa" x="350.0" y="85.0" width="96.0" height="36.0" rx="8"/><text x="398.0" y="107.0" text-anchor="middle">MSW (mixed)</text><path class="f2" d="M470,135 Q502,95 534,135 Z"/><text x="502.0" y="152.0" text-anchor="middle" class="b">land-dump</text><path class="arr" d="M448.0,103.0 L488.0,123.0"/><text x="502.0" y="92.0" text-anchor="middle" class="m">landfill gas ↑</text><text x="502.0" y="168.0" text-anchor="middle" class="m">leachate ↓</text></svg></div>
<ul>
<li><b>Before the 1970s–80s</b>: raw mixed MSW was simply dumped on land <b>outside the city boundary</b>. Out of sight, out of mind.</li>
<li><b>After the 1980s–90s</b>: cities grew around the dumps. Now the land-dumps are <b>inside the city</b>. They release <b>landfill gas (LFG)</b> into the air and <b>leachate</b> into the soil and groundwater.</li>
<li>Example on the slide: the <b>land-dump at Okhla, Delhi</b>.</li>
</ul>`},
{t:"Step 2: treatment tried on mixed waste, and it failed", h:`
<p class="src">Deck 2, pp. 6–11.</p>
<table>
<tr><th>When / where</th><th>What was tried</th><th>What happened</th></tr>
<tr><td><b>1980s onwards</b></td><td><b>Windrow composting</b> of raw mixed MSW: separation → windrow → green compost → maturation → ripe compost. Rejects went to the land-dump.</td><td><b>Low compost quality, not many takers</b> (buyers)</td></tr>
<tr><td><b>1987, Timarpur, Delhi</b></td><td><b>Raw MSW incineration</b> (waste-to-energy, WtE). Storage pit → incinerator → heat recovered. Bottom ash and fly ash to the land-dump.</td><td><b>Failure: poor heat content</b> of the waste</td></tr>
<tr><td><b>1990s, Deonar, Bombay</b></td><td><b>RDF</b> (refuse derived fuel): drying → separation and shredding → pelletisation. Rejects to land-dump.</td><td><b>Quality not guaranteed</b></td></tr>
<tr><td><b>2012 onwards</b></td><td><b>Raw waste incineration</b> again: manual pre-sorting, then a <b>storage pit with 5-day storage</b> (some moisture is lost as gas) → WtE plant. Ash goes to a sanitary landfill.</td><td><b>Much public protest and agitation</b></td></tr>
</table>
<p><b>Summary slide (p. 11):</b> the technologies competed with each other to treat raw mixed MSW. The results were poor compost (few takers), poor RDF (not a standard product, hard to co-fire), and low-performing incinerators.</p>
<div class="hook">Each failure has a two-word reason: compost → "few takers"; Timarpur → "low heat"; Deonar RDF → "quality unguaranteed"; 2012 incinerators → "public protest".</div>`},
{t:"The rules: 2000, 2016, 2026", h:`
<p class="src">Deck 2, pp. 9, 12–15; also repeated at the start of decks 3, 4 and 5.</p>
<h3>MSW (Management and Handling) Rules, 2000</h3>
<ul>
<li>Waste must be <b>processed before landfilling</b>.</li>
<li><b>No more land-dumping</b>: only <b>engineered landfills</b>.</li>
<li>In practice compost plants, RDF plants and land-dumping all continued.</li>
</ul>
<h3>Solid Waste Management (SWM) Rules, 2016</h3>
<ul>
<li><b>Segregate right at source</b> into a <b>3-container system</b>.</li>
<li>Biodegradables (wet) go to composting, biomethanation or bio-processing, <b>preferably decentralised</b> (done locally, close to where the waste is made).</li>
<li>Dry waste goes for sorting and separation. Combustible parts go to incineration, pyrolysis or RDF making.</li>
<li>RDF can be incinerated or <b>co-combusted</b> (burnt along with another fuel, like coal in a cement kiln).</li>
<li>Used sanitary pads and napkins: <b>wrap them and put them in the DRY waste container</b>.</li>
</ul>
<p><b>Treatment techniques become complementary</b> (p. 13): composting, RDF and incineration now each take the part of the waste that suits them, instead of competing for mixed waste. Segregation at source is the key, but it is <b>not happening in most cities</b>: "mixed waste is the reality", so the municipality ends up trying to separate it.</p>
<h3>SWM Rules, 2026</h3>
<ul>

<li>Components with heat content <b>above 1500 kcal/kg cannot be landfilled</b> (decks 4–5): they must be burnt or turned into fuel.</li>
</ul>`},

/* ───────────────────────── 3. ANALYSING MSW: COMPOSITION, PROXIMATE, ULTIMATE, HEAT, TANNER (DECK 2 PP. 16–32) ───────────────────────── */
M.push({t:"Analysing MSW: what's in it (deck 2, pp. 16–32)", c:[
{t:"Why analyse waste at all?", h:`
<p class="src">Deck 2, pp. 16–17.</p>
<p>Before you choose a treatment, you must know what the waste is made of. You can't burn waste that is mostly water and stones, and you can't compost plastic. The analysis answers two big questions: <b>is it incinerable?</b> and <b>is it compostable?</b></p>
<h3>Things we work out about MSW (p. 16)</h3>
<ul>
<li>Component analysis (composition)</li>
<li>Ultimate and proximate analysis</li>
<li>Heat content, on a wet basis, dry basis and so on</li>
<li>Specific heat</li>
<li>Air needed to burn 1 kg of MSW at stoichiometry, and the flue gas this makes</li>
<li>Combustion temperature when no auxiliary (extra) fuel is supplied</li>
<li>Bottom ash and fly ash per ton of MSW burnt</li>
<li><b>C/N</b> ratio (carbon to nitrogen)</li>
<li>Air needed for composting per ton; methane made by anaerobic composting per ton</li>
<li>→ <b>INCINERABILITY</b> and <b>COMPOSTABILITY</b></li>
</ul>
<h3>Indian MSW vs MSW in rich countries (p. 17)</h3>
<p>The slide gives the Indian value first and a second value in brackets. The bracket values (high heat, many plastics, few inerts) match MSW in rich countries like the US.</p>
<table>
<tr><th>Property</th><th class="r">Indian raw mixed MSW</th><th class="r">(in brackets)</th></tr>
<tr><td>Heat content</td><td class="r"><b>~1300 kcal/kg</b></td><td class="r">2400–3000 kcal/kg</td></tr>
<tr><td>Bulk density</td><td class="r"><b>~200–350 kg/m³</b></td><td class="r">100–200 kg/m³</td></tr>
<tr><td>Biodegradables</td><td class="r"><b>~35–50%</b></td><td class="r">0–10%</td></tr>
<tr><td>Inerts</td><td class="r"><b>~25–40%</b></td><td class="r">0–10%</td></tr>
<tr><td>Moisture</td><td class="r"><b>~30–60%</b></td><td class="r">5–15%</td></tr>
<tr><td>Plastics</td><td class="r"><b>4–8%</b></td><td class="r">10–20%</td></tr>
</table>
<div class="key">Indian MSW is <b>wet, heavy, full of food and dirt, and low in heat</b>. That's why burning raw Indian MSW keeps failing, and why biological treatment suits the wet part.</div>
<div class="tip">Learn the Indian column exactly. "What is the typical heat content of Indian raw MSW?" → about <b>1300 kcal/kg</b>. "Typical moisture?" → <b>30–60%</b>.</div>`},
{t:"Sampling, and two ways to characterise", h:`
<p class="src">Deck 2, pp. 18–20, 25.</p>
<h3>Sampling (p. 18)</h3>
<ul>
<li>Sample size: <b>10 kg × 10 numbers = 100 kg</b>.</li>
<li>How many samples: use statistical methods. In practice, <b>12 samples</b> from an area of similar nature.</li>
<li>Sample in <b>summer, the rainy season and winter</b>, because the waste changes with the season.</li>
<li>Always <b>mention the year</b> of sampling.</li>
</ul>
<h3>Two ways to characterise waste</h3>
<div class="vs">
<div><h3>1. Laboratory analysis</h3>
<ul>
<li><b>Bomb calorimeter</b> → heat content</li>
<li><b>CHNS analyser</b> → % C, H, N, S (ultimate analysis)</li>
<li><b>Ovens and furnaces</b> → moisture (oven drying), volatiles and ash (furnace)</li>
</ul></div>
<div><h3>2. Theoretical estimation</h3>
<ul>
<li>Start from the <b>component analysis</b> (how much paper, food, glass…).</li>
<li>Use standard tables for each component's moisture, heat content and C, H, O, N, S.</li>
<li><b>Add them up</b> to get the properties of the mixed MSW.</li>
<li>You are free to estimate it the way you plan to treat the waste (for example, after removing metals).</li>
</ul></div>
</div>
<div class="tip">The worked numerical in Module 4 is exactly this theoretical estimation.</div>`},
{t:"Component, proximate and ultimate analysis", h:`
<p class="src">Deck 2, pp. 21–24.</p>
<table>
<tr><th>Analysis</th><th>What it splits the waste into</th><th>Basis</th></tr>
<tr><td><b>Component</b></td><td>Paper, glass, leather, food (biodegradables), plastics, metals, etc.</td><td>As discarded</td></tr>
<tr><td><b>Proximate</b></td><td><b>% volatiles, % water (moisture), % inerts</b>. Total = 100%.</td><td>As discarded (wet)</td></tr>
<tr><td><b>Ultimate</b></td><td><b>% C, % H, % O, % N, % S and % inerts</b></td><td>Dry (water removed first)</td></tr>
</table>
<div class="dia"><svg viewBox="0 0 580 296" role="img" aria-label="Proximate analysis splits wet waste into moisture, volatiles and inerts; ultimate analysis splits dry waste into C, H, O, N, S and inerts; numbers from the worked example"><text x="135.0" y="18.0" text-anchor="middle" style="font-weight:600">Proximate</text><text x="135.0" y="33.0" text-anchor="middle" class="m">as discarded (wet) basis</text><rect class="Lwater" x="70.0" y="44.0" width="130.0" height="57.8" rx="0"/><text x="135.0" y="76.9" text-anchor="middle">Moisture 24.1%</text><rect class="f1" x="70.0" y="101.8" width="130.0" height="95.8" rx="0"/><text x="135.0" y="153.7" text-anchor="middle">Volatile matter 39.9%</text><rect class="Lsub" x="70.0" y="197.6" width="130.0" height="86.4" rx="0"/><text x="135.0" y="244.8" text-anchor="middle">Inerts (ash) 36.0%</text><text x="435.0" y="18.0" text-anchor="middle" style="font-weight:600">Ultimate</text><text x="435.0" y="33.0" text-anchor="middle" class="m">dry basis (water removed first)</text><rect class="f2" x="370.0" y="44.0" width="130.0" height="72.7" rx="0"/><text x="435.0" y="84.4" text-anchor="middle">C 30.3%</text><rect class="f3" x="370.0" y="116.7" width="130.0" height="9.1" rx="0"/><text x="508.0" y="125.3" text-anchor="start" class="m">H 3.8%</text><rect class="f1" x="370.0" y="125.8" width="130.0" height="41.5" rx="0"/><text x="435.0" y="150.6" text-anchor="middle">O 17.3%</text><rect class="f2" x="370.0" y="167.4" width="130.0" height="2.2" rx="0"/><text x="492.0" y="172.4" text-anchor="end" class="m">N 0.9%</text><rect class="f3" x="370.0" y="169.5" width="130.0" height="0.5" rx="0"/><text x="508.0" y="173.8" text-anchor="start" class="m">S 0.2%</text><rect class="Lsub" x="370.0" y="170.0" width="130.0" height="113.8" rx="0"/><text x="435.0" y="230.9" text-anchor="middle">Inerts 47.4%</text><text x="280.0" y="230.0" text-anchor="middle" class="m">same waste,</text><text x="280.0" y="245.0" text-anchor="middle" class="m">two ways</text><text x="280.0" y="260.0" text-anchor="middle" class="m">of splitting it</text></svg></div>
<p class="src">Drawn to scale with the numbers from the worked example in Module 4.</p>
<ul>
<li><b>Volatile matter</b> is the part that burns off as gas when heated. It is made of C, H, O, N and S.</li>
<li>So the ultimate analysis is really a <b>close-up of the volatile part</b> (plus the inerts), done after drying.</li>
</ul>
<div class="hook"><b>P</b>roximate = <b>3</b> parts (moisture, volatiles, inerts), wet. <b>U</b>ltimate = the <b>elements</b> (C, H, O, N, S, inerts), dry. "Ultimate goes down to the <b>ultimate</b> building blocks: atoms."</div>
<div class="draw">Draw the two bars side by side (as on p. 24): proximate as moisture + volatile matter + inerts; ultimate as C + O + H + N + S + inerts, and label "as discarded" vs "dry".</div>`},

<div class="tip">In the exam these tables will be <b>given to you</b> with the question, as on pp. 33–34. What you must know is <b>how to use them</b> (Module 4) and the patterns: plastics have the most heat, food has the most water, glass and metals are almost all inerts.</div>`},
{t:"Is it incinerable? Rule of thumb and Tanner triangle", h:`
<p class="src">Deck 2, pp. 31–32 (repeated in deck 5, pp. 5–6).</p>
<h3>Rule of thumb (heat content of the waste)</h3>
<div class="dia"><svg viewBox="0 0 640 250" role="img" aria-label="Heat content rule: below 1300 kcal per kg do not incinerate, 1300 to 2400 needs auxiliary fuel, above 2400 burns on its own; Indian raw MSW sits near or below 1300, RDF well above 2400"><path class="z1" d="M20.0,126.0 L192.2,126.0 L192.2,42.0 L20.0,42.0Z"/><path class="z2" d="M192.2,126.0 L337.9,126.0 L337.9,42.0 L192.2,42.0Z"/><path class="z3" d="M337.9,126.0 L616.0,126.0 L616.0,42.0 L337.9,42.0Z"/><text x="106.1" y="68.4" text-anchor="middle" class="">not advisable</text><text x="265.0" y="68.4" text-anchor="middle" class="">needs extra fuel</text><text x="476.9" y="68.4" text-anchor="middle" class="">burns on its own</text><text x="476.9" y="92.4" text-anchor="middle" class="m">(autogenous)</text><path class="ax" d="M20.0,126.0 L616.0,126.0"/><path class="ax" d="M20.0,126.0 L20.0,118.8"/><text x="20.0" y="36.0" text-anchor="middle" class="m">0</text><path class="ax" d="M152.4,126.0 L152.4,118.8"/><text x="152.4" y="36.0" text-anchor="middle" class="m">1000</text><path class="ax" d="M284.9,126.0 L284.9,118.8"/><text x="284.9" y="36.0" text-anchor="middle" class="m">2000</text><path class="ax" d="M417.3,126.0 L417.3,118.8"/><text x="417.3" y="36.0" text-anchor="middle" class="m">3000</text><path class="ax" d="M549.8,126.0 L549.8,118.8"/><text x="549.8" y="36.0" text-anchor="middle" class="m">4000</text><text x="192.2" y="22.0" text-anchor="middle" class="b">1300</text><text x="337.9" y="22.0" text-anchor="middle" class="a">2400</text><text x="616.0" y="22.0" text-anchor="end" class="m">kcal/kg</text><path class="thin" d="M126.0,126.0 L126.0,180.0"/><circle class="dot" cx="126.0" cy="126.0" r="3"/><text x="130.0" y="190.0" text-anchor="start" class="m">Timarpur actual 700–900</text><path class="thin" d="M152.4,126.0 L152.4,164.0"/><circle class="dot" cx="152.4" cy="126.0" r="3"/><text x="156.4" y="174.0" text-anchor="start" class="m">SELCO raw ~1000</text><path class="thin" d="M192.2,126.0 L192.2,148.0"/><circle class="dot" cx="192.2" cy="126.0" r="3"/><text x="196.2" y="158.0" text-anchor="start" class="m">Okhla ~1300</text><path class="thin" d="M205.4,126.0 L205.4,132.0"/><circle class="dot" cx="205.4" cy="126.0" r="3"/><text x="209.4" y="142.0" text-anchor="start" class="m">Jabalpur ~1400</text><path class="thin" d="M450.4,126.0 L450.4,132.0"/><circle class="dot" cx="450.4" cy="126.0" r="3"/><text x="454.4" y="142.0" text-anchor="end" class="m">RDF fluff 3000–3500</text><path class="thin" d="M549.8,126.0 L549.8,148.0"/><circle class="dot" cx="549.8" cy="126.0" r="3"/><text x="553.8" y="158.0" text-anchor="end" class="m">RDF pellets ~4000</text></svg></div>
<table>
<tr><th>Heat content</th><th>Verdict</th></tr>
<tr><td><b>Below 1300 kcal/kg</b></td><td>Incineration <b>not advisable</b></td></tr>
<tr><td><b>1300–2400 kcal/kg</b></td><td>Incineration possible <b>with auxiliary fuel</b> (extra fuel like oil to keep it burning)</td></tr>
<tr><td><b>Above 2400 kcal/kg</b> (10,048 kJ/kg)</td><td><b>Autogenous</b> incineration: it burns on its own heat</td></tr>
</table>
<div class="err">The slide writes 1300 kcal/kg next to "6280 kJ/kg". But 1300 kcal/kg is 1300 × 4.187 ≈ <b>5443 kJ/kg</b>; 6280 kJ/kg is really 1500 kcal/kg. The worked example (Module 4) uses 6280 kJ/kg and 10,048 kJ/kg. Its conclusions come out the same either way. In the exam, write down which limit you use.</div>
<h3>Tanner diagram (fuel triangle)</h3>
<p>The Tanner triangle uses the <b>proximate analysis</b>. Each corner is 100% of one thing: water, ash or combustibles. Any waste is one point inside. If the point lies in the shaded zone, the waste <b>burns without extra fuel</b>.</p>

chor="end" style="font-weight:600">100% combustibles</text><text x="420.0" y="238.0" text-anchor="start"></text><text x="430.0" y="242.0" text-anchor="start" class="a">water ≤ 50%</text><text x="218.0" y="321.2" text-anchor="end" class="a">combustibles ≥ 25%</text><text x="300.0" y="462.0" text-anchor="middle" class="a">ash ≤ 60%</text><rect class="z3" x="554.0" y="236.0" width="14.0" height="14.0" rx="2"/><text x="574.0" y="248.0" text-anchor="start" class="a">shaded zone = burns</text><text x="574.0" y="263.0" text-anchor="start" class="a">without extra fuel</text><circle cx="302.4" cy="300.4" r="5.5" style="fill:#2e9e4f"/><circle cx="560" cy="60" r="5.5" style="fill:#2e9e4f"/><text x="572.0" y="64.0" text-anchor="start">Delhi MSW</text><circle cx="367.2" cy="346.2" r="5.5" style="fill:#d13b3b"/><circle cx="560" cy="80" r="5.5" style="fill:#d13b3b"/><text x="572.0" y="84.0" text-anchor="start">US MSW</text><circle cx="376.8" cy="271.3" r="5.5" style="fill:#8a8a8a"/><circle cx="560" cy="100" r="5.5" style="fill:#8a8a8a"/><text x="572.0" y="104.0" text-anchor="start">Kuala Lumpur</text><circle cx="405.6" cy="396.1" r="5.5" style="fill:#8a3fb0"/><circle cx="560" cy="120" r="5.5" style="fill:#8a3fb0"/><text x="572.0" y="124.0" text-anchor="start">Hospital waste</text><circle cx="453.6" cy="412.7" r="5.5" style="fill:#1f8a8a"/><circle cx="560" cy="140" r="5.5" style="fill:#1f8a8a"/><text x="572.0" y="144.0" text-anchor="start">Rice husk</text><circle cx="271.2" cy="421.0" r="5.5" style="fill:#8a5a2b"/><circle cx="560" cy="160" r="5.5" style="fill:#8a5a2b"/><text x="572.0" y="164.0" text-anchor="start">Sewage sludge</text><text x="556.0" y="196.0" text-anchor="start" class="m">positions read off</text><text x="556.0" y="211.0" text-anchor="start" class="m">the slide's chart</text></svg></div>
<p>The usual limits of the zone (standard Tanner limits, which match the line on the slide): <b>water ≤ 50%</b>, <b>ash ≤ 60%</b>, <b>combustibles ≥ 25%</b>.</p>
<p>On the slide's chart, US MSW, rice husk and hospital waste sit well inside the zone. Delhi MSW and (dried) sewage sludge sit inside but close to the edge: Delhi because of its moisture and ash, sludge because of its ash. Kuala Lumpur MSW is near the 50% water line.</p>

M.push({t:"Worked numerical: analysing a waste sample (deck 2, pp. 33–43)", c:[
{t:"The question and the plan", h:`
<p class="src">Deck 2, pp. 33–43. This is the most likely Major numerical. Learn the <b>method</b>; the numbers will change.</p>
<div class="prob"><b>Question</b>Perform ultimate and proximate analysis on the waste sample below. Then: (a) Is it directly incinerable? If not, how can you make it incinerable? (b) Write a chemical formula for the volatile fraction. (c) Is it suitable for composting? (d) How much ash forms if 2000 tons/day is burnt?</div>
<div class="tw"><table>
<tr><th>Component</th><th class="r">Wt as discarded</th><th class="r">Moisture %</th><th class="r">Heat, as discarded (Btu/lb)</th></tr>
<tr><td>Paper</td><td class="r">4 kg</td><td class="r">7</td><td class="r">6500</td></tr>
<tr><td>Cardboard</td><td class="r">8 kg</td><td class="r">6</td><td class="r">7000</td></tr>
<tr><td>Glass</td><td class="r">4 kg</td><td class="r">3</td><td class="r">75</td></tr>
<tr><td>Plastics</td><td class="r">1 kg</td><td class="r">3</td><td class="r">14000</td></tr>
<tr><td>Aluminium</td><td class="r">3 kg</td><td class="r">3</td><td class="r">100</td></tr>
<tr><td>Ferrous metals</td><td class="r">8 kg</td><td class="r">3</td><td class="r">100</td></tr>
<tr><td>Food wastes</td><td class="r">40 kg</td><td class="r">52</td><td class="r">2500</td></tr>
<tr><td>Dirt / ash</td><td class="r">35 kg</td><td class="r">8</td><td class="r">1000</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r"><b>103 kg</b></td><td></td><td></td></tr>
</table></div>
<p>You are also given the ultimate analysis (dry basis) of each component: the table on the last card of Module 3.</p>
<h3>The plan, in 7 steps</h3>
<ol>
<li>Dry weight of each component.</li>
<li>Heat of each component (kJ), then the total.</li>
<li>Mass of C, H, O, N, S and inerts in each component, then the totals.</li>
<li>Proximate analysis (% moisture, inerts, volatiles of the wet waste).</li>
<li>Ultimate analysis (% of each element in the dry waste).</li>
<li>Heat content per kg → incinerability, and how to improve it.</li>
<li>Formula, C/N, ash.</li>
</ol>`},
{t:"Steps 1–2: dry weight and heat", h:`
<div class="eq">Dry weight = wet weight × (1 − moisture/100)</div>
<div class="eq">Heat (kJ) = wet weight (kg) × 2.204 × Btu/lb × 1.055</div>
<p>The heat values are on an <b>"as discarded" basis</b>, so you multiply by the <b>wet</b> weight, not the dry weight.</p>
<div class="tw"><table>
<tr><th>Component</th><th class="r">Wet (kg)</th><th class="r">Moisture</th><th class="r">Dry (kg)</th><th class="r">Heat (kJ)</th></tr>
<tr><td>Paper</td><td class="r">4</td><td class="r">7%</td><td class="r">3.72</td><td class="r">60,450</td></tr>
<tr><td>Cardboard</td><td class="r">8</td><td class="r">6%</td><td class="r">7.52</td><td class="r">130,200</td></tr>
<tr><td>Glass</td><td class="r">4</td><td class="r">3%</td><td class="r">3.88</td><td class="r">698</td></tr>
<tr><td>Plastics</td><td class="r">1</td><td class="r">3%</td><td class="r">0.97</td><td class="r">32,550</td></tr>
<tr><td>Aluminium</td><td class="r">3</td><td class="r">3%</td><td class="r">2.91</td><td class="r">698</td></tr>
<tr><td>Ferrous metals</td><td class="r">8</td><td class="r">3%</td><td class="r">7.76</td><td class="r">1,860</td></tr>
<tr><td>Food wastes</td><td class="r">40</td><td class="r">52%</td><td class="r">19.2</td><td class="r">232,500</td></tr>
<tr><td>Dirt / ash</td><td class="r">35</td><td class="r">8%</td><td class="r">32.2</td><td class="r">81,375</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r"><b>103</b></td><td></td><td class="r"><b>78.16</b></td><td class="r"><b>540,330</b></td></tr>
</table></div>
<details class="work"><summary>Show two rows worked out</summary>
<ol>
<li>Paper dry = 4 × (1 − 0.07) = 4 × 0.93 = <b>3.72 kg</b>. Heat = 4 × 2.204 × 6500 × 1.055 = <b>60,450 kJ</b>.</li>
<li>Food dry = 40 × 0.48 = <b>19.2 kg</b>. Heat = 40 × 2.204 × 2500 × 1.055 = <b>232,500 kJ</b>.</li>
</ol></details>
<div class="tip">Food is 39% of the weight but carries 43% of the heat. Paper, cardboard and plastics are only 13% of the weight but give 41% of the heat. Glass and metals give almost nothing.</div>`},
{t:"Step 3: element masses", h:`
<div class="eq">Mass of element = dry weight × (% element / 100)</div>
<p>Use the <b>dry</b> weight, because the ultimate analysis table is on a dry basis.</p>
<div class="tw"><table>
<tr><th>Component (dry kg)</th><th class="r">C</th><th class="r">H</th><th class="r">O</th><th class="r">N</th><th class="r">S</th><th class="r">Inerts</th></tr>
<tr><td>Paper (3.72)</td><td class="r">1.62</td><td class="r">0.22</td><td class="r">1.64</td><td class="r">0.011</td><td class="r">0.007</td><td class="r">0.22</td></tr>
<tr><td>Cardboard (7.52)</td><td class="r">3.31</td><td class="r">0.44</td><td class="r">3.35</td><td class="r">0.023</td><td class="r">0.015</td><td class="r">0.38</td></tr>
<tr><td>Glass (3.88)</td><td class="r">0.02</td><td class="r">0.004</td><td class="r">0.016</td><td class="r">0.004</td><td class="r">–</td><td class="r">3.84</td></tr>
<tr><td>Plastics (0.97)</td><td class="r">0.58</td><td class="r">0.07</td><td class="r">0.22</td><td class="r">–</td><td class="r">–</td><td class="r">0.10</td></tr>
<tr><td>Aluminium (2.91)</td><td class="r">0.13</td><td class="r">0.017</td><td class="r">0.13</td><td class="r">0.003</td><td class="r">–</td><td class="r">2.63</td></tr>
<tr><td>Ferrous (7.76)</td><td class="r">0.35</td><td class="r">0.047</td><td class="r">0.33</td><td class="r">0.008</td><td class="r">–</td><td class="r">7.02</td></tr>
<tr><td>Food (19.2)</td><td class="r">9.22</td><td class="r">1.23</td><td class="r">7.22</td><td class="r">0.499</td><td class="r">0.077</td><td class="r">0.96</td></tr>
<tr><td>Dirt (32.2)</td><td class="r">8.47</td><td class="r">0.97</td><td class="r">0.64</td><td class="r">0.161</td><td class="r">0.064</td><td class="r">21.90</td></tr>
<tr class="hl"><td><b>Total</b></td><td class="r"><b>23.7</b></td><td class="r"><b>3.0</b></td><td class="r"><b>13.55</b></td><td class="r"><b>0.705</b></td><td class="r"><b>0.167</b></td><td class="r"><b>37.05</b></td></tr>
</table></div>
<p>Check: 23.7 + 3 + 13.55 + 0.705 + 0.167 + 37.05 = 78.17 kg ≈ the total dry weight (78.16). Good.</p>
<details class="work"><summary>Show one row worked out</summary>
<ol><li>Food: C = 19.2 × 0.48 = 9.22; H = 19.2 × 0.064 = 1.23; O = 19.2 × 0.376 = 7.22; N = 19.2 × 0.026 = 0.499; S = 19.2 × 0.004 = 0.077; inerts = 19.2 × 0.05 = 0.96.</li></ol></details>`},
{t:"Steps 4–5: proximate and ultimate analysis", h:`
<h3>Proximate analysis (of the wet waste, 103 kg)</h3>
<div class="eq">% Moisture = (103 − 78.16) / 103 × 100 = <b>24.12%</b></div>
<div class="eq">% Inerts = 37.05 / 103 × 100 = <b>35.97%</b></div>
<div class="eq">% Volatiles = 100 − (24.12 + 35.97) = <b>39.91%</b></div>
<h3>Ultimate analysis (of the dry waste, 78.16 kg)</h3>
<table>
<tr><th>Element</th><th>Working</th><th class="r">%</th></tr>
<tr><td>Carbon</td><td>23.7 / 78.16 × 100</td><td class="r"><b>30.32</b></td></tr>
<tr><td>Hydrogen</td><td>3 / 78.16 × 100</td><td class="r"><b>3.84</b></td></tr>
<tr><td>Oxygen</td><td>13.55 / 78.16 × 100</td><td class="r"><b>17.34</b></td></tr>
<tr><td>Nitrogen</td><td>0.705 / 78.16 × 100</td><td class="r"><b>0.90</b></td></tr>
<tr><td>Sulphur</td><td>0.167 / 78.16 × 100</td><td class="r"><b>0.21</b></td></tr>
<tr><td>Inerts</td><td>37.05 / 78.16 × 100</td><td class="r"><b>47.4</b></td></tr>
</table>
<div class="key">The <b>denominator</b> is the trap. Proximate divides by the <b>wet</b> total (103 kg). Ultimate divides by the <b>dry</b> total (78.16 kg).</div>`},
{t:"Step 6: is it incinerable? How to make it so", h:`
<p>Compare the heat content per kg with the rule of thumb in kJ (slide values): <b>below 6280 kJ/kg</b> not recommended; <b>above 10,048 kJ/kg</b> (2400 kcal/kg) autogenous; in between needs auxiliary fuel.</p>
<table>
<tr><th>Case</th><th>Working</th><th class="r">kJ/kg</th><th>Verdict</th></tr>
<tr><td>1. Raw, as received</td><td>540,330 / 103</td><td class="r"><b>5246</b></td><td>Below 6280 → <b>not incinerable</b> as such</td></tr>
<tr><td>2. After drying</td><td>540,330 / 78.16</td><td class="r"><b>6913</b></td><td>Above 6280 → incinerable <b>with auxiliary fuel</b></td></tr>
<tr><td>3. Dried + ferrous metals removed (magnetic separator)</td><td>(540,330 − 1860) / (78.16 − 7.76)</td><td class="r"><b>7649</b></td><td>Better, still needs auxiliary fuel</td></tr>
<tr><td>4. Dried + <b>all</b> inerts removed (air classifier)</td><td>(540,330 − 84,631) / (78.16 − 46.75)</td><td class="r"><b>14,508</b></td><td>Above 10,048 → <b>burns on its own</b>; heat can make power</td></tr>
</table>
<p>In case 4, "all inerts" = glass + aluminium + ferrous + dirt. Their heat = 698 + 698 + 1860 + 81,375 = <b>84,631 kJ</b>. Their dry mass = 3.88 + 2.91 + 7.76 + 32.2 = <b>46.75 kg</b>.</p>
<div class="key">Two ways to raise heat content: <b>remove water</b> (drying) and <b>remove inerts</b> (magnetic separator for iron; air classifier for all heavy non-burnables). The catch: removing all inerts after drying is <b>costly</b>.</div>
<div class="tip">Write the verdict in words after each number. Examiners give marks for "not incinerable as such → dry it → still needs auxiliary fuel → remove inerts → autogenous".</div>`},
{t:"Step 7: formula, C/N and ash", h:`
<h3>(b) Chemical formula of the volatile fraction</h3>
<p>Divide each element's mass by its atomic weight (C 12, H 1, O 16, N 14, S 32) to get relative moles:</p>
<table>
<tr><th></th><th class="r">C</th><th class="r">H</th><th class="r">O</th><th class="r">N</th><th class="r">S</th></tr>
<tr><td>Mass (kg)</td><td class="r">23.7</td><td class="r">3</td><td class="r">13.55</td><td class="r">0.705</td><td class="r">0.167</td></tr>
<tr><td>÷ atomic wt</td><td class="r">1.975</td><td class="r">3</td><td class="r">0.847</td><td class="r">0.050</td><td class="r">0.005</td></tr>
<tr class="hl"><td>÷ 0.005 (make S = 1)</td><td class="r">395</td><td class="r">600</td><td class="r">169.4</td><td class="r">10</td><td class="r">1</td></tr>
</table>
<div class="eq">Formula: C<sub>395</sub> H<sub>600</sub> O<sub>169.4</sub> N<sub>10</sub> S</div>
<p class="src">The slide rounds S to 0.005 mol (exact: 0.167/32 = 0.0052). Without sulphur, setting N = 1 gives about C<sub>39</sub>H<sub>59</sub>O<sub>17</sub>N. Either form is fine if you show the method.</p>
<h3>(c) Is it compostable?</h3>
<p>For aerobic composting you need <b>C/N ≈ 30</b> (26–31) and <b>moisture 45–55%</b>. The slide leaves the C/N blank (" = ?? "). Using the totals:</p>
<div class="eq">C/N = 23.7 / 0.705 ≈ <b>33.6</b></div>
<ul>
<li>C/N 33.6 is a little <b>above</b> the optimum → add a <b>nitrogen source</b> (slaughterhouse waste, fish scraps, urine…).</li>
<li>Moisture is <b>24%</b>, below 45–55% → <b>add water</b>.</li>
<li>If C/N were below the optimum, you would add a <b>carbon source</b> (straw, sawdust, paper).</li>
</ul>
<p class="src">Strictly, only the biodegradable parts take part in composting. Using only paper, cardboard and food: C = 14.14 kg, N = 0.533 kg, C/N ≈ 26.5, inside the range. Mention this as a refinement if you have time.</p>
<h3>(d) Ash if 2000 tons/day is burnt</h3>
<div class="eq">Ash per kg raw = 37.05 / 103 = 0.36 kg → 360 kg per ton</div>
<div class="eq">Ash per day = 360 kg/t × 2000 t/day = 720,000 kg = <b>720 tons/day</b></div>
<p>Over a third of the waste comes back out as ash, which still has to be landfilled.</p>
<p class="src">p. 43 lists more things you could be asked to compute: air needed to burn 1 kg at stoichiometry, flue gas made, air needed for composting per ton, and methane from anaerobic composting per ton. The last two are worked in Module 7.</p>`},
